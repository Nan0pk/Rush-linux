# Rush Linux LiveDev — RUSH-DATA persistent directory layout
#
# /RUSH-DATA is the persistent data partition for LiveDev. It survives
# reboots and holds the repo clone, state, results, logs, AI attempts,
# secrets (never committed), and cache.
#
# The partition is expected to be mounted by a systemd mount unit or
# fstab entry. This tmpfiles.conf creates the subdirectory structure
# if it does not exist.
#
# Layout:
#   /RUSH-DATA/repo            — git working tree (the Rush Linux repo clone)
#   /RUSH-DATA/state           — rush-capture/rush-autopilot state files
#   /RUSH-DATA/state/livedev   — livedev-state.json (post-reboot test intent)
#   /RUSH-DATA/results         — evidence bundles (validated by validate-hwtest-evidence.py)
#   /RUSH-DATA/results/livedev — per-run livedev artifact directories + bundles
#   /RUSH-DATA/logs            — rush-exec/rush-capture/rush-agent logs
#   /RUSH-DATA/ai              — AI attempt records (dev-if-fail)
#   /RUSH-DATA/secrets         — provider credentials, signing keys (never committed, 0700)
#   /RUSH-DATA/cache           — package cache, build artifacts

d /RUSH-DATA                   0755 root root -
d /RUSH-DATA/repo              0755 root root -
d /RUSH-DATA/state             0755 root root -
d /RUSH-DATA/state/livedev     0755 root root -
d /RUSH-DATA/results           0755 root root -
d /RUSH-DATA/results/livedev   0755 root root -
d /RUSH-DATA/logs              0755 root root -
d /RUSH-DATA/ai                0755 root root -
d /RUSH-DATA/secrets           0700 root root -
d /RUSH-DATA/cache             0755 root root -
