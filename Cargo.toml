[workspace]
members = [
    "crates/optid",
    "crates/optctl",
    "crates/rushbench",
    "crates/rush_collect",
]
# `crates/rush_telemetry` is an experimental, partially-implemented stub (BPF
# loader, RAPL/HFI/PSI collectors, transport signing). It does not yet compile
# cleanly: missing `libc` dependency, BPF skeleton codegen incomplete. It is
# intentionally excluded from the workspace so `cargo {check,test,clippy}
# --workspace` (CI's command) stays green. Re-include once the crate builds and
# its tests pass — see docs/research/0008-telemetry-design.md (when it lands).
exclude = [
    "crates/rush_telemetry",
]
resolver = "2"

[workspace.package]
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/Nan0pk/Rush-linux"
rust-version = "1.78"
version = "0.7.0-beta.1"
