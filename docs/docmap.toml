# Rush Linux active documentation map
#
# This map covers maintained public, architecture, workflow, and release
# documents. Individual ADRs and research papers belong in their directory
# indexes. Archives, historical plans, inbox notes, and fixtures are not active
# truth and are intentionally absent.
#
# Fields:
#   purpose       = short ownership statement
#   owner_area    = project area
#   covers_code   = source paths whose documented behavior lives here
#   deps          = files this document depends on; they need not be mapped
#   last_verified = date this document was checked against repository truth

[docs."README.md"]
purpose = "Practical user entry point and generated current status"
owner_area = "area:docs"
covers_code = ["tools/livedev-bootstrap.sh", "tools/livedev-bootstrap.ps1", "tools/rush-host-bench.sh", "tools/start-work.sh", "tools/finish-work.sh", "tools/build-mkosi-image.sh"]
deps = ["docs/frontpage/project.toml", "VERSION", "docs/plans/optid-package-status.toml"]
last_verified = "2026-07-26"

