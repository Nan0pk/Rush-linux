# Rush Linux Documentation Map
#
# This is the single source of truth for doc ownership, coverage, and
# cross-references. When any doc changes, check the deps and freshens lists
# to find what else needs updating.
#
# Schema:
#   [docs.<path>]
#   purpose       = "one-line description"
#   owner_area    = "area tag" (matches GitHub labels)
#   covers_code   = ["paths that this doc describes"]
#   deps          = ["other docs whose content this doc depends on"]
#   freshens      = ["other docs that should be refreshed when this doc changes"]
#   last_verified = "YYYY-MM-DD" (set when a human or agent confirms accuracy)
#   validator     = "hint" for the sync checker (version_match, status_match, etc.)
#
# Guidelines:
# - When you add a new doc, add an entry here.
# - When you change a doc, update its last_verified date.
# - When you change code, check covers_code to find affected docs.
# - When you change a doc, check freshens to find dependent docs.

