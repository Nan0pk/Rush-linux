# Run `python3 tools/render-frontpage.py --write` to regenerate README.md.
# Run `python3 tools/render-frontpage.py --check` to verify it is in sync.
#
# The generator ALSO scans deterministic repo locations (mkosi profiles,
# packaging/systemd, .github/workflows, tools/, docs/) so the generated
# output reflects the actual repo state. This manifest holds the prose
# that cannot be derived mechanically (intro sentences, links, ordering).

schema_version: 1
project:
  name: Rush Linux
  tagline: "adaptive power & performance for Arch"
  description: |
    Rush Linux is an Arch-based distribution that watches what you're doing
    and tunes the hardware to match. Fast CPU when you're compiling. Tight
    latency when you're on a video call. Idle states when you're reading.
    No manual power profiles to flip between — every decision is logged,
    explained, and reversible.

sections:
