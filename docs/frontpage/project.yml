  - kind: livedev
    title: Rush LiveDev
    intro: |
      Deterministic hardware-test and benchmark-campaign workflow with
      two operator paths: `--run-vm` (QEMU-driven, for CI/dev) and
      `--auto`/`--resume` (USB-based, for real hardware).

