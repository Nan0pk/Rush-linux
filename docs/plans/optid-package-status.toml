safety_architecture = "D2-fail-passive"
# Post-#338 review: F1 was `completed` against PR #332's cold-verification
# receipt, but the receipt is stale (subsequent PRs modified F1's runtime
# entrypoints and PR #337 deleted the receipt-referenced integration test
# file). F1 is now `merged_incomplete` until a fresh cold verification
# receipt verifies a commit containing the post-#337 F1 surface. The old
# receipt is preserved as historical evidence at
# docs/plans/optid-verification/f1.toml.
#
# active_general is F2 (not F3) because F3 explicitly depends on F1, and
# F1 is `merged_incomplete`. The repository's own rule is that
# dependencies unlock only from `completed`; pointing active_general at
# a package whose dependency is incomplete would be dishonest. F2 has
# no dependency on F1 and can proceed independently. The maintainer may
# re-point active_general to F1 once F1's fresh verification lands, or
# to F3 once F1 returns to `completed`. No package is self-certified
# completed.
active_general = "F2"
active_safety = "D0"

# Provenance: D0 and S1D-S5D come from the D2 amendment; all other packages carry forward the completion plan merged in PR #322.

# Status vocabulary:
# next           = canonical next package for its lane
# ready_parallel = independent work may start without displacing the lane's next package
# planned        = waits for listed dependencies or an accepted dependent specification
# candidate      = integrated builder result with runtime paths and tests, awaiting cold verification
# merged_incomplete = code merged, but the package end state or required proof is missing
# completed      = linked PR, runtime integration, tests, evidence, and cold-verification receipt are recorded
# blocked        = a named accepted decision or dependency prevents construction
# Promotion gates are separate from construction status.
#
# A merged PR is not package completion. Comments are not evidence. Dependencies
# unlock only from `completed`. The validator enforces these rules.

[[package]]
id = "F1"
lane = "foundation"
title = "Freeze capability states and domain configuration"
# Post-#337 repair: F1 was `completed` against PR #332's cold-verification
# receipt (docs/plans/optid-verification/f1.toml, verified_commit
# 001515bef45a0a5f9842d9831154ae9d0573d361). Subsequent PRs (#333, #334,
# #336, #337) modified F1's declared runtime_entrypoints (policy.rs,
# action.rs, actuator.rs, main.rs, decision.rs) and deleted the F1
# integration test the receipt referenced (crates/optid/tests/
# f1_effective_config.rs, removed in PR #337). The receipt is stale: it
# verifies an older commit against a deleted test file. The
# `validate_receipt_freshness` rule now enforces this invariant.
#
# F1 is demoted to `merged_incomplete` until a fresh cold verification
# receipt verifies a commit containing the post-#337 F1 surface. The
# old receipt is preserved as historical evidence at
# docs/plans/optid-verification/f1.toml; the `verification_receipt`
# field is removed because the package is no longer `completed`.
status = "merged_incomplete"
depends = []
pr = "332"
blocking_reason = "F1 cold-verification receipt (PR #332, commit 001515b) is stale: subsequent PRs (#333, #334, #336, #337) modified declared runtime_entrypoints (policy.rs, action.rs, actuator.rs, main.rs, decision.rs) and PR #337 deleted the receipt-referenced integration test (crates/optid/tests/f1_effective_config.rs, replaced by behavioral tests in crates/optid/tests/f1_behavior.rs which PR #337 also reduced to a pointer file — that pointer file is now deleted and replaced with real #[test] fn coverage in crates/optid/src/policy.rs). A fresh independent cold verification of the current F1 implementation is required before F1 may return to `completed`. No package self-certifies completed."
runtime_entrypoints = [
  "crates/optid/src/main.rs",
  "crates/optid/src/policy.rs",
  "crates/optid/src/decision.rs",
  "crates/optid/src/action.rs",
  "crates/optid/src/actuator.rs",
]
# Binary-crate exception: `optid` is `[[bin]]`-only, so production paths
# are `pub(crate)` and cannot be reached from `tests/` integration tests.
# The F1 behavioral coverage lives inside `crates/optid/src/policy.rs`
# under `#[cfg(test)] mod f1_tests`. The `acceptance_tests` mapping
# below names the real `#[test] fn` definitions that live there.
integration_tests = [
  "crates/optid/src/policy.rs",
]
completion_evidence = [
  "crates/optid/src/policy.rs",
  "crates/optid/src/decision.rs",
  "crates/optid/src/action.rs",
  "crates/optid/src/actuator.rs",
  "docs/plans/optid-verification/f1.toml",
]
# Post-#337: explicit acceptance_tests mapping. Each value names a real
# `#[test] fn` in the declared integration_tests / completion_evidence
# files. The validator confirms the named function exists as a
# `#[test] fn` (not just any `fn`); a pointer file cannot satisfy this.
[package.acceptance_tests]
domain_mode_parsing = "f1_domain_mode_serde_accepts_lowercase_off_observe_actuate"
unknown_field_rejection = "f1_domains_config_rejects_unknown_domain_key"
systemd_action_domain_gating = "f1_systemd_set_property_is_domain_gated_by_default"
observe_mode_preserves_would_be_actions = "f1_decide_observe_mode_captures_would_be_action_for_render"
off_mode_suppresses_actions = "f1_decide_off_mode_suppresses_domain_actions_silently"
effective_config_in_rendered_status = "f1_decision_render_includes_effective_config_block"
new_domains_cannot_silently_fail_open = "f1_domain_default_mode_is_fail_closed_for_unknown_domains"
production_pipeline_policy_to_render = "f1_production_pipeline_policy_to_render"
production_pipeline_rejects_unknown_domain = "f1_production_pipeline_rejects_unknown_domain"

