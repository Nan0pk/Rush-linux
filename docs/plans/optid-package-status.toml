# Provenance: D0 and S1D-S5D come from the D2 amendment; all other packages carry forward the completion plan merged in PR #322.

# Status vocabulary:
# next           = canonical next package for its lane
# ready_parallel = independent work may start without displacing the lane's next package
# planned        = waits for listed dependencies or an accepted dependent specification
# completed      = linked PR and required package-level proof are recorded
# blocked        = a named accepted decision or dependency prevents construction
# Promotion gates are separate from construction status.

