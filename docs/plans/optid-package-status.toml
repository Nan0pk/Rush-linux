[[package]]
id = "C1"
lane = "contracts"
title = "Model contracts with measured latency and provenance"
status = "merged_incomplete"
blocking_reason = "Dependency cascade only, not a defect in C1's own work: F1 and F3 were demoted to merged_incomplete because the I2 simulated-evidence harness modified their declared proof paths, and a candidate may not depend on an incomplete package. C1's own builder result is unchanged and its evidence still stands; it returns to candidate as soon as F1 and F3 are cold-verified again."
depends = ["F1", "F3"]
pr = "431"
# Builder result awaiting independent cold verification. Not self-certified.
#
# What landed: `crates/optid/src/latency.rs` defines `LatencyEstimate`
# (value_us, source, confidence, measured_at, hardware_id, firmware_id) and a
# first-class `LatencyResolution::Unknown`. `contracts.rs` adds `ContractBook`
# (per-class floors plus per-cgroup overrides, composed strictest-wins),
# `ContractsMode` (`[contracts] mode = "observe|enforce"`, default enforce),
# and the pure `ContractEvaluator`. The actuator's runtime-PM contract gate
# previously read `let evidence: Option<&ExitLatencyEvidence> = None;` with a
# `_c1_api_surface` tuple that existed only to keep constructors from being
# dead code — every runtime-PM action was therefore denied unconditionally.
# That placeholder is replaced by a real allowlist-backed resolution, and the
# superseded `ExitLatencyEvidence`/`ExitLatencyProvenance`/
# `contract_gate_runtime_pm` scaffolding is removed rather than left beside
# its replacement.
#
# Evidence source in v1 (the completion plan's "Recommended v1"): a hardware
# allowlist entry carrying `exit_latency_us`, keyed by HWID and optionally
# pinned by `firmware_id`. Unverified entries are not evidence, so the latency
# gate cannot route around the `verified = false` rule (0006 §4).
#
# Known gaps for the cold verifier — none of these are claimed as done:
# (1) No seeded entry carries `exit_latency_us`. Reading `PCI_EXP_LNKCAP` and
#     the NVMe `EXLAT` descriptor is deferred pending reference hardware
#     (docs/research/0008-nvme-apst-pcie-aspm-sata-alpm.md §3), and inventing
#     values would violate AGENTS.md §1. In production every device therefore
#     still resolves Unknown and is denied — the same outcome as before C1,
#     now for a traceable reason and through a path an administrator can
#     populate with an override entry.
# (2) Firmware-revision reading is not wired, so a firmware-pinned entry reads
#     as a stale cache and denies. Fail-safe, but it means the `High`
#     confidence path is unreachable in production until revision parsing
#     lands (research 0008 §3 short-term list).
# (3) Per-cgroup overrides are parsed, composed, and consumed through
#     `ContractBook::effective_floors` on the daemon path, but cgroup scope
#     discovery is package O2, so the active-scope list is empty today and
#     composition reduces to the class row.
runtime_entrypoints = [
  "crates/optid/src/main.rs",
  "crates/optid/src/actuator.rs",
  "crates/optid/src/contracts.rs",
  "crates/optid/src/latency.rs",
  "crates/optid/src/allowlist.rs",
]
# Binary-crate exception (same as F1): `optid` is a `[[bin]]`-only crate, so
# production paths are `pub(crate)` and cannot be reached from `tests/`.
# The C1 behavioral tests live in-crate; the mapping below names the real
# `#[test] fn` definitions.
integration_tests = [
  "crates/optid/src/tests_impl.rs",
  "crates/optid/src/contracts.rs",
  "crates/optid/src/latency.rs",
]
completion_evidence = [
  "crates/optid/src/latency.rs",
  "crates/optid/src/contracts.rs",
  "crates/optid/src/actuator.rs",
]
[package.acceptance_tests]
max_composition = "c1_compose_max_takes_the_slowest_component"
composition_keeps_weakest_confidence = "c1_compose_max_keeps_the_weakest_confidence"
