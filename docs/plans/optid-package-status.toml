safety_architecture = "D2-fail-passive"
# Independent cold-verification of F1, F2, F3, and F4 at implementation commit
# 52919c2ac1582e56737d568a576899e10ae43d15 (HEAD of fix/f4-complete-reconciliation,
# PR #371) completed on 2026-08-02. The F4 cutover made the F4 Reconciler the
# sole production reconciliation authority in crates/optid/src/main.rs; F1, F2,
# and F3 were re-verified against the F4-cutover commit and re-certified.
# Receipts: docs/plans/optid-verification/{f1,f2,f3,f4}.toml. All four packages
# are now `completed` and their dependencies unlock naturally.
#
# active_general is T1 because T1 is already `merged_incomplete` (actionable)
# and its F2/F3 dependencies are now satisfied, so its remaining blockers
# (cold hardware verification and reviewed threshold acceptance) are the next
# truth-preserving repair target in the general construction lane. C1 (contracts)
# is the next NEW package to start per the completion plan's track ordering
# ("Truth and state" F1-F4 is complete; the next track "Safe mutation" includes
# C1), but C1 remains `planned` because this verification PR may advance only
# one package (F4) per the one-package-per-PR rule; a builder picking up C1
# will set it to `next` in a separate implementation PR. The safety lane
# (D0) is unchanged. No package self-certifies completion.
active_general = "T1"
active_safety = "D0"

# Provenance: D0 and S1D-S5D come from the D2 amendment; all other packages carry forward the completion plan merged in PR #322.

# Status vocabulary:
# next           = canonical next package for its lane
# ready_parallel = independent work may start without displacing either active lane
# planned        = waits for listed dependencies or an accepted dependent specification
# candidate      = integrated builder result with runtime paths and tests, awaiting cold verification
# merged_incomplete = code merged, but the package end state or required proof is missing
# completed      = linked PR, runtime integration, tests, evidence, and cold-verification receipt are recorded
# blocked        = a named accepted decision or dependency prevents construction
# Promotion gates are separate from construction status.
#
# A merged PR is not package completion. Comments are not evidence. Dependencies
# unlock only from `completed`. The validator enforces these rules.

