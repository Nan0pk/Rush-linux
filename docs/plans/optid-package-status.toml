title = "Prototype capability sealing and supervisor-managed cold restart"
# Construction is complete on the D0 work branch; the PR is opened by the
# builder and merged by the maintainer. Per the ledger's status vocabulary,
# `completed` requires a linked PR number, so D0 stays `next` until merge.
