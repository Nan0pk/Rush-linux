#   mark_applied, actuation_state, clear_journal, append_log all have *_with(io)
#   variants; legacy fns delegate to RealKernel::new(). The path-validation
#   logic moved to kernel_io::is_allowlisted_write_path (centralized).
# - crates/optid/src/actuator.rs: new `kernel: Box<dyn KernelIo>` field;
#   Actuator::new delegates to new_with_kernel(RealKernel). All fs::read_to_string
#   -> self.kernel.read_to_string; all guarded_write -> self.kernel.write;
#   now_unix() -> self.kernel.now_unix(); discover_cpu_epp_paths ->
