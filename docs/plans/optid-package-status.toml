# Independent post-merge cold verification now covers F1-F4 and S1D-S5D.
# PR #393 verified merged S5D scoped circuit breakers through all
# mapped acceptance tests, full regression, persistent restart/canary proofs,
# and live packaged recovery/supervisor checks. C1 is now the active safety-track follow-on.
# No package self-certified.
#
# active_general remains T1 because its physical hardware proof and reviewed
# threshold acceptance are still outstanding. R1-R3 remain independent.
active_general = "T1"
active_safety = "C1"

# Provenance: D0 and S1D-S5D come from the D2 amendment; all other packages carry forward the completion plan merged in PR #322.

# Status vocabulary:
# next           = canonical next package for its lane
# ready_parallel = independent work may start without displacing either active lane
# planned        = waits for listed dependencies or an accepted dependent specification
# candidate      = integrated builder result with runtime paths and tests, awaiting cold verification
# merged_incomplete = code merged, but the package end state or required proof is missing
# completed      = linked PR, runtime integration, tests, evidence, and cold-verification receipt are recorded
# blocked        = a named accepted decision or dependency prevents construction
# Promotion gates are separate from construction status.
#
# A merged PR is not package completion. Comments are not evidence. Dependencies
# unlock only from `completed`. The validator enforces these rules.

[[package]]
id = "F1"
lane = "foundation"
title = "Freeze capability states and domain configuration"
status = "merged_incomplete"
blocking_reason = "Cold receipt stale: the I2 simulated-evidence harness modified declared proof paths crates/optid/src/actuator.rs and crates/optid/src/main.rs after verified_commit 791cd5364a8f. The receipt at docs/plans/optid-verification/f1.toml is preserved as historical; a fresh cold verification is required before this package may return to completed. That harness also found a real F1 defect, now fixed: the run loop re-reads policy.toml every cycle, Policy::load answers an unreadable file with curated_baseline() whose per-domain default is actuate, and apply_armed was computed only at startup, so an operator's mode=\"off\" silently became actuation mid-run. The loop now retains the last cleanly-loaded policy and disarms dynamic writes for any cycle whose reload is not Ok. The re-verification must cover that path."
depends = []
pr = "332"
verification_receipt = "docs/plans/optid-verification/f1.toml"
runtime_entrypoints = [
  "crates/optid/src/main.rs",
  "crates/optid/src/policy.rs",
  "crates/optid/src/decision.rs",
  "crates/optid/src/action.rs",
  "crates/optid/src/actuator.rs",
]
# Binary-crate exception: `optid` is a `[[bin]]`-only crate, so production paths
# are `pub(crate)` and cannot be reached from `tests/` integration tests.
# The F1 behavioral coverage lives inside `crates/optid/src/policy.rs`
# under `#[cfg(test)] mod f1_tests`. The `acceptance_tests` mapping
# below names the real `#[test] fn` definitions that live there.
integration_tests = [
  "crates/optid/src/policy.rs",
  "crates/optid/tests/i2_simulation_evidence_cli.rs",
]
completion_evidence = [
  "crates/optid/src/policy.rs",
  "crates/optid/src/decision.rs",
  "crates/optid/src/action.rs",
  "crates/optid/src/actuator.rs",
]
# Post-#337: explicit acceptance_tests mapping. Each value names a real
# `#[test] fn` in the declared integration_tests / completion_evidence
# files. The validator confirms the named function exists as a
# `#[test] fn` (not just any `fn`); a pointer file cannot satisfy this.
[package.acceptance_tests]
# A failed policy reload must not re-enable a domain the operator switched
# off. The guard enters through the real `optid` binary and the production
# control loop; it was confirmed to fail with the fix reverted.
failed_policy_reload_does_not_escalate_domain_modes = "i2_a_failed_policy_reload_never_actuates_a_domain_that_is_switched_off"
