# Builder-provided construction evidence (reviewed by the maintainer at merge):
# - crates/optid/src/kernel_io.rs (new): KernelRead/KernelWrite/Clock/EventSource
#   traits + RealKernel (production) + FaultKernel (fault-injection wrapper) +
#   MemoryKernel (pure in-memory, for future packages) + centralized
#   is_allowlisted_write_path (extracted verbatim from io_util::guarded_write).
# - crates/optid/src/sensors.rs: every discover_* and read_* function has a
#   *_with(read, clock) variant; legacy no-arg fns delegate to RealKernel::new().
#   Snapshot::collect delegates to collect_with(&RealKernel, &RealKernel).
