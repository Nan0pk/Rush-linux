unknown_field_rejection = "f1_domains_config_rejects_unknown_domain_key"
systemd_action_domain_gating = "f1_systemd_set_property_is_domain_gated_by_default"
observe_mode_preserves_would_be_actions = "f1_decide_observe_mode_captures_would_be_action_for_render"
off_mode_suppresses_actions = "f1_decide_off_mode_suppresses_domain_actions_silently"
effective_config_in_rendered_status = "f1_decision_render_includes_effective_config_block"
new_domains_cannot_silently_fail_open = "f1_domain_default_mode_is_fail_closed_for_unknown_domains"
