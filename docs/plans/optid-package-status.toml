  "crates/optid/src/action.rs",
  "crates/optid/src/actuator.rs",
]
# Binary-crate exception: `optid` is a `[[bin]]`-only crate, so production paths
# are `pub(crate)` and cannot be reached from `tests/` integration tests.
# The F1 behavioral coverage lives inside `crates/optid/src/policy.rs`
# under `#[cfg(test)] mod f1_tests`. The `acceptance_tests` mapping
# below names the real `#[test] fn` definitions that live there.
