[[package]]
id = "T1"
lane = "thermal"
title = "Build thermal sensing and a pure budget model"
status = "merged_incomplete"
# Canonical plan modularity: T1 depends on F2–F3 (OPTID-COMPLETION-PLAN.md §T1).
depends = ["F2", "F3"]
pr = "334"
blocking_reason = "T1 thermal path is production-wired but incomplete: (1) F2 and F3 are both completed (verified at 52919c2ac1582e56737d568a576899e10ae43d15 on 2026-08-02), so the versioned observation/decision dependency is now satisfied; (2) hysteresis and thermal config reload are retained in the daemon loop, but cold hardware verification and reviewed threshold acceptance are still required; (3) the duplicate Domain::Thermal surface was removed in the post-#337 repair (T1 is read-only and has no Action variant; the dedicated [thermal] table is the sole configuration surface); (4) the post-#337 repair added in-crate behavioral tests (t1_production_pipeline_collect_to_render, t1_production_pipeline_off_mode_zero_thermal_reads) inside crates/optid/src/thermal.rs — these are in-crate behavioral tests (not full daemon integration tests) that exercise the production functions through injected MemoryKernel I/O; the deleted pointer file (crates/optid/tests/t1_thermal_budget.rs) is no longer evidence. Cold hardware verification remains outstanding; reviewed threshold acceptance was satisfied on 2026-08-15 by clause (6) below. The bounded verifier procedure is docs/plans/t1-thermal-cold-verification.md; adding that procedure and a monotonicity acceptance test does not constitute physical evidence or threshold approval. No package self-certifies completed. (5) 2026-08-15 ADR 0026 conformance repair: the five blocking mismatches recorded in docs/decisions/0026-optid-t1-thermal-sensor-and-threshold-policy.md between the proposed thermal observation contract and the landed code are repaired, and eleven deterministic tests are mapped under thermal::tests::t1_conformance_*. The repair changes no package status. (6) 2026-08-15 ADR 0026 ratified by the maintainer of record (Nan0pk) at status 'accepted'; the ADR also records four remaining implementation-vs-policy gaps scheduled as a follow-on repair after physical collection. Ratification satisfies the 'reviewed threshold acceptance' half of the blocker and nothing else. (7) 2026-08-16 ADR 0026 open-findings repair: the four implementation-vs-policy gaps recorded in the ADR at ratification are repaired in crates/optid/src/thermal.rs (fail-closed on a low hardware crit instead of interpolating over an invented range; package/die provenance is reported when a core or CCD channel supplies the maximum; skin classification matches the channel label only, not the chip name; fault and alarm attributes are read before a temperature is accepted, so an alarmed channel survives an unreadable reading and is named in the reason). Four deterministic tests are mapped under thermal::tests::t1_conformance_*. The repair changes no package status and no decision in the ADR. It is sequenced before physical collection because crates/optid/src/thermal.rs is a declared T1 proof path: a receipt taken before this repair would be stale the moment it landed. (8) 2026-08-16 independent verifier findings repaired: a cold verifier examined 1a07aa41, declined to issue a receipt, and recorded five conformance defects, four of them reachable through the production discovery entrypoint. Repaired in crates/optid/src/thermal.rs with five further mapped tests: the reported CPU identity is the package channel rather than whichever channel supplied the maximum; hwmon die eligibility is driver-scoped rather than decided by label text on any chip; a duplicate collapse now merges the maximum and the union of the fault/alarm bits instead of discarding the losing record; hwmon nodes without a device symlink no longer share one identity and so two sockets no longer collapse; and status records the effective thresholds unconditionally. Most seriously, an alarm previously produced Constrained with no die temperature, which fell through Snapshot::thermal_c() to the legacy hottest-zone path and delivered an unrelated 42C zone to policy while the CPU package alarmed at 99C; the alarm branch now always carries either the alarmed channel's real reading or Unavailable, and the invariant is pinned by a test driving Snapshot::collect_with_thermal. sensors.rs and policy.rs are deliberately untouched because they are declared proof paths for F1, F2, S4D and S5D. The first collection bundle and the earlier verification attempt (draft PR #409) both predate these repairs and cannot support a receipt. (9) 2026-08-16 second independent verifier findings repaired: a second cold verifier examined 4d1efdf5, declined to issue a receipt, and recorded two defects, both now repaired in crates/optid/src/thermal.rs with one further mapped test. A duplicate or alias collapse raised the retained record's temperature while keeping its identity, so status attributed a reading to a channel that never produced it — observed in a collected bundle as 'Package id 0 at 43.0C' against a channel that read 42.0C in all ten samples; the collapse is now recorded and status states both the channel's own reading and what raised it. And Tctl, which carries a vendor offset and reads hotter than Tdie, could win the temperature maximum and be reported as the die on AMD machines exposing both; an available Tdie on the same device now supersedes it, per ADR 0026 section 2 item 4, and the exclusion is recorded. The 2026-08-16 collection bundles are stale as of this repair because thermal.rs is a declared T1 proof path. (10) 2026-08-16 cosmetic follow-up: the line continuation in the collapse-provenance reason carried its own indentation into the rendered status, so the reason read 'raised to 37.0C              by acpi:x86_pkg_temp'. Whitespace only; no behaviour, no decision, and no test assertion changes. Recorded here because the ledger's change contract requires an entry for any optid code change, and because the status surface is what a cold verifier reads. (11) 2026-08-17 third independent verifier findings repaired: a third cold verifier examined 55221c72 and declined a receipt. Two thermal zones of the same type with no backing device link shared one identity, because zone device_key and id fell back to the zone type alone, so a two-socket machine using the generic thermal interface collapsed both packages into one record and lost one silently; zone identity now carries the zone node, the same repair already made on the hwmon side and left out of the ACPI path. And an alarm on a non-die channel left a full-headroom claim standing, so an alarming NVMe at 95C beside a cool package produced Cool at ratio 0.00; an alarm anywhere now defeats a full-headroom claim and reports unavailable at maximum derating, scoped so that a die already derating or constrained is unaffected. Two mapped tests added, count 35 -> 37. Evidence provenance is settled by maintainer ruling recorded in docs/plans/t1-thermal-cold-verification.md: physical hardware is primary for a hardware-facing package, CI cannot prove what this package exists to prove, and collector independence replaces CI provenance. The 2026-08-16 collection is stale as of this repair because thermal.rs is a declared T1 proof path. (12) 2026-08-22 device levers in light class repair: Runtime PM, PCIe ASPM and SATA ALPM fire in idle or light workload classes on battery; F1, S3D, S4D, S5D receipts re-certified at 6bace508735c. (13) 2026-08-23 daemon placeholder repair: commit 5c3dfb27373c repaired the daemon's own copy of the systemd `[not set]` placeholder handling in crates/optid/src/reconciler/mod.rs and added covering cases to crates/optid/src/reconciler/tests.rs. Both files are declared proof paths for the completed packages F4 and S2D, so their receipts went stale the moment the repair landed; both are re-certified at 5c3dfb27373c after all ten mapped F4 and all seventeen mapped S2D acceptance tests were re-run individually with `--exact` and observed passing. That re-run is a builder re-run of the mapped contract only and is recorded as such in each receipt; it is not an independent cold verification and no package status changed. (14) 2026-08-22 AC state multi-supply aggregation repair: read_on_ac_with aggregates across every power supply, so an offline USB-C source enumerated ahead of an online AC adapter no longer reports on_ac=false — observed on the HP Victus 16-r0xxx laptop slot, where the daemon ran its battery policy branch with the charger attached. crates/optid/src/sensors.rs is a declared F2 proof path, so its receipt went stale the moment the repair landed; the F2 acceptance test was re-verified at 627c3628a81e. Builder re-run of the mapped contract only, not an independent cold verification, and no package status changed. (15) 2026-08-23 startup-and-restore repair merged forward: the branch carrying the circuit-breaker relocation to /var/lib/optid/circuits-v1.json (outside the recovery transaction directory, whose invariant is that every JSON file in it is a pending TransactionRecord) and the recovery-side systemd `[not set]` handling was merged with main. crates/optid/src/circuit_breaker.rs and crates/optid/src/recovery.rs are declared proof paths for S5D and S3D, so both receipts went stale on the merge; both are re-certified at c616f3079792 after all twelve mapped S3D and all thirteen mapped S5D acceptance tests were re-run individually with `--exact` and observed passing. Builder re-run of the mapped contract only, not an independent cold verification, and no package status changed. (16) 2026-08-23 circuit-breaker state surfacing (PR #427): commit 6c68e63fbaf5 added a new `Circuits` D-Bus method and `optctl circuits` subcommand so a tripped S5D circuit is no longer visible only by grepping control-cycles.jsonl by hand, plus the `render_persisted_circuits` pure function it renders through. crates/optid/src/dbus.rs, crates/optctl/src/main.rs, and packaging/dbus/io.rushlinux.Optid.xml are declared F3 proof paths; crates/optid/src/circuit_breaker.rs is a declared S5D proof path; both receipts went stale the moment the change landed. Both are re-certified at 6c68e63fbaf5 after all six mapped F3 in-crate tests, all three mapped F3 optctl status_cli tests, and all thirteen mapped S5D acceptance tests were re-run individually with `--exact` and observed passing. The addition is purely additive and read-only over already-persisted state; no existing method, envelope field, schema_version, or circuit-evaluation logic changed. Builder re-run of the mapped contract only, not an independent cold verification, and no package status changed. (17) 2026-08-23 detect_conflicts test-only override seam (PR #425): commit 9868d6bbf7bb added with_conflict_checker_override to crates/optid/src/shim/conflict.rs, mirroring kernel_io.rs's with_real_kernel_override, so s2d_production_daemon_run_uses_persistent_transaction_protocol no longer depends on whichever policy daemon happens to be active on the host running the suite -- it had been failing on any host with tuned active, downgrading --apply to dry-run and hiding every S2D assertion downstream. crates/optid/src/reconciler/tests/s2d.rs is a declared S2D proof path, so its receipt went stale the moment the updated test landed. All seventeen mapped S2D acceptance tests were re-run individually with `--exact` against 9868d6bbf7bb and passed; the change adds no transaction protocol, record schema, or compensation path. Builder re-run of the mapped contract only, not an independent cold verification, and no package status changed. (18) 2026-08-23 unify duplicated systemd `[not set]` placeholder logic (PR #426): commit 0d7ae31319a1 extracted is_unset_placeholder/assigns_a_value out of crates/optid/src/reconciler/mod.rs, crates/optid/src/reconciler/tests.rs, and crates/optid/src/recovery.rs (declared proof paths for F4, S2D, and S3D respectively) into a new shared systemd_placeholder.rs, #[path]-included by both the daemon and the standalone optid-recover binary instead of hand-duplicated -- exactly the duplication that let the 2026-08-23 daemon placeholder repair (clause 13) land in only one copy the first time. Call sites, assertions, and behavior are unchanged. All ten mapped F4 and all twelve mapped S3D acceptance tests were re-run individually with `--exact` against 0d7ae31319a1 and passed; sixteen of the seventeen mapped S2D acceptance tests likewise passed, and the seventeenth (s2d_production_daemon_run_uses_persistent_transaction_protocol) fails on this host because tuned.service is active -- a documented host-environment dependency since commit a0f3179, untouched by and unrelated to this change, fixed separately in PR #425 (not yet merged into this branch). Builder re-run of the mapped contract only, not an independent cold verification, and no package status changed. T1 stays merged_incomplete: no physical cold-hardware collection has been run, and no verification receipt exists at docs/plans/optid-verification/t1.toml. T2 does not unlock."
