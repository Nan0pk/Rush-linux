[[package]]
id = "F4"
lane = "foundation"
title = "Reconcile complete desired state and restore on transitions"
status = "merged_incomplete"
depends = ["F2", "F3"]
pr = "327"
blocking_reason = "Reconciler shadow mode is honestly dormant: it tracks target-set parity (which journal keys the current decision desires vs the previous tick) via replace_desired_targets + stale_target_ids, and detects transitions for operator-visible logging. It does NOT plan or apply restores. The post-#338-review repair removed the disconnected Domain-keyed states model and plan_restore/reconcile methods that production never populated; the target-keyed V1 helpers (baseline/confirmed/ownership/may_restore) are retained under #[cfg(test)] for the future cutover. Production restore still uses active_keys + Actuator::revert_key in main.rs; the ledger must clearly state this. Remaining blockers: (1) wire target state (baseline, last_confirmed, ownership) from real journal observations (original_<key> / applied_<key> files the actuator writes) so may_restore_target can evaluate real restores; (2) reintroduce a target-based restore planner that reads the wired target state (the old Domain-keyed plan_restore was removed because it read a model production never populated); (3) F3 envelope alignment (reconciler still has local Ownership type); (4) full systemd property restore — Action::SystemdSetProperty::journal_key() returns None because the Systemd apply path captures no original properties and has no property-level restoration; a real implementation must enumerate each changed property, read its original runtime value, distinguish absent from explicit, restore each, verify readback, and avoid overwriting external changes; (5) VM/sysctl restore through the reconciler rather than only journal keys; (6) shadow/v1 parity gate before defaulting reconciler=v1. Package is not completed."
completion_evidence = []

