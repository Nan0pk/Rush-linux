  "fresh VM install succeeds",
  "installed system boots twice cleanly",
  "update and rollback tests pass",
  "server edition has no desktop dependency",
]
[[milestone.criteria_status]]
criterion = "fresh VM install succeeds"
verified = true
note = "Verified 2026-06-21 (build host): rush-install.sh installs onto blank 2GB disk, boots to multi-user.target. Bug fixes for partition suffix/mkfs.vfat/losetup committed in PR #161."
[[milestone.criteria_status]]
criterion = "installed system boots twice cleanly"
verified = true
note = "Verified 2026-06-21 (build host): test-install.sh confirms two consecutive boots to multi-user.target with optid.service active."
[[milestone.criteria_status]]
criterion = "update and rollback tests pass"
verified = true
note = "Verified 2026-06-21 (build host): test-rollback.sh validates UKI boot, rollback entry retention (>=3), and bad-kernel recovery."
[[milestone.criteria_status]]
criterion = "server edition has no desktop dependency"
verified = true
note = "Verified 2026-06-21 (build host): mkosi server profile builds with no desktop packages; test-install.sh Test 3 checks for plasma/wayland/pipewire/xorg — none found."
# Evidence note: Boot/rollback transcripts from the build host are not yet
# committed to release/evidence/. See Issue #162 for tracking.

