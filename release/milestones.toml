[[milestone.criteria_status]]
criterion = "test update metadata is signed"
verified = true
transcript = "release/evidence/v0.4.0-alpha.1/c4-update-signed/transcript.log"
note = "Closed by Dragnet-001 (2026-06-22, in-container): tools/test-sign-updates.sh passes end to end (Ed25519 keygen, sign, verify, tamper-detect). See the transcript and meta.txt in the cited directory."

