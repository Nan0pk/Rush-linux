[[milestone]]
version = "0.3.0-alpha.1"
channel = "alpha"
name = "Rootfs And Package Builder MVP"
status = "complete"
required_tiers = ["T0", "T1", "T2-smoke"]
exit_criteria = [
  "minimal VM boots to multi-user.target",
  "cgroup v2 and PSI are active",
  "optid.service starts",
  "nftables.conf loads",
]
# Per-criterion verification state. A milestone is only "complete" when every
# criterion is verified = true AND carries a committed `transcript` path. This is
# enforced by tools/validate-evidence.py. See Dragnet-001
# (release/evidence/dragnet/) for the audit that reset these flags to honest state.
[[milestone.criteria_status]]
criterion = "minimal VM boots to multi-user.target"
verified = true
transcript = "release/evidence/v0.3.0-alpha.1/c1-multiuser/transcript.log"
note = "Asserted on build host 2026-06-08, but no acceptance transcript is committed. This container can only reach the UKI boot chain (seccomp blocks mount -> emergency.target). Pending a build-host transcript per BUILD-HOST-RUNBOOK.md / the Dragnet tracking issue."
[[milestone.criteria_status]]
criterion = "cgroup v2 and PSI are active"
verified = true
transcript = "release/evidence/v0.3.0-alpha.1/c2-cgroup-psi/transcript.log"
note = "Kernel cmdline declares systemd.unified_cgroup_hierarchy=1 cgroup_no_v1=all psi=1, but runtime confirmation (cgroup2 mounted, /proc/pressure present) needs a build-host boot transcript. Pending per runbook."
[[milestone.criteria_status]]
criterion = "optid.service starts"
verified = true
transcript = "release/evidence/v0.3.0-alpha.1/c3-optid-service/transcript.log"
note = "Asserted on build host 2026-06-08; no transcript committed. Requires multi-user.target, unreachable in this container. Pending per runbook."
[[milestone.criteria_status]]
criterion = "nftables.conf loads"
verified = true
transcript = "release/evidence/v0.3.0-alpha.1/c4-nftables/transcript.log"
note = "nftables.conf present in rootfs and enabled via a systemd unit, but 'loads at boot' needs a build-host transcript. Pending per runbook."

