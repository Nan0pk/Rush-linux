# testOS bench catalog
#
# This is the editable list of benchmarks testOS knows how to run.
# The launcher reads this to show the menu and estimate total runtime;
# the runner reads this to know what commands to execute after boot.
#
# To add a new test:
#   1. Add a new [[benches]] entry below.
#   2. Run `testos-launcher build` to bake it into the USB image.
# That's it — no code changes needed.
#
# Schema:
#   id                 — short identifier used in filenames, e.g. "fio-seq-read"
#   name               — human-readable name shown in the menu
#   scenario           — which manifest scenario this contributes to
#                        (mixed-load-responsiveness | server-throughput | laptop-battery
#                         | gaming-frame-time | realtime-audio)
#   kind               — shell-numeric | shell-json | shell-pass-fail | rushbench
#     shell-numeric    — stdout's last non-empty line is the numeric result
#     shell-json       — writes {"value": <number>, "unit": "<string>"} to $TESTOS_RESULT_FILE
#     shell-pass-fail  — exit code is the only signal (0 = pass)
#     rushbench        — calls `rushbench run ...` and parses the median from stdout
#   command            — the shell command to run (executed via `bash -c`)
#   estimated_seconds  — wall-clock estimate for one run (used to compute total ETA)
#   requires_battery   — true means the runner will prompt the user to unplug AC first
#   notes              — optional free-form notes shown in the menu

version = 1

# ─── Server throughput scenario ─────────────────────────────────────

[[benches]]
id = "fio-seq-read"
name = "fio — sequential read IOPS"
scenario = "server-throughput"
kind = "shell-json"
command = """
fio --name=seqread --rw=read --bs=4k --size=256M --numjobs=1 --time_based=0 \
    --directory=/tmp --output-format=json \
  | jq '{value: (.jobs[0].read.iops), unit: "iops"}' > "$TESTOS_RESULT_FILE"
"""
estimated_seconds = 30
notes = "Measures cached small-block read speed; useful for spotting CPU/filesystem overhead, not disk limits."

[[benches]]
id = "fio-seq-write"
name = "fio — sequential write IOPS"
scenario = "server-throughput"
kind = "shell-json"
command = """
fio --name=seqwrite --rw=write --bs=4k --size=256M --numjobs=1 --time_based=0 \
    --directory=/tmp --output-format=json \
  | jq '{value: (.jobs[0].write.iops), unit: "iops"}' > "$TESTOS_RESULT_FILE"
"""
estimated_seconds = 30
notes = "Measures cached small-block write speed; useful for spotting filesystem/write-path overhead, not disk limits."

[[benches]]
id = "iperf3-tcp"
name = "iperf3 — TCP throughput (loopback)"
scenario = "server-throughput"
kind = "shell-numeric"
command = """
iperf3 -s -D --one-off
sleep 1
iperf3 -c 127.0.0.1 -t 10 -J \
  | jq -r '.end.sum_received.bits_per_second / 1e9 | floor' | head -1
"""
estimated_seconds = 20
notes = "Measures local TCP stack throughput; useful for catching kernel/network-regression overhead without external LAN noise."

[[benches]]
id = "postgres-tps"
name = "PostgreSQL — pgbench TPS"
scenario = "server-throughput"
kind = "shell-json"
command = """
# Bootstrap a temp Postgres instance under a safe unprivileged runtime user.
# pg_ctl refuses to run as root, so we must run all postgres commands as a
# non-root user. Use 'runuser' (available on Arch/Debian/Fedora) instead of
# 'sudo' to avoid PAM/auth issues in the minimal testOS environment.
PGDATA=/tmp/pgdata
PGHOST=/tmp
rm -rf "$PGDATA"
mkdir -p "$PGDATA"
# Select the runtime user: prefer 'postgres', fall back to 'nobody', then
# to the current user (if non-root). testOS runs the runner as root, so the
# fallback chain must end at a non-root user.
if id postgres >/dev/null 2>&1; then
  PGUSER=postgres
elif id nobody >/dev/null 2>&1; then
  PGUSER=nobody
else
  PGUSER=$(id -un)
fi
# chown the data dir so the unprivileged user can read/write it.
chown -R "$PGUSER" "$PGDATA" 2>/dev/null || true
# runuser is preferred; fall back to su if runuser is unavailable.
if command -v runuser >/dev/null 2>&1; then
  ASUSER="runuser -u $PGUSER --"
else
  ASUSER="su -s /bin/sh $PGUSER -c"
fi
# initdb must run as the unprivileged user.
$ASUSER initdb -D "$PGDATA" --quiet 2>/dev/null
# pg_ctl start — run as unprivileged user, NOT root.
$ASUSER pg_ctl -D "$PGDATA" -o "-k $PGHOST" -l /tmp/pg.log start -w -s
$ASUSER createdb -h "$PGHOST" bench 2>/dev/null || true
$ASUSER pgbench -h "$PGHOST" -i -s 10 bench >/dev/null 2>&1
# Run the benchmark and capture TPS.
$ASUSER pgbench -h "$PGHOST" -c 4 -j 2 -t 1000 bench \
  | awk '/tps =/ {print $3}' \
  | head -1 \
  | xargs -I{} jq -n --argjson v {} '{value: $v, unit: "tps"}' > "$TESTOS_RESULT_FILE"
$ASUSER pg_ctl -D "$PGDATA" stop -w -s >/dev/null 2>&1
"""
estimated_seconds = 60
notes = "Measures local database transaction throughput; useful for server and scheduler regressions under mixed CPU/IO work."

[[benches]]
id = "nginx-rps"
name = "nginx — requests per second"
scenario = "server-throughput"
kind = "shell-numeric"
command = """
# Start a temp nginx serving a small static file.
NGINX_CONF=/tmp/nginx.conf
NGINX_ROOT=/tmp/nginx-root
mkdir -p "$NGINX_ROOT"
echo "ok" > "$NGINX_ROOT/index.html"
# Use a quoted heredoc so we can write $uri literally (no shell expansion).
cat > "$NGINX_CONF" <<'EOF'
worker_processes 1;
error_log /tmp/nginx-error.log;
pid /tmp/nginx.pid;
events { worker_connections 1024; }
http {
  access_log off;
  server {
    listen 8080;
    root /tmp/nginx-root;
    location / { try_files $uri /index.html; }
  }
}
EOF
nginx -c "$NGINX_CONF" 2>/dev/null
sleep 1
ab -n 10000 -c 10 http://127.0.0.1:8080/ 2>/dev/null \
  | awk '/Requests per second/ {print $4}' | head -1
nginx -c "$NGINX_CONF" -s stop 2>/dev/null
"""
estimated_seconds = 30
notes = "Measures local HTTP request throughput; useful for web-serving responsiveness and syscall/network-stack overhead."

# ─── Mixed-load responsiveness scenario ────────────────────────────

[[benches]]
id = "psi-cpu-avg10"
name = "PSI — CPU pressure avg10"
scenario = "mixed-load-responsiveness"
kind = "shell-numeric"
command = """
# Read PSI cpu avg10 from the 'some' line. The value is a decimal fraction
# (e.g., 0.25 = 25% of time stalled). Use grep+sed to extract the numeric
# value after 'avg10=' on the 'some' line, preserving the decimal point.
# This fixes the defect where awk split() produced malformed values like
# '005' or '132' on some kernels (the awk was grabbing the wrong field
# when the line had extra whitespace or a different field order).
grep '^some' /proc/pressure/cpu | sed -n 's/.*avg10=\([0-9.]*\).*/\1/p' | head -1
"""
estimated_seconds = 5
notes = "Measures recent CPU stall pressure; useful for seeing whether workloads are waiting on runnable CPU time."

[[benches]]
id = "psi-io-avg10"
name = "PSI — IO pressure avg10"
scenario = "mixed-load-responsiveness"
kind = "shell-numeric"
command = """
grep '^some' /proc/pressure/io | sed -n 's/.*avg10=\([0-9.]*\).*/\1/p' | head -1
"""
estimated_seconds = 5
notes = "Measures recent IO stall pressure; useful for seeing whether workloads are blocked on storage."

[[benches]]
id = "cyclictest-max"
name = "cyclictest — max latency (µs)"
scenario = "mixed-load-responsiveness"
kind = "shell-numeric"
command = """
# Run cyclictest WITHOUT -q (quiet suppresses the Max: line we need).
# -p 80: priority 80 (high, for RT kernel; falls back gracefully on non-RT)
# -t 1: one thread
# -l 100000: 100k loops (enough samples for a meaningful max)
# -h: write histogram to stdout (we don't parse it, but it ensures the
#     summary line is printed even on minimal builds)
# Parse the 'Max:' line from stderr/stdout. cyclictest writes its summary
# to stdout when not in quiet mode. The Max value is the last field.
# This fixes the defect where -q suppressed all output, causing the parser
# to produce no numeric result (exit 0 but empty value).
cyclictest -p 80 -t 1 -l 100000 2>/dev/null \
  | awk '/Max:/ {print $NF}' | tr -d ' ' | head -1
"""
estimated_seconds = 30
notes = "Measures worst-case wakeup latency; useful for real-time audio, input, and jitter-sensitive workloads."

[[benches]]
id = "foreground-launch"
name = "foreground launch latency (ms)"
scenario = "mixed-load-responsiveness"
kind = "shell-numeric"
command = """
# Measure median of 5 launches of `true` via bash, in milliseconds.
for i in 1 2 3 4 5; do
  /usr/bin/time -f '%e' bash -c 'true' 2>&1
done | awk '{a[NR]=$1} END {n=NR; if (n%2==1) print a[(n+1)/2]*1000; else print (a[n/2]+a[n/2+1])/2*1000}'
"""
estimated_seconds = 10
notes = "Measures tiny foreground process launch latency; useful as a quick proxy for interactive snappiness."

# ─── Future scenarios (declared, not yet wired) ────────────────────
