# Rush Linux mkosi configuration
#
# This is the common headless base configuration. Product edition payloads live
# in mkosi.profiles/<edition>/mkosi.conf and are composed as system extensions
# by tools/build-edition-image.sh; they are not whole-image overlays.
#
# Build common base:
#   sudo bash tools/build-mkosi-image.sh
#
# Build a product edition:
#   sudo tools/build-edition-image.sh --edition desktop --unsigned-development
#
# Validate:
#   tools/validate-uefi-boot.sh build/disk.raw
#   tools/test-rollback.sh build/disk.raw

[Distribution]
Distribution=arch
# Experiments select a confirmed archive date with the builder's --snapshot.
# For example: Snapshot=20260904. This alone does not pin every build input;
# see docs/build-system.md. No default snapshot is asserted here.

[Output]
Format=disk
ImageId=rush-linux
OutputDirectory=../build
ManifestFormat=json

[Content]
Bootable=yes
Packages=
    base
    linux
    systemd-sysvcompat
    systemd-ukify
    zram-generator
    nftables
    dbus
    bash
Autologin=yes
KernelCommandLine=
    systemd.unified_cgroup_hierarchy=1
    cgroup_no_v1=all
    psi=1
    zswap.enabled=1
    rw
    console=ttyS0,115200
    systemd.firstboot=no
