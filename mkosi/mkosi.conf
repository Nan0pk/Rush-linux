# Rush Linux mkosi configuration
#
# This is the base configuration shared across all editions.
# Edition-specific overrides live in mkosi.profiles/<edition>/mkosi.conf.
#
# Build:
#   sudo bash tools/build-mkosi-image.sh                     # server (default)
#   sudo bash tools/build-mkosi-image.sh --edition desktop   # desktop
#
# Validate:
#   tools/validate-uefi-boot.sh build/disk.raw
#   tools/test-rollback.sh build/disk.raw

[Distribution]
Distribution=arch
# Pin to a specific archive date for reproducibility.
# Uncomment and set the date when cutting a release:
# Release=2026-06-01

[Output]
Format=disk
ImageId=rush-linux
OutputDirectory=../build

[Content]
Bootable=yes
Packages=
    base
    linux
    systemd-sysvcompat
    systemd-ukify
    zram-generator
    nftables
    dbus
    bash
Autologin=yes
KernelCommandLine=
    systemd.unified_cgroup_hierarchy=1
    cgroup_no_v1=all
    psi=1
    zswap.enabled=1
    rw
    console=ttyS0,115200
    systemd.firstboot=no
