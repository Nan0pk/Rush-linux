# Rush Linux static network baseline.
#
# SCOPE (see ADR 0004 and ADR 0006): this file is intentionally limited to
# network-stack defaults that are universally safe, hardware-independent, and
# NOT part of optid's adaptive policy domain. optid does not manage congestion
# control, so setting it once at boot does not violate "optid owns all runtime
# optimization knobs".
#
# Do NOT add memory/VM/swap tuning (vm.swappiness, vm.dirty_bytes, etc.) here.
# Those are workload- and hardware-dependent and are owned by optid via
# config/optid/policy.toml so a laptop on battery, a server under load, and a
# desktop do not all receive the same value. Putting them here re-introduces the
# ADR 0004 contradiction.

# Low-latency network congestion control (Google BBR + Fair Queueing).
# Beneficial across desktop, laptop, and server roles; not adapted per-mode.
net.core.default_qdisc = fq
net.ipv4.tcp_congestion_control = bbr
