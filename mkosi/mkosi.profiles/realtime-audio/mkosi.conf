# Rush Linux Realtime Audio Edition — complete userspace sysext payload.
#
# PREEMPT_RT is a base/kernel requirement from
# distro/editions/realtime-audio.toml, not a post-boot sysext package. This
# profile carries only the realtime-audio userspace layered over the selected
# bootable base image.

[Output]
ImageId=rush-linux-realtime-audio

[Content]
Packages=
    plasma-workspace
    plasma-desktop
    kwayland
    pipewire
    pipewire-pulse
    wireplumber
    konsole
    dolphin
    realtime-privileges
    rtkit
