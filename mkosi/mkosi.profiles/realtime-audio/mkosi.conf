# Rush Linux Realtime Audio Edition — mkosi profile
#
# Specialist audio profile with optional PREEMPT_RT kernel, rtkit-pipewire
# for controlled RT access, and WirePlumber for session management. The
# RT kernel is selected only when the operator opts in (see
# distro/editions/realtime-audio.toml `kernel = "linux-adaptive-rt"` and
# `cpu_isolation = "manual-opt-in"`).
#
# This is a placeholder for v0.7.0-beta.1; not yet buildable. PREEMPT_RT
# kernel packaging (`linux-adaptive-rt`) is a v0.7 deliverable tracked in
# docs/decisions/0010-realtime-edition-kernel-policy.md.

[Output]
ImageId=rush-linux-realtime-audio

[Content]
Packages=
    plasma-workspace
    plasma-desktop
    kwayland
    pipewire
    pipewire-pulse
    wireplumber
    konsole
    dolphin
    realtime-privileges
    rtkit
