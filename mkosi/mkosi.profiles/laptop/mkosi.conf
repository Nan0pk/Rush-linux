# Rush Linux Laptop Edition — complete system-extension payload.
#
# This is the desktop userspace plus firmware and battery telemetry. optid owns
# power policy; this profile deliberately does not add a competing power daemon.
# Base-system, kernel, and policy requirements remain in
# distro/editions/laptop.toml.

[Output]
ImageId=rush-linux-laptop

[Content]
Packages=
    plasma-workspace
    plasma-desktop
    kwayland
    pipewire
    pipewire-pulse
    wireplumber
    konsole
    dolphin
    fwupd
    upower
