# Rush Linux Laptop Edition — mkosi profile
#
# Desktop profile plus battery, thermal, suspend, and device power policy.
# Inherits the desktop package set and adds power-management tooling that
# only makes sense on a battery-equipped host (fwupd for firmware updates,
# upower for battery telemetry). optid owns the power-policy boundary; the
# extras here are observability + firmware, not competing power daemons.
#
# This is a placeholder for v0.7.0-beta.1; not yet buildable. The laptop
# edition is the desktop edition plus battery/thermal/suspend policy; it
# does not ship a separate kernel or separate userspace.

[Output]
ImageId=rush-linux-laptop

[Content]
Packages=
    plasma-workspace
    plasma-desktop
    kwayland
    pipewire
    pipewire-pulse
    wireplumber
    konsole
    dolphin
    fwupd
    upower
