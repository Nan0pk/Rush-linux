# Rush Linux Desktop Edition — complete system-extension payload.
#
# Consumed by tools/build-edition-sysext.py together with
# distro/editions/desktop.toml. Keep this list limited to files/packages that
# belong in the additive desktop sysext; base-system and kernel requirements
# remain in the edition manifest/base image.

[Output]
ImageId=rush-linux-desktop

[Content]
Packages=
    plasma-workspace
    plasma-desktop
    kwayland
    pipewire
    pipewire-pulse
    wireplumber
    konsole
    dolphin
