# Rush Linux LiveDev profile
#
# A minimal bootable Rush Linux skeleton for continuous LiveDev operation:
# runs benchmarks, captures evidence, syncs with the online repo, and
# optionally consults online AI APIs. NOT a consumer distribution — it is
# the long-term successor path to testOS for the workflows that testOS's
# single-shot appliance model cannot serve.
#
# Build:
#   sudo bash tools/build-mkosi-image.sh --edition livedev
#
# Boot:
#   QEMU:  qemu-system-x86_64 -m 2G -drive file=build/rush-linux-livedev.raw,format=raw
#   USB:   dd if=build/rush-linux-livedev.raw of=/dev/sdX bs=4M status=progress
#
# Read-only host disk by default (ADR 0018 §6.3). The --mutate-host-disk
# boot flag is required for any host-disk write.
#
# testOS is NOT replaced — it remains the "Try it on real hardware" target.

[Output]
ImageId=rush-linux-livedev

[Content]
Packages=
    git
    github-cli
    python
    openssh
    iproute2
    iputils
    curl
    jq
    less
    vim
    procps-ng
    util-linux
    pciutils
    usbutils
    dmidecode
    stress
    rt-tests

KernelCommandLine=
    systemd.unified_cgroup_hierarchy=1
    cgroup_no_v1=all
    psi=1
    rw
    console=ttyS0,115200
    console=tty1
    systemd.firstboot=no
    livedev.autostart=1
    livedev.countdown_sec=10
    livedev.mutate_host_disk=0
    livedev.ci=0
    livedev.debug=0
