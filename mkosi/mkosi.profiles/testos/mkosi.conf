# Rush Linux testOS Edition — mkosi profile
#
# This profile extends the server edition with the benchmark tools testOS needs
# to run the catalog in testos/bench-list.toml. The resulting image is intended
# to be dd'd to a USB stick and booted on real hardware for Phase D benchmarks.
#
# What this profile adds on top of the base mkosi.conf:
#   - testos-runner binary (built from crates/testos)
#   - benchmark tools: fio, iperf3, postgresql, nginx, apache (provides ab), jq, cyclictest (rt-tests)
#   - the bench-list.toml catalog
#   - a systemd unit that auto-starts testos-runner on tty1 at boot
#   - an init script that mounts the USB's ESP at /run/testos/usb (where results go)
#
# Boot flow:
#   1. UKI boots the kernel + initramfs.
#   2. initramfs mounts the USB's ESP partition (label=RUSHESP) at /run/testos/usb.
#   3. systemd starts testos-runner.service on tty1.
#   4. User picks benchmarks; runner executes them; results land in /run/testos/usb/testos-results/.
#   5. Runner reboots back to the host OS.

[Output]
ImageId=rush-linux-testos

[Content]
# Benchmark tools. The base image already has: bash, systemd, network stack, optid.
Packages=
    fio
    iperf3
    postgresql
    nginx
    apache
    jq
    rt-tests
    util-linux
    usbutils
    coreutils

# testOS-specific kernel command line.
# `testos.usb_label=RUSHESP` tells the init script which partition holds the bench list + results.
# `testos.runner=1` tells the init script to auto-start testos-runner on tty1.
KernelCommandLine=
    testos.usb_label=RUSHESP
    testos.runner=1
    systemd.unified_cgroup_hierarchy=1
    cgroup_no_v1=all
    psi=1
    rw
    console=ttyS0,115200
    console=tty1
    systemd.firstboot=no
