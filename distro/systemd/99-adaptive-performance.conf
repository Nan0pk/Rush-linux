# Core network and virtual memory performance overrides for Adaptive Linux.

# 1. Low-Latency Network Congestion Control (Google BBR + Fair Queueing)
net.core.default_qdisc = fq
net.ipv4.tcp_congestion_control = bbr

# 2. Prevent write stalls during heavy disk I/O (e.g. package building)
# Set static bytes instead of percentages to avoid multi-gigabyte page flush pauses.
vm.dirty_background_bytes = 67108864   # 64 MB
vm.dirty_bytes = 134217728             # 128 MB

# 3. Aggressive ZRAM swapping
# Swap idle anonymous pages into compressed RAM first, preserving physical page cache.
vm.swappiness = 150
