# LiveDev edition — Rush Linux
#
# A minimal bootable Rush Linux skeleton for continuous LiveDev operation.
# Not a consumer distribution; the long-term successor path to testOS.
# See docs/editions/livedev.md for the full description.
#
# This file is the *edition manifest* (high-level intent and the package
# closure the edition is expected to ship). The concrete Arch packages
# used to build the image live in mkosi/mkosi.profiles/livedev/mkosi.conf.
# The two are reconciled as follows:
#   - distro/editions/livedev.toml `packages.required` lists the *Rust-built*
#     binaries (optid, optctl, rush-*) that ship from this repo's workspace.
#     These are NOT Arch packages — they are installed from /target/release
#     into /usr/local/bin by tools/build-mkosi-image.sh.
#   - mkosi/mkosi.profiles/livedev/mkosi.conf `Packages=` lists the *Arch*
#     packages that satisfy the runtime dependencies (glibc, dbus, python,
#     git, network stack, benchmark tools) plus the test fixtures.
#   - Both lists are required: the Rust binaries need the Arch runtime, and
#     the Arch packages alone do not provide optid or the rush-* tools.

[edition]
name = "livedev"
description = "Minimal bootable skeleton for LiveDev benchmark campaigns, evidence capture, and AI-assisted development"
mkosi_profile = "mkosi/mkosi.profiles/livedev/mkosi.conf"

[defaults]
filesystem = "ext4"
network = "systemd-networkd"
firewall = "nftables"
optimizer_mode = "balanced"
desktop = false

[packages]
# Rust-built binaries shipped from this workspace (installed to /usr/local/bin
# by tools/build-mkosi-image.sh). NOT Arch packages.
required = [
    "optid",
    "optctl",
    "rush-exec",
    "rush-capture",
    "rush-autopilot",
    "rush-agent",
]

[packages.arch]
# Arch packages required at runtime (mirrors mkosi/mkosi.profiles/livedev/mkosi.conf).
# Listed here so the edition manifest is self-describing; the mkosi profile is
# the build-time source of truth, this section is the edition-level documentation.
required = [
    "git",
    "github-cli",
    "python",
    "openssh",
    "iproute2",
    "iputils",
    "curl",
    "jq",
    "less",
    "vim",
    "procps-ng",
    "util-linux",
    "pciutils",
    "usbutils",
    "dmidecode",
    "stress",
    "rt-tests",
]

