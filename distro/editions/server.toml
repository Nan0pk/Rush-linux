[edition]
name = "server"
description = "Headless cgroup-v2 server profile with nftables and container-aware policy"

[defaults]
filesystem = "xfs"
network = "systemd-networkd"
firewall = "nftables"
optimizer_mode = "balanced"
desktop = false

[packages]
required = [
  "adaptive-server-minimal",
  "linux-adaptive",
  "optid",
]

