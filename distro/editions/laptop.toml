[edition]
name = "laptop"
description = "Desktop profile with battery, thermal, suspend, and device power policy"

[defaults]
inherits = "desktop"
filesystem = "btrfs"
optimizer_mode = "auto"
suspend_validation = true
runtime_pm = true

[packages]
required = [
  "adaptive-desktop-plasma",
  "linux-adaptive",
  "optid",
  "fwupd",
]

