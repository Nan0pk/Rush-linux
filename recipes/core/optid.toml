[package]
schema_version = 0
name = "optid"
version = "0.1.0"
kind = "rust"

[source]
path = "crates/optid"

[build]
command = "cargo build --release --locked -p optid -p optctl"
reproducible = true

[install]
bins = [
  ["target/release/optid", "/usr/libexec/optid"],
  ["target/release/optctl", "/usr/bin/optctl"],
]
systemd_units = [
  "packaging/systemd/optid.service",
  "packaging/systemd/optid-apply.service",
]
config = [
  ["config/optid/policy.toml", "/usr/lib/optid/policy.toml"],
  ["distro/systemd/99-rush-network.conf", "/usr/lib/sysctl.d/99-rush-network.conf"],
  ["packaging/dbus/io.rushlinux.Optid.xml", "/usr/share/dbus-1/interfaces/io.rushlinux.Optid.xml"],
  ["packaging/dbus/io.rushlinux.Optid.service", "/usr/share/dbus-1/system-services/io.rushlinux.Optid.service"],
]
