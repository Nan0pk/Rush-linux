[package]
name = "adaptive-desktop-plasma"
kind = "edition"

[depends]
required = [
  "kwin-wayland",
  "plasma-workspace",
  "xdg-desktop-portal-kde",
  "pipewire",
  "wireplumber",
  "networkmanager",
  "mesa",
  "vulkan-loader",
  "optid",
]

[policy]
session = "wayland"
audio = "pipewire"
legacy_x11_default = false
pulseaudio_default = false

