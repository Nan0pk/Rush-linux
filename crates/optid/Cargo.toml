[package]
name = "optid"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[lib]
name = "optid"
path = "src/lib.rs"

[[bin]]
name = "optid"
path = "src/main.rs"

# S1D — Read-only validator and inventory for the frozen lever contracts.
[[bin]]
name = "optid-lever-contracts"
path = "src/bin/optid-lever-contracts.rs"

# S3D — Independent one-shot recovery; no policy, D-Bus, or async runtime.
[[bin]]
name = "optid-recover"
path = "src/bin/optid-recover.rs"

# D0 — Experimental capability-sealing prototype binary.
# Only compiles with --features experimental-capability-sealing.
# Never enabled in shipped optid (per AGENTS.md §8 and the D0 plan).
[[bin]]
name = "optid-capability-seal-test"
path = "src/bin/optid-capability-seal-test.rs"
required-features = ["experimental-capability-sealing"]

# I2 — deterministic full-system scenario CLI. It is absent unless the
# non-default test-simulation feature is selected.
[[bin]]
name = "optid-simulation"
path = "src/bin/optid-simulation.rs"
required-features = ["test-simulation"]

[features]
# D0: experimental Landlock capability-sealing prototype. Validates the
# D2 fail-passive architecture's security boundary. Not connected to
# production actuation. Per the D0 plan, this must never be enabled in
# shipped optid.
experimental-capability-sealing = []

# F2: enables test-only kernel types (MemoryKernel, FaultKernel) for
# integration tests that need to construct test kernels from outside
# the optid crate.
test-utils = []

# I2: deterministic full-system scenarios. This feature is intentionally not
# part of the default build. It exposes `optid-simulation --simulation-root`
# for CI and local fixtures; the engine has no host-write implementation.
test-simulation = []

[dependencies]
zbus = { version = "5.16.0", features = ["blocking"] }
# zvariant is re-exported by zbus but we use OwnedValue directly in the
# PPD shim's Profiles property (aa{sv}); declare it as a direct dep so
# the version stays in lockstep with zbus's expectation.
zvariant = "5"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "1.1"
signal-hook = "0.4"
libc = "0.2"

[build-dependencies]
serde = { version = "1.0", features = ["derive"] }
toml = "1.1"
