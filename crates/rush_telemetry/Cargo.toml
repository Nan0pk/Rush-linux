[package]
name = "rush_telemetry"
version = "0.1.0"
edition = "2021"
license = "GPL-2.0-only"
repository = "https://github.com/Nan0pk/Rush-linux"
rust-version = "1.75"
description = "Zero-cost, non-invasive telemetry extraction for Rush Linux benchmarks"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
rmp-serde = "1.3"
zstd = "0.13"
ed25519-dalek = { version = "2.1", features = ["std"] }
rand = "0.8"

[build-dependencies]
# Future: libbpf-cargo for BPF skeleton generation
# For now, BPF programs are loaded from embedded bytecode
