name: S1D implementation finalizer

on:
  pull_request:
    paths:
      - ".github/workflows/s1d-finalize.yml"
      - ".github/s1d-final.patch.b64.*"

permissions:
  contents: write

jobs:
  finalize:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
          persist-credentials: true

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Apply the reviewed S1D patch
        run: |
          set -euo pipefail
          cat .github/s1d-final.patch.b64.* | base64 --decode > /tmp/s1d-final.patch
          git apply --index /tmp/s1d-final.patch
          rm -f .github/s1d-final.patch.b64.*
          rm -f .github/workflows/s1d-finalize.yml

      - name: Format and validate S1D
        env:
          BASE_SHA: db5b1552d51eb6f2384945f3f420e45e7796005a
        run: |
          set -euo pipefail
          cargo fmt --all
          git add -A
          cargo fmt --all -- --check
          cargo check -p optid --all-targets --all-features
          cargo clippy -p optid --all-targets --all-features -- -D warnings
          cargo test -p optid
          python3 tools/validate-current-work.py
          python3 tools/validate-optid-packages.py
          python3 tools/validate-optid-packages.py --base "$BASE_SHA"
          python3 tools/render-frontpage.py --check
          git diff --cached --check

      - name: Commit the durable implementation
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          test -z "$(git status --porcelain | grep '^??' || true)"
          git commit -m "feat(optid): freeze S1D lever safety contracts"
          git push origin "HEAD:${{ github.event.pull_request.head.ref }}"
