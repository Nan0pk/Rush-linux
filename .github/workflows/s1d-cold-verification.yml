name: S1D cold verification

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize]

permissions:
  contents: write

concurrency:
  group: s1d-cold-verification-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  verify:
    if: >-
      github.event.pull_request.head.ref == 'verify/20260803-s1d-lever-contracts' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Install Rust system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libdbus-1-dev pkg-config

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2

      - name: Independently verify S1D
        env:
          IMPLEMENTATION_HEAD: e6904f6d94c31c7bd56cacce50cb64064a5650ea
          INTEGRATED_COMMIT: 6a173f0051ef3fda31dc685ebc524fc6b10442bf
        run: |
          set -euo pipefail
          LOG="$RUNNER_TEMP/s1d-cold-verification.log"
          exec > >(tee -a "$LOG") 2>&1

          TESTED_HEAD="$(git rev-parse HEAD)"
          SOURCE_BASE="$(git rev-parse origin/main)"
          echo "TESTED_HEAD=$TESTED_HEAD" >> "$GITHUB_ENV"
          echo "SOURCE_BASE=$SOURCE_BASE" >> "$GITHUB_ENV"
          echo "VERIFICATION_LOG=$LOG" >> "$GITHUB_ENV"

          echo "S1D independent cold verification"
          echo "implementation_head=$IMPLEMENTATION_HEAD"
          echo "integrated_commit=$INTEGRATED_COMMIT"
          echo "source_base=$SOURCE_BASE"
          echo "tested_head=$TESTED_HEAD"
          git status --short

          git merge-base --is-ancestor "$IMPLEMENTATION_HEAD" "$INTEGRATED_COMMIT"
          git merge-base --is-ancestor "$INTEGRATED_COMMIT" "$SOURCE_BASE"
          git diff --exit-code "$INTEGRATED_COMMIT".."$SOURCE_BASE" -- \
            crates/optid/Cargo.toml \
            crates/optid/src/bin/optid-lever-contracts.rs \
            crates/optid/src/lever_contract.rs \
            crates/optid/src/lib.rs \
            crates/optid/tests/fixtures/s1d-lever-contracts-v1.toml \
            crates/optid/tests/lever_contract_cli.rs

          rustc --version --verbose
          cargo --version
          python3 --version
          git --version

          cargo fmt --all -- --check
          cargo check -p optid --all-targets --all-features
          cargo clippy -p optid --all-targets --all-features -- -D warnings

          for test_name in \
            s1d_registry_contains_all_eleven_complete_lever_contracts \
            s1d_fixture_requires_every_field_for_every_lever \
            s1d_each_lever_has_exact_rollback_and_distinct_stabilization \
            s1d_missing_identity_original_envelope_or_verification_denies_actuation \
            s1d_missing_stabilization_evidence_fails_closed \
            s1d_tightening_an_envelope_never_authorizes_a_denied_value \
            s1d_current_defaults_are_allowed_and_unknown_values_fail_closed \
            s1d_planned_levers_remain_fail_closed_until_their_write_packages_exist
          do
            cargo test -p optid --lib "lever_contract::tests::$test_name" -- --exact
          done

          cargo test -p optid --test lever_contract_cli \
            s1d_contract_cli_checks_registry_through_production_surface -- --exact
          cargo test -p optid

          cargo run -q -p optid --bin optid-lever-contracts -- --check
          cargo run -q -p optid --bin optid-lever-contracts -- --list | tee "$RUNNER_TEMP/s1d-contract-list.txt"
          test "$(wc -l < "$RUNNER_TEMP/s1d-contract-list.txt")" -eq 11
          cargo run -q -p optid --bin optid-lever-contracts -- --json > "$RUNNER_TEMP/s1d-contracts.json"
          python3 - <<'PY'
          import json
          from pathlib import Path
          rows = json.loads(Path("${{ runner.temp }}/s1d-contracts.json").read_text())
          assert len(rows) == 11, len(rows)
          assert {row["lever"] for row in rows} == {
              "cpu_dma_pm_qos", "device_pm_qos", "cpu_epp", "platform_profile",
              "runtime_pm", "sata_alpm", "pcie_aspm", "backlight", "vm_sysctl",
              "powercap_pl1", "dgpu_runtime_pm",
          }
          PY

          python3 tools/validate-current-work.py
          python3 tools/validate-optid-packages.py
          python3 tools/render-frontpage.py --check
          git diff --check

      - name: Upload independent proof log
        uses: actions/upload-artifact@v4
        with:
          name: s1d-cold-verification-${{ github.run_id }}
          path: |
            ${{ env.VERIFICATION_LOG }}
            ${{ runner.temp }}/s1d-contract-list.txt
            ${{ runner.temp }}/s1d-contracts.json
          if-no-files-found: error
          retention-days: 30

      - name: Record passing receipt and advance the safety lane
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          RUNNER_DESCRIPTION: ${{ runner.os }} ${{ runner.arch }} ubuntu-24.04
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from __future__ import annotations

          import os
          import re
          from pathlib import Path

          root = Path(".")
          tested_head = os.environ["TESTED_HEAD"]
          source_base = os.environ["SOURCE_BASE"]
          pr_number = int(os.environ["PR_NUMBER"])
          run_id = int(os.environ["RUN_ID"])
          run_attempt = int(os.environ["RUN_ATTEMPT"])
          runner = os.environ["RUNNER_DESCRIPTION"]

          receipt = f'''# Independent cold-verification receipt for S1D:
          # Freeze per-lever rollback, stabilization, and semantic envelopes.
          #
          # The verifier was separate from the PR #382 implementation builder. The
          # read-only phase ran before any ledger or generated-document update. No
          # S1D implementation, test, fixture, CLI, runtime default, or actuation path
          # was repaired during verification.

          schema_version = 1
          package = "S1D"
          implementation_pr = 382
          verification_pr = {pr_number}
          verified_commit = "{tested_head}"
          implementation_head = "e6904f6d94c31c7bd56cacce50cb64064a5650ea"
          integrated_commit = "6a173f0051ef3fda31dc685ebc524fc6b10442bf"
          source_base_commit = "{source_base}"
          verifier = "Independent ChatGPT GitHub verifier session, separate from the PR #382 implementation builder; {runner}"
          result = "pass"
          workflow_run = {run_id}
          workflow_attempt = {run_attempt}

          commands = [
            "git diff --exit-code 6a173f0051ef3fda31dc685ebc524fc6b10442bf..{source_base} -- all six declared S1D proof files -> no changes",
            "cargo fmt --all -- --check -> passed",
            "cargo check -p optid --all-targets --all-features -> passed",
            "cargo clippy -p optid --all-targets --all-features -- -D warnings -> passed",
            "each of the eight mapped lever_contract::tests::s1d_* unit tests executed individually with --exact -> passed",
            "cargo test -p optid --test lever_contract_cli s1d_contract_cli_checks_registry_through_production_surface -- --exact -> passed",
            "cargo test -p optid -> passed",
            "optid-lever-contracts --check, --list, and --json -> valid registry with exactly eleven unique levers",
            "python3 tools/validate-current-work.py -> passed before state transition",
            "python3 tools/validate-optid-packages.py -> passed before state transition",
            "python3 tools/render-frontpage.py --check -> passed before state transition",
            "git diff --check -> passed",
          ]

          runtime_proofs = [
            "Exact source binding: the PR #382 implementation head is an ancestor of merge commit 6a173f0051ef3fda31dc685ebc524fc6b10442bf; every declared S1D runtime, test, fixture, and evidence path is byte-unchanged from that merge through source base {source_base}.",
            "Production surface: the optid-lever-contracts executable validated the typed registry and emitted exactly eleven rows through both list and JSON modes.",
            "Fail-closed authorization: missing identity, original capture, envelope value, or verification denied actuation; unknown values and both planned levers remained denied.",
            "Handback semantics: every lever produced a verified exact rollback plan distinct from emergency stabilization, and evidence-gated stabilizers denied use when supporting evidence was absent.",
            "Envelope monotonicity: the mapped tightening test proved a narrower backlight envelope did not authorize any value denied by the broader envelope.",
            "Scope boundary: source inspection and commit comparison confirmed S1D remains a read-only registry/checker and does not alter daemon actuation, feature defaults, or the accepted D2 execution order.",
          ]

          source_inspection_only = [
            "All eleven contracts match the accepted D2 per-lever handback table for stable identity, ABI, credible worst case, exact rollback, separately named stabilization, verification, and fail-closed unsupported behavior.",
            "Fan actuation remains absent.",
            "Powercap PL1 and dGPU runtime PM remain planned and cannot authorize writes.",
          ]

          unresolved = []
          '''
          receipt = "\n".join(line[10:] if line.startswith("          ") else line for line in receipt.splitlines()) + "\n"
          receipt_path = root / "docs/plans/optid-verification/s1d.toml"
          receipt_path.write_text(receipt, encoding="utf-8")

          ledger_path = root / "docs/plans/optid-package-status.toml"
          ledger = ledger_path.read_text(encoding="utf-8")
          ledger = re.sub(r'^updated = "[^"]+"$', 'updated = "2026-08-03"', ledger, count=1, flags=re.MULTILINE)
          ledger = ledger.replace('active_safety = "S1D"', 'active_safety = "S2D"', 1)

          def package_block(text: str, package_id: str) -> tuple[re.Match[str], str]:
              match = re.search(
                  rf'(?ms)^\[\[package\]\]\nid = "{re.escape(package_id)}"\n.*?(?=^\[\[package\]\]|\Z)',
                  text,
              )
              if not match:
                  raise SystemExit(f"missing package block {package_id}")
              return match, match.group(0)

          match, s1d = package_block(ledger, "S1D")
          if 'status = "candidate"' not in s1d or 'pr = "382"' not in s1d:
              raise SystemExit("unexpected S1D ledger state")
          s1d = s1d.replace('status = "candidate"', 'status = "completed"', 1)
          s1d = s1d.replace(
              'pr = "382"\n',
              'pr = "382"\nverification_receipt = "docs/plans/optid-verification/s1d.toml"\n',
              1,
          )
          ledger = ledger[:match.start()] + s1d + ledger[match.end():]

          match, s2d = package_block(ledger, "S2D")
          if 'status = "planned"' not in s2d:
              raise SystemExit("unexpected S2D ledger state")
          s2d = s2d.replace('status = "planned"', 'status = "next"', 1)
          ledger = ledger[:match.start()] + s2d + ledger[match.end():]
          ledger_path.write_text(ledger, encoding="utf-8")

          current_path = root / "docs/plans/current-work.md"
          current = current_path.read_text(encoding="utf-8")
          current = current.replace('active_safety = "S1D"', 'active_safety = "S2D"', 1)
          current = current.replace(
              'unlocks_after_active_safety = ["S2D"]',
              'unlocks_after_active_safety = ["S3D"]',
              1,
          )
          current_path.write_text(current, encoding="utf-8")
          PY

          python3 tools/render-frontpage.py --write
          python3 tools/validate-current-work.py
          python3 tools/validate-optid-packages.py
          python3 tools/render-frontpage.py --check
          git diff --check

          rm .github/workflows/s1d-cold-verification.yml
          git config user.name "rush-s1d-verifier"
          git config user.email "rush-s1d-verifier@users.noreply.github.com"
          git add README.md docs/plans/current-work.md docs/plans/optid-package-status.toml \
            docs/plans/optid-verification/s1d.toml .github/workflows/s1d-cold-verification.yml
          git commit -m "verify(optid): cold-verify S1D lever contracts"
          git push origin "HEAD:${{ github.event.pull_request.head.ref }}"
