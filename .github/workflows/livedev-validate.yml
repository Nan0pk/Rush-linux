# LiveDev evidence validation CI job.
#
# Runs on every PR that touches evidence, schemas, or LiveDev tools.
# Validates:
#   - schema validation (hwtest-*.schema.json)
#   - semantic evidence validator (validate-hwtest-evidence.py)
#   - privacy/secret scan (rush_capture_lib redaction)
#   - provenance checks (source_commit in git, source_version in VERSION)
#   - event-chain validation (tamper-evident SHA-256 chain)
#   - AI summaries not treated as evidence (VERDICT.md check)
#   - release truth not changed by evidence PR

name: LiveDev validate

on:
  pull_request:
    branches: [main]
    paths:
      - 'release/evidence/livedev-*/**'
      - 'schemas/**'
      - 'tools/rush_capture_lib.py'
      - 'tools/validate-hwtest-evidence.py'
      - 'tools/rush_pr_lib.py'
      - '.github/workflows/livedev-validate.yml'

permissions:
  contents: read

jobs:
  livedev-validate:
    name: LiveDev mock harness
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest

      - name: Validate hardware evidence fixtures
        run: python3 tools/validate-hwtest-evidence.py --fixtures

      - name: Validate release evidence (if any livedev bundles exist)
        run: python3 tools/validate-hwtest-evidence.py --release-evidence || true

      - name: Run capture tests
        run: python3 -m pytest tools/test-rush-capture.py -q

      - name: Run planner tests
        run: python3 -m pytest tools/test-rush-autopilot.py -q

      - name: Run runner tests
        run: python3 -m pytest tools/test-rush-runner.py -q

      - name: Run AI harness tests
        run: python3 -m pytest tools/test-rush-agent.py -q

      - name: Run evidence validator tests
        run: python3 -m pytest tools/test-validate-hwtest-evidence.py -q

      - name: Run LiveDev image tests
        run: python3 -m pytest tools/test-livedev-image.py -q

      - name: Run PR submission tests
        run: python3 -m pytest tools/test-rush-pr.py -q

      - name: Run E2E dry run (all scenarios)
        run: python3 tools/livedev-e2e-dry-run.py --all

      - name: Check release truth not modified
        run: |
          # Verify that no release-truth files are modified by this PR.
          git fetch origin main
          for f in VERSION Cargo.toml RELEASES.md release/milestones.toml release/test-tiers.toml; do
            if git diff --name-only origin/main...HEAD | grep -q "^${f}$"; then
              echo "ERROR: release-truth file ${f} was modified by this PR"
              exit 1
            fi
          done
          echo "OK: no release-truth files modified"

      - name: Check no self-merge commands
        run: |
          # Verify that no merge-related commands exist in the rush tools.
          if grep -r "pr.*merge\|gh.*merge\|pulls/.*/merge" tools/rush_pr_lib.py tools/rush-autopilot 2>/dev/null; then
            echo "ERROR: merge command found in rush PR tools"
            exit 1
          fi
          echo "OK: no self-merge commands"
