name: Source build preflight patch

on:
  push:
    branches:
      - work/20260906-source-build-preflight-provenance

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply and verify patch
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --quiet pytest
          python3 .github/source-build-preflight-patch.py
          rm .github/source-build-preflight-patch.py
          rm .github/workflows/source-build-preflight-patch.yml
          bash -n tools/build-mkosi-image.sh
          python3 -m pytest -q tools/test-build-mkosi-base-boundary.py
          git diff --check
          unexpected="$(git diff --name-only | grep -Ev '^(tools/build-mkosi-image.sh|tools/test-build-mkosi-base-boundary.py|\.github/source-build-preflight-patch.py|\.github/workflows/source-build-preflight-patch.yml)$' || true)"
          if [[ -n "$unexpected" ]]; then
            echo "Unexpected changed files:"
            echo "$unexpected"
            exit 1
          fi
          git config user.name "Rush coordinating agent"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "build: record resolved mkosi preflight"
          git push origin HEAD:work/20260906-source-build-preflight-provenance
