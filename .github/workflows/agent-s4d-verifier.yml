name: S4D shared-surface candidate verification

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize]

permissions:
  contents: write
  actions: read

concurrency:
  group: s4d-independent-verifier-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  verify:
    name: Cold-verify shared surfaces and S4D candidate
    if: >-
      github.event.pull_request.head.ref == 'work/20260804-s4d-sealed-capability-table' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      IMPLEMENTATION_HEAD: fd1658026b0399a801ba7355c34e7df3e46bdf32
      PROOF_LOG: s4d-shared-surface-verification.log
      ARTIFACT_NAME: s4d-shared-surface-verification-${{ github.run_id }}

    steps:
      - name: Check out verifier branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libdbus-1-dev pkg-config

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2

      - name: Require each mapped test to exist before execution
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('tools/agent-s4d-verifier-run.sh')
          text = path.read_text(encoding='utf-8')
          old = '''while IFS=$'\\t' read -r package_id test_name; do
            echo "acceptance_package=$package_id test=$test_name"
            output=$(mktemp)
            cargo test -p optid --color never "$test_name" -- --nocapture 2>&1 | tee "$output"
            grep -F "$test_name ... ok" "$output"
          done < /tmp/s4d-affected-acceptance.tsv
          '''
          new = '''while IFS=$'\\t' read -r package_id test_name; do
            echo "acceptance_package=$package_id test=$test_name"
            listed=$(mktemp)
            cargo test -p optid --all-features --color never "$test_name" -- --list \\
              2>&1 | tee "$listed"
            grep -F "$test_name: test" "$listed"
            cargo test -p optid --all-features --color never "$test_name" -- --nocapture
          done < /tmp/s4d-affected-acceptance.tsv
          '''
          if text.count(old) != 1:
              raise SystemExit('expected one mapped-test loop in verifier runner')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Independently recertify all affected surfaces
        run: bash tools/agent-s4d-verifier-run.sh

      - name: Upload immutable verifier evidence
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: ${{ env.PROOF_LOG }}
          if-no-files-found: error
          retention-days: 30

      - name: Resolve workflow and artifact provenance
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          job_id=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/jobs" \
            --jq '.jobs[] | select(.name == "Cold-verify shared surfaces and S4D candidate") | .id')
          artifact=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts" \
            --jq ".artifacts[] | select(.name == \"$ARTIFACT_NAME\")")
          test -n "$job_id"
          test -n "$artifact"
          echo "WORKFLOW_JOB=$job_id" >> "$GITHUB_ENV"
          echo "ARTIFACT_ID=$(jq -r '.id' <<<"$artifact")" >> "$GITHUB_ENV"
          echo "ARTIFACT_DIGEST=$(jq -r '.digest' <<<"$artifact")" >> "$GITHUB_ENV"
          echo "ARTIFACT_SIZE=$(jq -r '.size_in_bytes' <<<"$artifact")" >> "$GITHUB_ENV"
          echo "ARTIFACT_EXPIRES=$(jq -r '.expires_at' <<<"$artifact")" >> "$GITHUB_ENV"
          test "$(jq -r '.digest' <<<"$artifact")" != null

      - name: Publish fresh receipts and S4D candidate state
        env:
          WORKFLOW_RUN: ${{ github.run_id }}
          WORKFLOW_ATTEMPT: ${{ github.run_attempt }}
        run: |
          set -euo pipefail
          python3 tools/agent-s4d-verify.py
          python3 tools/render-frontpage.py --write
          python3 tools/validate-current-work.py
          python3 tools/validate-optid-packages.py
          python3 tools/render-frontpage.py --check
          git diff --check

          rm tools/agent-s4d-verify.py tools/agent-s4d-verifier-run.sh \
            .github/workflows/agent-s4d-verifier.yml

          python3 - <<'PY'
          import os
          import subprocess
          allowed = {
              'README.md',
              'docs/plans/optid-package-status.toml',
              'docs/plans/optid-verification/f1.toml',
              'docs/plans/optid-verification/f2.toml',
              'docs/plans/optid-verification/f3.toml',
              'docs/plans/optid-verification/f4.toml',
              'docs/plans/optid-verification/d0.toml',
              'docs/plans/optid-verification/s2d.toml',
              'docs/plans/optid-verification/s3d.toml',
          }
          files = set(subprocess.check_output(
              ['git', 'diff', '--name-only', os.environ['IMPLEMENTATION_HEAD']],
              text=True,
          ).splitlines())
          required = allowed - {'README.md'}
          assert required <= files <= allowed, files
          print('publication_diff=' + ','.join(sorted(files)))
          PY

          git config user.name rush-s4d-independent-verifier
          git config user.email rush-s4d-independent-verifier@users.noreply.github.com
          git add -A
          git commit -m 'verify(optid): recertify shared surfaces and record S4D candidate'
          git push origin "HEAD:${{ github.event.pull_request.head.ref }}"
