name: S2D F4 cold verification

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize]

permissions:
  contents: write

concurrency:
  group: s2d-f4-cold-verification-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  verify:
    if: >-
      github.event.pull_request.head.ref == 'verify/20260804-s2d-f4-transactions' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Validate exact post-merge verifier branch
        run: |
          set -euo pipefail
          test -z "$(git status --porcelain)"
          test "$(git branch --show-current)" = "verify/20260804-s2d-f4-transactions"
          git fetch origin main
          test "$(git merge-base HEAD origin/main)" = "2247d460a67a8b1674bf7f8734008411d2471920"
          git merge-base --is-ancestor \
            c7741c9017bba939571a82de4ea49b1fe1608108 \
            2247d460a67a8b1674bf7f8734008411d2471920
          python3 tools/check-workflow-safety.py

      - name: Install verification dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libdbus-1-dev pkg-config

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Independently cold-verify integrated S2D and F4
        env:
          INTEGRATED_COMMIT: 2247d460a67a8b1674bf7f8734008411d2471920
        run: |
          set -euo pipefail
          LOG="$RUNNER_TEMP/s2d-f4-cold-verification.log"
          exec > >(tee -a "$LOG") 2>&1
          echo "VERIFICATION_LOG=$LOG" >> "$GITHUB_ENV"

          proof_paths=(
            crates/optid/src/main.rs
            crates/optid/src/reconciler/mod.rs
            crates/optid/src/reconciler/state.rs
            crates/optid/src/reconciler/targets.rs
            crates/optid/src/reconciler/apply.rs
            crates/optid/src/reconciler/restore.rs
            crates/optid/src/reconciler/transaction.rs
            crates/optid/src/reconciler/tests.rs
            crates/optid/src/reconciler/tests/production.rs
            crates/optid/src/reconciler/tests/s2d.rs
            crates/optid/src/reconciler/tests/systemd.rs
            crates/optid/src/reconciler/tests/unit.rs
            docs/architecture/optid-s2d-persistent-transactions.md
          )

          git diff --exit-code "$INTEGRATED_COMMIT"..origin/main -- "${proof_paths[@]}"
          git diff --exit-code "$INTEGRATED_COMMIT"..HEAD -- "${proof_paths[@]}"
          test -z "$(git diff --name-only "$INTEGRATED_COMMIT"..HEAD -- crates/optid/src/kernel_io.rs crates/optid/src/kernel_io_impl.rs)"

          rustc --version --verbose
          cargo --version
          python3 --version
          git --version
          cargo clean
          cargo fmt --all -- --check
          cargo check --workspace --all-targets --all-features
          cargo clippy --workspace --all-targets --all-features -- -D warnings

          exact_tests=(
            f4_production_coalesces_confirmed_value_and_writes_one_change
            f4_production_runtime_pm_transition_restores_baseline
            f4_production_external_drift_relinquishes_without_overwrite
            f4_restart_hydrates_real_legacy_journal_and_ownership
            f4_restart_hydrates_typed_vm_state_and_restores
            f4_systemd_multiple_properties_apply_restore_and_unset
            f4_systemd_partial_property_failure_is_typed_and_independent
            f4_systemd_readback_mismatch_never_claims_ownership
            f4_transition_detection_covers_ac_workload_mode_and_domain_off
            f4_malformed_typed_state_fails_closed
            f4_active_kernel_drift_relinquishes_and_stays_handed_back
            f4_active_systemd_drift_relinquishes_and_stays_handed_back
            f4_missing_baseline_or_confirmation_never_plans_a_pretend_restore
            f4_multiple_targets_in_one_domain_remain_independent
            f4_production_multiple_targets_restore_only_disappeared_target
            f4_production_device_disappearance_relinquishes_ownership
            f4_retry_policy_is_bounded
            f4_systemd_property_lifecycle_distinguishes_unset_and_explicit
            f4_systemd_external_drift_is_not_overwritten
            f4_shadow_parity_reports_systemd_as_intentional_v1_only
            s2d_durable_record_is_synced_before_production_write
            s2d_full_disk_before_publish_refuses_mutation
            s2d_fsync_failure_refuses_mutation
            s2d_partial_publish_failure_refuses_mutation
            s2d_prepared_record_covers_crash_before_write
            s2d_write_failure_compensates_and_cleans
            s2d_readback_mismatch_compensates_and_cleans
            s2d_stale_generation_is_rejected
            s2d_path_reuse_identity_mismatch_is_rejected
            s2d_repeated_compensation_is_idempotent
            s2d_external_drift_relinquishes_without_overwrite
            s2d_production_commit_then_verified_restore_compacts
            s2d_production_daemon_run_uses_persistent_transaction_protocol
            s2d_record_path_is_stable_across_generations
            s2d_stale_generation_handback_does_not_compact
            s2d_compensation_attempts_every_target_after_one_failure
          )
          for test_name in "${exact_tests[@]}"; do
            cargo test -p optid --bin optid \
              "reconciler::tests::$test_name" -- --exact
          done

          cargo test --workspace

          grep -Fq 'const DEFAULT_RECOVERY_DIR: &str = "/var/lib/optid/recovery";' \
            crates/optid/src/reconciler/transaction.rs
          grep -Fq 'DefaultHasher does not promise' \
            crates/optid/src/reconciler/transaction.rs
          grep -Fq 'hash = hash.wrapping_mul(0x00000100000001b3);' \
            crates/optid/src/reconciler/transaction.rs

          python3 tools/validate-current-work.py
          python3 tools/validate-optid-packages.py
          python3 tools/render-frontpage.py --check
          git diff --check

      - name: Upload cold-verification log
        uses: actions/upload-artifact@v4
        with:
          name: s2d-f4-cold-verification-${{ github.run_id }}
          path: ${{ env.VERIFICATION_LOG }}
          if-no-files-found: error
          retention-days: 30

      - name: Record passing receipts and advance safety work
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          RUNNER_DESCRIPTION: ${{ runner.os }} ${{ runner.arch }} ubuntu-24.04
          VERIFIED_COMMIT: 2247d460a67a8b1674bf7f8734008411d2471920
        run: |
          set -euo pipefail
          python3 .github/s2d-f4-cold-verification.py
          python3 tools/render-frontpage.py --write

          rm .github/workflows/s2d-f4-cold-verification.yml \
            .github/s2d-f4-cold-verification.py

          git config user.name "rush-s2d-f4-verifier"
          git config user.email "rush-s2d-f4-verifier@users.noreply.github.com"
          git add -A
          git commit -m "verify(optid): cold-verify integrated S2D and F4"

          python3 tools/validate-current-work.py
          python3 tools/validate-optid-packages.py
          python3 tools/validate-optid-packages.py --base origin/main
          python3 tools/render-frontpage.py --check
          for section in integrity docs optid evidence policy; do
            bash tools/checks.sh --ci --section "$section" --changed-base origin/main
          done
          git diff --check origin/main...HEAD
          bash tools/finish-work.sh --dry-run
          git push origin "HEAD:${{ github.event.pull_request.head.ref }}"
