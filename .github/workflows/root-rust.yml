name: Root Rust workspace

on:
  pull_request:
    branches: [main]
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain*"
      - "crates/**"
      - ".github/workflows/root-rust.yml"
  push:
    branches: [main]
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain*"
      - "crates/**"
      - ".github/workflows/root-rust.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: root-rust-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  root-rust:
    name: Root Rust workspace
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libdbus-1-dev pkg-config

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          cache-targets: false

      - name: Run workspace tests as root
        env:
          ROOT_TARGET: ${{ runner.temp }}/rush-root-target
        run: |
          set -euo pipefail
          sudo -E env \
            HOME="$HOME" \
            PATH="$PATH" \
            CARGO_HOME="$HOME/.cargo" \
            RUSTUP_HOME="$HOME/.rustup" \
            CARGO_TARGET_DIR="$ROOT_TARGET" \
            "$HOME/.cargo/bin/cargo" test --workspace
