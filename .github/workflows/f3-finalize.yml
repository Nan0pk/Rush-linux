name: F3 finalize

on:
  pull_request:
    types:
      - synchronize
    branches:
      - main
    paths:
      - .github/workflows/f3-finalize.yml

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out F3 branch
        uses: actions/checkout@v7
        with:
          ref: fix/f3-versioned-runtime-outcomes
          fetch-depth: 0

      - name: Set up Rust formatting
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Correct package ledger and generated selectors
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from __future__ import annotations

          import json
          import re
          import tomllib
          from pathlib import Path

          ledger_path = Path('docs/plans/optid-package-status.toml')
          text = ledger_path.read_text(encoding='utf-8')

          old_header = '''# F1 and F2 have fresh independent cold-verification receipts and are
          # completed. F1's new receipt replaces the stale historical certification
          # while preserving its provenance in docs/plans/optid-verification/f1.toml.
          #
          # active_general is F3 because its F1 dependency is now completed and its
          # versioned envelope remains dormant in production. Dependencies unlock only
          # from `completed`; no package self-certifies completion.
          '''
          new_header = '''# F3 modifies proof paths previously cold-verified for F1 and F2, so those
          # receipts are retained as historical provenance but are no longer fresh for
          # this branch. F1 and F2 are therefore demoted until independent cold
          # verification covers a commit containing the F3 changes.
          #
          # active_general remains F3 because its production implementation is the
          # current repair target. It cannot advance to `candidate` while its F1
          # dependency is not `completed`; no package self-certifies completion.
          '''
          if old_header not in text:
              raise SystemExit('expected ledger header was not found')
          text = text.replace(old_header, new_header, 1)

          def package_block(source: str, package_id: str) -> tuple[re.Match[str], str]:
              pattern = re.compile(
                  rf'(?ms)^\[\[package\]\]\nid = "{re.escape(package_id)}"\n.*?(?=^\[\[package\]\]|\Z)'
              )
              match = pattern.search(source)
              if match is None:
                  raise SystemExit(f'package block {package_id} not found')
              return match, match.group(0)

          for package_id, reason in (
              (
                  'F1',
                  'F3 PR #369 modifies F1 declared proof paths (action.rs, actuator.rs, decision.rs, main.rs, and policy.rs), so the existing cold-verification receipt is stale for this branch. A fresh independent cold verification receipt against a commit containing these changes is required before F1 may return to completed.',
              ),
              (
                  'F2',
                  'F3 PR #369 modifies F2 declared proof paths (actuator.rs, main.rs, sensors.rs, tests.rs, and tests_impl.rs), so the existing cold-verification receipt is stale for this branch. A fresh independent cold verification receipt against a commit containing these changes is required before F2 may return to completed.',
              ),
          ):
              match, block = package_block(text, package_id)
              block = block.replace('status = "completed"', 'status = "merged_incomplete"', 1)
              pr_line = re.search(r'^pr = "[0-9]+"$', block, re.MULTILINE)
              if pr_line is None:
                  raise SystemExit(f'PR line missing in {package_id}')
              insert_at = pr_line.end()
              block = block[:insert_at] + f'\nblocking_reason = {json.dumps(reason)}' + block[insert_at:]
              text = text[:match.start()] + block + text[match.end():]

          match, _ = package_block(text, 'F3')
          f3_block = '''[[package]]
          id = "F3"
          lane = "foundation"
          title = "Version observations, decisions, and action outcomes"
          status = "merged_incomplete"
          depends = ["F1"]
          pr = "369"
          blocking_reason = "Production integration, machine-readable status, typed gate and outcome evidence, golden schema coverage, and CLI pass-through tests are present in PR #369. F3 cannot advance to candidate while its required F1 dependency is demoted because this PR invalidated F1's earlier proof-path receipt. Restore F1 with a fresh independent cold-verification receipt, then perform F3's independent cold verification; no package self-certifies completion."
          runtime_entrypoints = [
            "crates/optid/src/main.rs",
            "crates/optid/src/envelope.rs",
            "crates/optid/src/dbus.rs",
            "crates/optctl/src/main.rs",
            "packaging/dbus/io.rushlinux.Optid.xml",
          ]
          integration_tests = [
            "crates/optid/src/tests.rs",
            "crates/optctl/tests/status_cli.rs",
          ]
          completion_evidence = [
            "crates/optid/src/envelope.rs",
            "crates/optid/src/tests.rs",
            "crates/optid/tests/fixtures/f3-control-cycle-v2.json",
            "crates/optctl/tests/status_cli.rs",
            "docs/architecture/optid-f3-control-cycle-envelope.md",
          ]
          [package.acceptance_tests]
          gate_matrix = "f3_gate_matrix_distinguishes_dry_run_observe_off_and_boot_disarm"
          actuator_denials = "f3_actuator_matrix_reports_missing_unsupported_contract_and_allowlist_denials"
          action_outcomes = "f3_actuator_matrix_reports_success_failure_readback_drift_and_redundancy"
          restore_outcomes = "f3_restore_matrix_reports_actual_success_failure_malformed_and_not_applicable"
          observation_outcomes = "f3_observation_matrix_distinguishes_malformed_and_permission_denied_reads"
          production_cycle = "f3_production_daemon_run_writes_one_correlated_versioned_cycle"

          '''
          text = text[:match.start()] + f3_block + text[match.end():]
          ledger_path.write_text(text, encoding='utf-8')

          with ledger_path.open('rb') as handle:
              ledger = tomllib.load(handle)
          by_id = {str(item['id']): item for item in ledger['package']}

          def direct_unlocks(active_id: str) -> list[str]:
              completed = {
                  package_id
                  for package_id, package in by_id.items()
                  if package.get('status') == 'completed'
              }
              hypothetical = completed | {active_id}
              return sorted(
                  package_id
                  for package_id, package in by_id.items()
                  if package.get('status') not in {'completed', 'blocked'}
                  and active_id in {str(dep) for dep in package.get('depends', [])}
                  and {str(dep) for dep in package.get('depends', [])} <= hypothetical
              )

          active_general = str(ledger['active_general'])
          active_safety = str(ledger['active_safety'])
          selector = {
              'active_general': active_general,
              'active_safety': active_safety,
              'ready_parallel': sorted(
                  package_id
                  for package_id, package in by_id.items()
                  if package.get('status') == 'ready_parallel'
              ),
              'other_merged_incomplete': sorted(
                  package_id
                  for package_id, package in by_id.items()
                  if package.get('status') == 'merged_incomplete'
                  and package_id not in {active_general, active_safety}
              ),
              'unlocks_after_active_general': direct_unlocks(active_general),
              'unlocks_after_active_safety': direct_unlocks(active_safety),
          }
          current_path = Path('docs/plans/current-work.md')
          current = current_path.read_text(encoding='utf-8')
          start_marker = '<!-- RUSH_CURRENT_WORK:START -->'
          end_marker = '<!-- RUSH_CURRENT_WORK:END -->'
          start = current.index(start_marker) + len(start_marker)
          end = current.index(end_marker, start)
          lines = [f'{key} = {json.dumps(value)}' for key, value in selector.items()]
          replacement = '\n```toml\n' + '\n'.join(lines) + '\n```\n'
          current_path.write_text(current[:start] + replacement + current[end:], encoding='utf-8')
          PY
          python3 tools/render-frontpage.py --write

      - name: Format, remove corrupt staging files, commit and push
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --all
          rm -f tools/f3-supplement.part-00 tools/f3-supplement.part-01 tools/f3-supplement.part-02
          rm -f .github/workflows/f3-finalize.yml
          git diff --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'fix(optid): finalize F3 builder handoff truthfully'
          git push origin HEAD:fix/f3-versioned-runtime-outcomes
