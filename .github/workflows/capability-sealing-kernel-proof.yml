name: Capability sealing kernel proof

on:
  pull_request:
    paths:
      - "crates/optid/Cargo.toml"
      - "crates/optid/src/bin/optid-capability-seal-test.rs"
      - "crates/optid/src/capability_seal_test/**"
      - "crates/optid/tests/capability_sealing_cli.rs"
      - "packaging/systemd/optid-capability-seal-test.service"
      - ".github/workflows/capability-sealing-kernel-proof.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  kernel-proof:
    name: Prove Landlock and cold-restart contract
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@stable

      - name: Test the feature-gated binary and CLI contract
        run: |
          set -euo pipefail
          cargo test -p optid --features experimental-capability-sealing \
            --bin optid-capability-seal-test
          cargo test -p optid --features experimental-capability-sealing \
            --test capability_sealing_cli

      - name: Build the kernel proof binary
        run: |
          set -euo pipefail
          cargo build -p optid --features experimental-capability-sealing \
            --bin optid-capability-seal-test
          sudo install -D -m 0755 target/debug/optid-capability-seal-test \
            /usr/local/libexec/optid-capability-seal-test

      - name: Validate the test-only supervisor unit
        run: |
          set -euo pipefail
          systemd-analyze verify packaging/systemd/optid-capability-seal-test.service

      - name: Run the cold kernel proof
        run: |
          set -euo pipefail
          {
            echo "verified_commit=$(git rev-parse HEAD)"
            echo "kernel_uname=$(uname -a)"
            if [[ -r /sys/kernel/security/lsm ]]; then
              echo "active_lsms=$(cat /sys/kernel/security/lsm)"
            else
              echo "active_lsms=unavailable"
            fi
            /usr/local/libexec/optid-capability-seal-test --probe
          } 2>&1 | tee capability-sealing-kernel-proof.log

      - name: Run the supervised two-cycle cold restart
        run: |
          set -euo pipefail

          sudo install -D -m 0644 \
            packaging/systemd/optid-capability-seal-test.service \
            /etc/systemd/system/optid-capability-seal-test.service
          sudo touch /run/optid-capability-seal-test-enabled
          sudo rm -rf /run/optid-capability-seal-test
          sudo systemctl daemon-reload
          sudo systemctl reset-failed optid-capability-seal-test.service || true
          sudo systemctl start optid-capability-seal-test.service

          for _ in $(seq 1 60); do
            active_state=$(systemctl show optid-capability-seal-test.service \
              -p ActiveState --value)
            result=$(systemctl show optid-capability-seal-test.service \
              -p Result --value)
            restart_count=$(systemctl show optid-capability-seal-test.service \
              -p NRestarts --value)
            if [[ "$active_state" == "inactive" && "$result" == "success" && \
                  "$restart_count" == "1" ]]; then
              break
            fi
            if [[ "$active_state" == "failed" ]]; then
              break
            fi
            sleep 1
          done

          sudo journalctl --sync
          sudo journalctl -u optid-capability-seal-test.service \
            --no-pager -o cat | tee /tmp/d0-supervisor-success.log
          systemctl show optid-capability-seal-test.service \
            -p ActiveState -p SubState -p Result -p ExecMainCode \
            -p ExecMainStatus -p NRestarts | tee /tmp/d0-supervisor-success.status

          active_state=$(systemctl show optid-capability-seal-test.service \
            -p ActiveState --value)
          result=$(systemctl show optid-capability-seal-test.service \
            -p Result --value)
          exec_status=$(systemctl show optid-capability-seal-test.service \
            -p ExecMainStatus --value)
          restart_count=$(systemctl show optid-capability-seal-test.service \
            -p NRestarts --value)

          test "$active_state" = "inactive"
          test "$result" = "success"
          test "$exec_status" = "0"
          test "$restart_count" = "1"
          test "$(grep -cF 'recovery step completed:' /tmp/d0-supervisor-success.log)" -eq 2
          test "$(grep -cF 'recovery marker verified before capability discovery:' /tmp/d0-supervisor-success.log)" -eq 2
          test "$(grep -cF 'capability-sealing proof passed (8 checks)' /tmp/d0-supervisor-success.log)" -eq 2
          test "$(grep -cF 'first sealed cycle complete; requesting topology rebuild with status 75' /tmp/d0-supervisor-success.log)" -eq 1
          test "$(grep -cF 'fresh sealed process started after recovery; supervisor cycle complete' /tmp/d0-supervisor-success.log)" -eq 1

          {
            echo
            echo "supervised_restart=pass"
            cat /tmp/d0-supervisor-success.status
            cat /tmp/d0-supervisor-success.log
          } >> capability-sealing-kernel-proof.log

      - name: Prove non-75 failures do not restart
        run: |
          set -euo pipefail

          sudo mkdir -p \
            /run/systemd/system/optid-capability-seal-test.service.d
          sudo tee \
            /run/systemd/system/optid-capability-seal-test.service.d/non75.conf \
            >/dev/null <<'EOF'
          [Service]
          ExecStart=
          ExecStart=/bin/sh -c 'exit 1'
          EOF
          sudo systemctl daemon-reload
          sudo systemctl reset-failed optid-capability-seal-test.service || true

          set +e
          sudo systemctl start optid-capability-seal-test.service
          start_status=$?
          set -e
          sleep 3

          systemctl show optid-capability-seal-test.service \
            -p ActiveState -p SubState -p Result -p ExecMainCode \
            -p ExecMainStatus -p NRestarts | tee /tmp/d0-non75.status

          result=$(systemctl show optid-capability-seal-test.service \
            -p Result --value)
          exec_status=$(systemctl show optid-capability-seal-test.service \
            -p ExecMainStatus --value)
          restart_count=$(systemctl show optid-capability-seal-test.service \
            -p NRestarts --value)

          test "$start_status" -ne 0
          test "$result" = "exit-code"
          test "$exec_status" = "1"
          test "$restart_count" = "0"

          {
            echo
            echo "non_75_restart_suppression=pass"
            cat /tmp/d0-non75.status
          } >> capability-sealing-kernel-proof.log

          sudo rm -rf \
            /run/systemd/system/optid-capability-seal-test.service.d
          sudo systemctl daemon-reload
          sudo systemctl reset-failed optid-capability-seal-test.service || true

      - name: Upload the proof log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: capability-sealing-kernel-proof
          path: capability-sealing-kernel-proof.log
          if-no-files-found: error
