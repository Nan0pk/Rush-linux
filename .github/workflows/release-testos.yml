name: Release testOS image

# Builds the testOS .raw image and the testos-launcher/testos-ingest binaries,
# then uploads them as GitHub Release assets whenever a tag matching `v*` is
# pushed. Also supports manual dispatch from the Actions tab for testing.
#
# Outputs:
#   - testos-<version>.raw                          — the bootable USB image
#   - testos-launcher-<version>-linux-x86_64        — the host-side launcher binary
#   - testos-ingest-<version>-linux-x86_64          — the host-side ingest binary
#   - SHA256SUMS                                    — checksums for all of the above
#
# The README's "Try it on real hardware" section points users at these assets
# via testos/install.sh, which downloads the latest release and writes it to
# a USB stick in one command.
#
# Why an Arch container: mkosi needs archlinux-keyring and a real Arch
# package mirror to compose the image. The archlinux:latest Docker image
# gives us a clean, reproducible build environment.
#
# Manual testing:
#   gh workflow run release-testos.yml --ref <branch>
# or via the Actions UI.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      mock:
        description: 'Produce a mock image (skip the slow mkosi build, for testing the release-upload pipeline)'
        required: false
        default: 'false'
        type: choice
        options: ['false', 'true']
      tag:
        description: 'Release tag to create (e.g. v0.7.0-beta.2). If empty, derives from the VERSION file.'
        required: false
        default: ''

permissions:
  contents: write   # needed by softprops/action-gh-release to create the release

jobs:
  build:
    name: Build testOS image and binaries
    runs-on: ubuntu-latest
    container:
      image: archlinux:latest
      # mkosi needs to mount loop devices and create device-mapper nodes;
      # privileged + mapped URLs give it the access it needs.
      options: --privileged
    steps:
      - name: Install build dependencies
        run: |
          # archlinux:latest ships with a minimal pacman; sync and install.
          pacman -Syu --noconfirm
          # mkosi's required deps + the optional deps we actually need:
          #   - python-pefile, systemd-ukify: required to assemble the UKI
          #     boot image (mkosi lists them as optional, but our image is
          #     bootable so they're effectively required)
          #   - dosfstools: mkosi needs mkfs.fat to format the ESP partition
          #   - mtools: mkosi uses mcopy to populate the FAT ESP
          #   - edk2-ovmf: only needed for QEMU boot tests, not for build;
          #     leaving out to keep image smaller
          pacman -S --noconfirm --needed \
            base-devel \
            rust \
            mkosi \
            archlinux-keyring \
            git \
            dbus \
            systemd \
            systemd-ukify \
            python-pefile \
            dosfstools \
            mtools \
            zstd \
            util-linux \
            coreutils

      - uses: actions/checkout@v4

      - name: Initialize archlinux keyring
        run: |
          # Ensure the keyring is populated and trusted before mkosi tries
          # to verify packages.
          pacman-key --init
          pacman-key --populate archlinux

      - name: Build workspace (optid, optctl, rushbench, rush_collect, testos)
        run: cargo build --workspace --release

      - name: Build testOS image
        if: github.event.inputs.mock != 'true'
        run: bash testos/build-testos.sh

      - name: Create mock image (for testing release upload)
        if: github.event.inputs.mock == 'true'
        run: |
          mkdir -p build
          # A 1 MB placeholder file so the release-upload pipeline can be
          # tested without spending 10 minutes on the real mkosi build.
          dd if=/dev/urandom of=build/testos.raw bs=1M count=1 status=none
          echo "mock testOS image" > build/MOCK.txt

      - name: Derive release tag
        id: reltag
        run: |
          # Tag priority:
          #   1. Manual input (`inputs.tag`) from workflow_dispatch
          #   2. Pushed tag (`github.ref_name`) when triggered by `on.push.tags`
          #   3. `v<VERSION>` from the VERSION file
          INPUT_TAG="${{ inputs.tag }}"
          REF_TAG="${{ github.ref_name }}"
          FILE_VER="$(cat VERSION)"
          if [ -n "$INPUT_TAG" ]; then
            TAG="$INPUT_TAG"
          elif [[ "$REF_TAG" == v* ]]; then
            TAG="$REF_TAG"
          else
            TAG="v$FILE_VER"
          fi
          # Strip a leading 'v' for the bare version string used in asset names.
          # (Tags look like 'v0.7.0-beta.2'; asset names use '0.7.0-beta.2'.)
          VERSION="${TAG#v}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Resolved release tag: $TAG (version: $VERSION)"

      - name: Stage release artifacts
        env:
          RELEASE_VERSION: ${{ steps.reltag.outputs.version }}
        run: |
          VERSION="$RELEASE_VERSION"
          STAGE=/tmp/release-stage
          mkdir -p "$STAGE"

          # Compress the .raw image with zstd before uploading.
          # GitHub Releases has a 2 GB per-asset limit; the uncompressed
          # testos.raw is ~3.2 GB. zstd -19 typically gets a sparse-padded
          # disk image down to ~600-800 MB. The install scripts decompress
          # with `zstd -d` after download.
          # (Skip compression in mock mode — the mock file is 1 MB.)
          if [ -f build/MOCK.txt ]; then
            cp build/testos.raw "$STAGE/testos-${VERSION}.raw"
          else
            echo "Compressing build/testos.raw with zstd -19..."
            zstd -f -19 --rm build/testos.raw -o "$STAGE/testos-${VERSION}.raw.zst"
            echo "  Original: $(du -h build/testos.raw 2>/dev/null | cut -f1 || echo '?')"
            echo "  Compressed: $(du -h "$STAGE/testos-${VERSION}.raw.zst" | cut -f1)"
          fi

          # The rest of the artifacts are small; copy as-is.
          cp target/release/testos-launcher "$STAGE/testos-launcher-${VERSION}-linux-x86_64"
          cp target/release/testos-ingest   "$STAGE/testos-ingest-${VERSION}-linux-x86_64"
          cp testos/install.sh              "$STAGE/install.sh"
          cp testos/bench-list.toml         "$STAGE/bench-list.toml"

          # Generate checksums.
          cd "$STAGE"
          sha256sum * > SHA256SUMS

          # Make binaries executable.
          chmod +x testos-launcher-* testos-ingest-* install.sh

          ls -la "$STAGE"

      - uses: actions/upload-artifact@v4
        with:
          name: testos-release
          path: /tmp/release-stage/*

  # ─── Smoke test: boot the image in QEMU before publishing ───────
  # This catches boot failures (wrong kernel cmdline, missing services,
  # broken UKI, etc) BEFORE the release is published. The testOS runner
  # prints "testOS - Rush Linux benchmark environment" on tty1 and
  # "Available benchmarks:" on the menu. We boot with serial console
  # and wait for one of those strings within 90 seconds.
  #
  # Why a separate job: the build runs in a privileged Arch container
  # which doesn't have KVM access. The smoke test runs on the host
  # ubuntu-latest runner which has /dev/kvm for hardware-accelerated
  # boot (10x faster than TCG emulation).
  smoke-test:
    name: QEMU boot smoke test
    runs-on: ubuntu-latest
    needs: build
    # Skip the smoke test for mock builds (1 MB placeholder, not bootable)
    if: github.event.inputs.mock != 'true'
    steps:
      - name: Check KVM availability
        run: |
          # Check if /dev/kvm exists AND we can actually access it.
          # GitHub Actions runners have /dev/kvm but the default user
          # may not have permission. We try to read from it; if that
          # fails, we fall back to TCG (software emulation, slower).
          if [ -e /dev/kvm ] && [ -r /dev/kvm ] && [ -w /dev/kvm ]; then
            echo "KVM available and accessible - will use hardware acceleration"
            echo "ACCEL=kvm" >> $GITHUB_ENV
          elif [ -e /dev/kvm ]; then
            echo "KVM device exists but not accessible (permission denied)."
            echo "Trying to fix permissions with sudo..."
            sudo chmod 666 /dev/kvm 2>/dev/null || true
            if [ -r /dev/kvm ] && [ -w /dev/kvm ]; then
              echo "Fixed KVM permissions - will use hardware acceleration"
              echo "ACCEL=kvm" >> $GITHUB_ENV
            else
              echo "Could not fix KVM permissions - falling back to TCG"
              echo "ACCEL=tcg" >> $GITHUB_ENV
            fi
          else
            echo "KVM NOT available - will use TCG software emulation (slower)"
            echo "ACCEL=tcg" >> $GITHUB_ENV
          fi

      - name: Install QEMU
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qemu-system-x86 ovmf

      - name: Download release artifact
        uses: actions/download-artifact@v4
        with:
          name: testos-release
          path: ./release

      - name: Find and decompress the image
        run: |
          # Find the .raw.zst file
          IMAGE_ZST=$(find ./release -name 'testos-*.raw.zst' | head -1)
          if [ -z "$IMAGE_ZST" ]; then
            echo "ERROR: no testos-*.raw.zst found in release artifacts"
            ls -la ./release/
            exit 1
          fi
          echo "Found: $IMAGE_ZST"
          echo "Decompressing..."
          zstd -d "$IMAGE_ZST" -o testos.raw --force
          echo "Image size: $(du -h testos.raw | cut -f1)"

      - name: Boot in QEMU and wait for testOS menu
        run: |
          set +e
          # Boot the image in QEMU with serial console output to a log file.
          # The testOS runner prints these strings when it starts:
          #   "testOS - Rush Linux benchmark environment"
          #   "Available benchmarks:"
          # We wait for either within 120 seconds.
          #
          # Key QEMU flags:
          #   -machine q35     : modern chipset (needed for UEFI + virtio)
          #   -accel kvm       : hardware acceleration (or tcg fallback)
          #   -m 2048          : 2 GB RAM (testOS needs >= 1 GB)
          #   -smp 2           : 2 CPUs
          #   -drive           : raw disk image, virtio bus
          #   -serial          : serial console to log file
          #   -nographic       : no display, serial only
          #   -no-reboot       : don't reboot if the runner triggers reboot
          #   -bios /usr/share/OVMF/OVMF_CODE.fd : UEFI firmware (required
          #     because testOS uses a UKI in the ESP, which BIOS can't boot)
          #
          # The kernel cmdline has console=ttyS0,115200 so kernel + runner
          # output goes to the serial port, which QEMU writes to the log.

          # Find OVMF firmware. Ubuntu's ovmf package ships:
          #   /usr/share/OVMF/OVMF_CODE.fd  (read-only firmware code)
          #   /usr/share/OVMF/OVMF_VARS.fd  (writable variable store template)
          # Some older packages ship a combined /usr/share/ovmf/OVMF.fd.
          # We handle both cases.
          OVMF_CODE=""
          OVMF_VARS_TEMPLATE=""
          for path in \
            /usr/share/OVMF/OVMF_CODE.fd \
            /usr/share/ovmf/OVMF_CODE.fd \
            /usr/share/qemu/OVMF_CODE.fd; do
            if [ -f "$path" ]; then
              OVMF_CODE="$path"
              break
            fi
          done
          for path in \
            /usr/share/OVMF/OVMF_VARS.fd \
            /usr/share/ovmf/OVMF_VARS.fd; do
            if [ -f "$path" ]; then
              OVMF_VARS_TEMPLATE="$path"
              break
            fi
          done

          # Combined OVMF.fd fallback (single file, used as read-only pflash)
          COMBINED_OVMF=""
          if [ -z "$OVMF_CODE" ]; then
            for path in /usr/share/ovmf/OVMF.fd /usr/share/qemu/OVMF.fd; do
              if [ -f "$path" ]; then
                COMBINED_OVMF="$path"
                break
              fi
            done
          fi

          if [ -z "$OVMF_CODE" ] && [ -z "$COMBINED_OVMF" ]; then
            echo "ERROR: No OVMF UEFI firmware found."
            find /usr/share -name "OVMF*" -o -name "ovmf*" 2>/dev/null | head -20
            exit 1
          fi

          # Prepare the pflash drives for QEMU
          PFLASH_ARGS=""
          if [ -n "$OVMF_CODE" ]; then
            # Split format: code (read-only) + vars (writable copy)
            cp "$OVMF_VARS_TEMPLATE" /tmp/ovmf_vars.fd 2>/dev/null || \
              dd if=/dev/zero of=/tmp/ovmf_vars.fd bs=1M count=64 2>/dev/null
            PFLASH_ARGS="-drive if=pflash,format=raw,readonly=on,file=$OVMF_CODE -drive if=pflash,format=raw,file=/tmp/ovmf_vars.fd"
            echo "Using split OVMF: code=$OVMF_CODE, vars=/tmp/ovmf_vars.fd"
          else
            # Combined format: copy the whole file (writable) and use as pflash
            cp "$COMBINED_OVMF" /tmp/ovmf_combined.fd
            PFLASH_ARGS="-drive if=pflash,format=raw,file=/tmp/ovmf_combined.fd"
            echo "Using combined OVMF: $COMBINED_OVMF -> /tmp/ovmf_combined.fd"
          fi

          # Boot the image. Key flags:
          #   -machine q35     : modern chipset (needed for UEFI + virtio)
          #   -accel kvm       : hardware acceleration (or tcg fallback)
          #   -m 2048          : 2 GB RAM (testOS needs >= 1 GB)
          #   -smp 2           : 2 CPUs
          #   -drive virtio    : raw disk image
          #   -serial file=    : serial console to log file (kernel cmdline
          #     has console=ttyS0,115200 so all output goes here)
          #   -nographic       : no display, serial only
          #   -no-reboot       : don't reboot if the runner triggers reboot
          # TCG (software emulation) is ~10x slower than KVM. Give it
          # more time to boot. KVM boots in ~20-30s; TCG may take 2-4 min.
          BOOT_TIMEOUT=300
          if [ "${ACCEL}" = "kvm" ]; then
            BOOT_TIMEOUT=120
          fi
          echo "Boot timeout: ${BOOT_TIMEOUT}s (accel=${ACCEL})"

          timeout $BOOT_TIMEOUT qemu-system-x86_64 \
            -machine q35 \
            -accel ${ACCEL} \
            -m 2048 \
            -smp 2 \
            -drive file=testos.raw,format=raw,if=virtio \
            $PFLASH_ARGS \
            -serial file:qemu-serial.log \
            -nographic \
            -no-reboot \
            > qemu-stdout.log 2>&1 &
          QEMU_PID=$!

          # Poll the serial log for the success string
          SUCCESS=0
          POLL_INTERVAL=3
          MAX_POLLS=$(( BOOT_TIMEOUT / POLL_INTERVAL ))
          for i in $(seq 1 $MAX_POLLS); do
            sleep $POLL_INTERVAL
            if grep -q "testOS.*benchmark environment\|Available benchmarks:" qemu-serial.log 2>/dev/null; then
              echo "=== SUCCESS: testOS runner started ==="
              SUCCESS=1
              break
            fi
            # Check for the failure banner (runner diagnostic output).
            # SECURITY (audit finding #3): a runner failure must NOT be
            # treated as a successful smoke test. The previous code set
            # SUCCESS=1 here, which let the release job publish an image
            # while claiming the QEMU smoke test passed. We still break out
            # of the poll loop so the diagnostic output is captured and
            # uploaded, but SUCCESS stays 0 so the final exit 1 fires.
            if grep -q "testOS RUNNER FAILED" qemu-serial.log 2>/dev/null; then
              echo "=== testOS runner started but FAILED ==="
              echo "=== Capturing diagnostics; smoke test will fail. ==="
              break
            fi
            # Check for login prompt (means runner didn't start - condition issue)
            if grep -q "login:" qemu-serial.log 2>/dev/null; then
              echo "=== Got login prompt - runner service did not start ==="
              break
            fi
            echo "  Waiting for testOS menu... ($((i*POLL_INTERVAL))s elapsed)"
          done

          # Kill QEMU if still running
          kill $QEMU_PID 2>/dev/null || true
          wait $QEMU_PID 2>/dev/null || true

          echo ""
          echo "=== Serial console output (last 80 lines) ==="
          tail -80 qemu-serial.log 2>/dev/null || echo "(no serial output)"

          echo ""
          echo "=== QEMU stdout/stderr ==="
          cat qemu-stdout.log 2>/dev/null || echo "(no QEMU output)"

          # SECURITY (audit finding #3): belt-and-braces final assertion.
          # Even if the poll loop above somehow set SUCCESS=1 despite a
          # failure banner (e.g. a future refactor re-introduces the bug),
          # this independent check forces a hard failure. The release job
          # depends on this job, so a failure here blocks publication.
          if grep -q "testOS RUNNER FAILED" qemu-serial.log 2>/dev/null; then
            echo ""
            echo "=== FAILURE: testOS runner reported failure (testOS RUNNER FAILED banner detected) ==="
            echo "The image booted, but the testOS runner service reported a fatal error."
            echo "This is a release blocker. Check the serial log above for runner diagnostics."
            exit 1
          fi

          if [ $SUCCESS -eq 0 ]; then
            echo ""
            echo "=== FAILURE: testOS did not boot to the benchmark menu within ${BOOT_TIMEOUT}s ==="
            echo "The image may have a boot issue (broken UKI, missing service, wrong cmdline)."
            echo "Check the serial log above for details."
            exit 1
          fi

      - name: Upload QEMU serial log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: qemu-serial-log
          path: |
            qemu-serial.log
            qemu-stdout.log
          retention-days: 7

  # ─── Publish the release (only if smoke test passed) ────────────
  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: smoke-test
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download release artifact
        uses: actions/download-artifact@v4
        with:
          name: testos-release
          path: ./release

      - name: Derive release tag
        id: reltag
        run: |
          INPUT_TAG="${{ inputs.tag }}"
          REF_TAG="${{ github.ref_name }}"
          FILE_VER="$(cat VERSION)"
          if [ -n "$INPUT_TAG" ]; then
            TAG="$INPUT_TAG"
          elif [[ "$REF_TAG" == v* ]]; then
            TAG="$REF_TAG"
          else
            TAG="v$FILE_VER"
          fi
          VERSION="${TAG#v}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Resolved release tag: $TAG (version: $VERSION)"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.reltag.outputs.tag }}
          files: ./release/*
          generate_release_notes: true
          draft: false
          prerelease: true
          body: |
            ## testOS ${{ steps.reltag.outputs.version }}

            Prebuilt testOS image for USB benchmarking. See `install.sh` (Linux/macOS) or `install.ps1` (Windows) in the repo to flash this to a USB stick.

            **Mock build:** ${{ github.event.inputs.mock == 'true' }}

            **QEMU boot smoke test:** passed (the image booted to the testOS benchmark menu in QEMU with no `testOS RUNNER FAILED` banner before this release was published).

            See the [testOS README](https://github.com/Nan0pk/Rush-linux/blob/main/testos/README.md) for usage.
