name: Release testOS image

# Builds the testOS .raw image and the testos-launcher/testos-ingest binaries,
# then uploads them as GitHub Release assets whenever a tag matching `v*` is
# pushed. Also supports manual dispatch from the Actions tab for testing.
#
# Outputs:
#   - testos-<version>.raw                          — the bootable USB image
#   - testos-launcher-<version>-linux-x86_64        — the host-side launcher binary
#   - testos-ingest-<version>-linux-x86_64          — the host-side ingest binary
#   - SHA256SUMS                                    — checksums for all of the above
#
# The README's "Try it on real hardware" section points users at these assets
# via testos/install.sh, which downloads the latest release and writes it to
# a USB stick in one command.
#
# Why an Arch container: mkosi needs archlinux-keyring and a real Arch
# package mirror to compose the image. The archlinux:latest Docker image
# gives us a clean, reproducible build environment.
#
# Manual testing:
#   gh workflow run release-testos.yml --ref <branch>
# or via the Actions UI.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      mock:
        description: 'Produce a mock image (skip the slow mkosi build, for testing the release-upload pipeline)'
        required: false
        default: 'false'
        type: choice
        options: ['false', 'true']
      tag:
        description: 'Release tag to create (e.g. v0.7.0-beta.2). If empty, derives from the VERSION file.'
        required: false
        default: ''

permissions:
  contents: write   # needed by softprops/action-gh-release to create the release

jobs:
  build:
    name: Build testOS image and binaries
    runs-on: ubuntu-latest
    container:
      image: archlinux:latest
      # mkosi needs to mount loop devices and create device-mapper nodes;
      # privileged + mapped URLs give it the access it needs.
      options: --privileged
    steps:
      - name: Install build dependencies
        run: |
          # archlinux:latest ships with a minimal pacman; sync and install.
          pacman -Syu --noconfirm
          # mkosi's required deps + the optional deps we actually need:
          #   - python-pefile, systemd-ukify: required to assemble the UKI
          #     boot image (mkosi lists them as optional, but our image is
          #     bootable so they're effectively required)
          #   - dosfstools: mkosi needs mkfs.fat to format the ESP partition
          #   - mtools: mkosi uses mcopy to populate the FAT ESP
          #   - edk2-ovmf: only needed for QEMU boot tests, not for build;
          #     leaving out to keep image smaller
          pacman -S --noconfirm --needed \
            base-devel \
            rust \
            mkosi \
            archlinux-keyring \
            git \
            dbus \
            systemd \
            systemd-ukify \
            python-pefile \
            dosfstools \
            mtools \
            zstd \
            util-linux \
            coreutils

      - uses: actions/checkout@v4

      - name: Initialize archlinux keyring
        run: |
          # Ensure the keyring is populated and trusted before mkosi tries
          # to verify packages.
          pacman-key --init
          pacman-key --populate archlinux

      - name: Build workspace (optid, optctl, rushbench, rush_collect, testos)
        run: cargo build --workspace --release

      - name: Build testOS image
        if: github.event.inputs.mock != 'true'
        run: bash testos/build-testos.sh

      - name: Create mock image (for testing release upload)
        if: github.event.inputs.mock == 'true'
        run: |
          mkdir -p build
          # A 1 MB placeholder file so the release-upload pipeline can be
          # tested without spending 10 minutes on the real mkosi build.
          dd if=/dev/urandom of=build/testos.raw bs=1M count=1 status=none
          echo "mock testOS image" > build/MOCK.txt

      - name: Derive release tag
        id: reltag
        run: |
          # Tag priority:
          #   1. Manual input (`inputs.tag`) from workflow_dispatch
          #   2. Pushed tag (`github.ref_name`) when triggered by `on.push.tags`
          #   3. `v<VERSION>` from the VERSION file
          INPUT_TAG="${{ inputs.tag }}"
          REF_TAG="${{ github.ref_name }}"
          FILE_VER="$(cat VERSION)"
          if [ -n "$INPUT_TAG" ]; then
            TAG="$INPUT_TAG"
          elif [[ "$REF_TAG" == v* ]]; then
            TAG="$REF_TAG"
          else
            TAG="v$FILE_VER"
          fi
          # Strip a leading 'v' for the bare version string used in asset names.
          # (Tags look like 'v0.7.0-beta.2'; asset names use '0.7.0-beta.2'.)
          VERSION="${TAG#v}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Resolved release tag: $TAG (version: $VERSION)"

      - name: Stage release artifacts
        env:
          RELEASE_VERSION: ${{ steps.reltag.outputs.version }}
        run: |
          VERSION="$RELEASE_VERSION"
          STAGE=/tmp/release-stage
          mkdir -p "$STAGE"

          # Compress the .raw image with zstd before uploading.
          # GitHub Releases has a 2 GB per-asset limit; the uncompressed
          # testos.raw is ~3.2 GB. zstd -19 typically gets a sparse-padded
          # disk image down to ~600-800 MB. The install scripts decompress
          # with `zstd -d` after download.
          # (Skip compression in mock mode — the mock file is 1 MB.)
          if [ -f build/MOCK.txt ]; then
            cp build/testos.raw "$STAGE/testos-${VERSION}.raw"
          else
            echo "Compressing build/testos.raw with zstd -19..."
            zstd -f -19 --rm build/testos.raw -o "$STAGE/testos-${VERSION}.raw.zst"
            echo "  Original: $(du -h build/testos.raw 2>/dev/null | cut -f1 || echo '?')"
            echo "  Compressed: $(du -h "$STAGE/testos-${VERSION}.raw.zst" | cut -f1)"
          fi

          # The rest of the artifacts are small; copy as-is.
          cp target/release/testos-launcher "$STAGE/testos-launcher-${VERSION}-linux-x86_64"
          cp target/release/testos-ingest   "$STAGE/testos-ingest-${VERSION}-linux-x86_64"
          cp testos/install.sh              "$STAGE/install.sh"
          cp testos/bench-list.toml         "$STAGE/bench-list.toml"

          # Generate checksums.
          cd "$STAGE"
          sha256sum * > SHA256SUMS

          # Make binaries executable.
          chmod +x testos-launcher-* testos-ingest-* install.sh

          ls -la "$STAGE"

      - uses: actions/upload-artifact@v4
        with:
          name: testos-release
          path: /tmp/release-stage/*

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.reltag.outputs.tag }}
          files: /tmp/release-stage/*
          generate_release_notes: true
          draft: false
          prerelease: true   # Rush is beta; mark releases as prerelease until v1.0
          body: |
            ## testOS ${{ steps.reltag.outputs.version }}

            Prebuilt testOS image for USB benchmarking. See `install.sh` (Linux/macOS) or `install.ps1` (Windows) in the repo to flash this to a USB stick.

            **Mock build:** ${{ github.event.inputs.mock == 'true' }}

            See the [testOS README](https://github.com/Nan0pk/Rush-linux/blob/main/testos/README.md) for usage.
