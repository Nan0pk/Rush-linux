name: S2D builder proof

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/s2d-builder-proof.yml"
      - ".github/s2d-builder-chunk-*"

permissions:
  contents: write

concurrency:
  group: s2d-builder-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  build:
    if: github.event.pull_request.head.ref == 'work/20260803-s2d-persistent-transactions'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Validate bounded S2D staging branch
        run: |
          set -euo pipefail
          test -z "$(git status --porcelain)"
          test "$(git branch --show-current)" = "work/20260803-s2d-persistent-transactions"
          test "$(git merge-base HEAD origin/main)" = "3b29b6fbd1c79e4f61cff100551db4e0874cc5cd"
          python3 tools/check-workflow-safety.py
          python3 tools/validate-optid-packages.py

      - name: Install Rust system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libdbus-1-dev pkg-config

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2

      - name: Apply S2D package
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          cat .github/s2d-builder-chunk-* | base64 -d | gzip -d > "$RUNNER_TEMP/s2d-builder.py"
          sed -i 's|ROOT = Path(__file__).resolve().parents\[1\]|ROOT = Path.cwd()|' "$RUNNER_TEMP/s2d-builder.py"
          python3 "$RUNNER_TEMP/s2d-builder.py"
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              target = Path(path)
              text = target.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one normalization, found {count}")
              target.write_text(text.replace(old, new, 1), encoding="utf-8")

          replace_once(
              "crates/optid/src/reconciler/tests/s2d.rs",
              "use crate::kernel_io::{Clock, FaultKernel, KernelRead, KernelWrite};",
              "use crate::envelope::GateDisposition;\nuse crate::kernel_io::{Clock, FaultKernel, KernelRead, KernelWrite};",
          )
          replace_once(
              "crates/optid/src/reconciler/tests/s2d.rs",
              "    let mut reconciler =\n        s2d_reconciler(state_dir, recovery_dir.clone(), &mut actuator, \"repeat-generation\");",
              "    let reconciler =\n        s2d_reconciler(state_dir, recovery_dir.clone(), &mut actuator, \"repeat-generation\");",
          )
          for variant in ("FailSyncFile", "FailSyncDir"):
              replace_once(
                  "crates/optid/src/kernel_io_impl.rs",
                  f"    {variant} {{",
                  f"    #[allow(dead_code)]\n    {variant} {{",
              )
          for method in ("fail_next_sync_file", "fail_next_sync_dir"):
              replace_once(
                  "crates/optid/src/kernel_io_impl.rs",
                  f"    pub fn {method}(",
                  f"    #[allow(dead_code)]\n    pub fn {method}(",
              )
          replace_once(
              "crates/optid/src/reconciler/transaction.rs",
              "const TRANSACTION_SCHEMA_VERSION: u32 = 1;\nconst DEFAULT_RECOVERY_DIR: &str = \"/var/lib/optid/recovery\";",
              "const TRANSACTION_SCHEMA_VERSION: u32 = 1;\n#[cfg(not(test))]\nconst DEFAULT_RECOVERY_DIR: &str = \"/var/lib/optid/recovery\";",
          )
          replace_once(
              "crates/optid/src/reconciler/transaction.rs",
              "impl TransactionPhase {\n    fn is_terminal(self) -> bool {",
              "impl TransactionPhase {\n    #[cfg(test)]\n    fn is_terminal(self) -> bool {",
          )
          replace_once(
              "crates/optid/src/reconciler/transaction.rs",
              "    fn active_records(\n",
              "    #[cfg(test)]\n    fn active_records(\n",
          )
          replace_once(
              "crates/optid/src/reconciler/transaction.rs",
              "    #[cfg(test)]\n    {\n        return state_dir.join(\"s2d-recovery\");\n    }",
              "    #[cfg(test)]\n    {\n        state_dir.join(\"s2d-recovery\")\n    }",
          )
          replace_once(
              "crates/optid/src/reconciler/state.rs",
              "    fn load_with_systemd(\n",
              "    #[cfg(test)]\n    fn load_with_systemd(\n",
          )
          replace_once(
              "crates/optid/src/reconciler/tests/unit.rs",
              "    reconciler.record_restore_outcome(&plan, &outcome, &io);",
              "    reconciler\n        .record_restore_outcome(&plan, &outcome, &io)\n        .expect(\"record restore outcome\");",
          )
          PY
          python3 tools/render-frontpage.py --write
          cargo fmt --all

      - name: Check S2D implementation
        run: |
          set -euo pipefail
          cargo fmt --all -- --check
          cargo check -p optid --all-targets --all-features
          cargo clippy -p optid --all-targets --all-features -- -D warnings
          for test_name in \
            s2d_durable_record_is_synced_before_production_write \
            s2d_full_disk_before_publish_refuses_mutation \
            s2d_fsync_failure_refuses_mutation \
            s2d_partial_publish_failure_refuses_mutation \
            s2d_prepared_record_covers_crash_before_write \
            s2d_write_failure_compensates_and_cleans \
            s2d_readback_mismatch_compensates_and_cleans \
            s2d_stale_generation_is_rejected \
            s2d_path_reuse_identity_mismatch_is_rejected \
            s2d_repeated_compensation_is_idempotent \
            s2d_external_drift_relinquishes_without_overwrite \
            s2d_production_commit_then_verified_restore_compacts \
            s2d_production_daemon_run_uses_persistent_transaction_protocol
          do
            cargo test -p optid --bin optid \
              "reconciler::tests::$test_name" -- --exact
          done
          cargo test -p optid
          python3 tools/validate-current-work.py
          python3 tools/validate-optid-packages.py
          python3 tools/render-frontpage.py --check
          git diff --check

      - name: Finish-work gate
        run: bash tools/finish-work.sh --dry-run

      - name: Publish candidate branch
        run: |
          set -euo pipefail
          rm .github/workflows/s2d-builder-proof.yml .github/s2d-builder-chunk-*
          git add -A
          git config user.name "rush-s2d-builder"
          git config user.email "rush-s2d-builder@users.noreply.github.com"
          git commit -m "feat(optid): add persistent verified transactions"
          git push origin "HEAD:${{ github.event.pull_request.head.ref }}"
