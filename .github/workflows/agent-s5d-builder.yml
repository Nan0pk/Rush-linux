name: S5D circuit-breaker builder and verifier

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize]

permissions:
  contents: write
  actions: read

concurrency:
  group: s5d-builder-verifier-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  build:
    name: Build bounded S5D implementation
    if: >-
      github.event.pull_request.head.ref == 'work/20260804-s5d-circuit-breakers' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      BASE_COMMIT: ba7c56ba606bc65d33f90de76361964971df9064
      HEAD_REF: ${{ github.event.pull_request.head.ref }}
    outputs:
      source_head: ${{ steps.publish.outputs.source_head }}
      staging_head: ${{ steps.bind.outputs.staging_head }}

    steps:
      - name: Check out staging branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libdbus-1-dev pkg-config

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2

      - name: Bind immutable base and staging-only files
        id: bind
        run: |
          set -euo pipefail
          staging_head=$(git rev-parse HEAD)
          echo "staging_head=$staging_head" >> "$GITHUB_OUTPUT"
          git fetch origin main --force
          test "$(git rev-parse origin/main)" = "$BASE_COMMIT"
          git merge-base --is-ancestor "$BASE_COMMIT" "$staging_head"
          expected=$(mktemp)
          actual=$(mktemp)
          printf '%s\n' \
            '.github/workflows/agent-s5d-builder.yml' \
            'tools/agent-s5d-verify.py' \
            'tools/s5d-staging/architecture.part' \
            'tools/s5d-staging/corrections.py' \
            'tools/s5d-staging/workflow-00.part' \
            'tools/s5d-staging/workflow-01.part' \
            'tools/s5d-staging/workflow-02.part' \
            'tools/s5d-staging/workflow-03.part' \
            'tools/s5d-staging/patch-00.part' \
            'tools/s5d-staging/patch-01.part' \
            'tools/s5d-staging/patch-02.part' \
            'tools/s5d-staging/circuit-00.part' \
            'tools/s5d-staging/circuit-01.part' \
            'tools/s5d-staging/circuit-02.part' \
            'tools/s5d-staging/circuit-03.part' | sort > "$expected"
          git diff --name-only "$BASE_COMMIT"..HEAD | sort > "$actual"
          diff -u "$expected" "$actual"
          cat tools/s5d-staging/patch-00.part \
              tools/s5d-staging/patch-01.part \
              tools/s5d-staging/patch-02.part > /tmp/agent-s5d-patch.py
          python3 -m py_compile /tmp/agent-s5d-patch.py tools/agent-s5d-verify.py tools/s5d-staging/corrections.py
          bash tools/start-work.sh "S5D persistent domain circuit breakers"

      - name: Apply bounded implementation
        run: |
          python3 /tmp/agent-s5d-patch.py
          python3 tools/s5d-staging/corrections.py

      - name: Format, compile, lint, and execute S5D matrix
        run: |
          set -euo pipefail
          cargo fmt --all
          cargo fmt --all -- --check
          cargo check --workspace --all-targets --all-features
          cargo clippy --workspace --all-targets --all-features -- -D warnings

          python3 - <<'PY' > /tmp/s5d-tests.txt
          import re
          from pathlib import Path
          names = []
          for path in [
              Path('crates/optid/src/circuit_breaker.rs'),
              Path('crates/optid/src/args.rs'),
          ]:
              names.extend(re.findall(r'(?m)^\s*fn (s5d_[a-z0-9_]+)\(\)', path.read_text()))
          assert len(names) == 13, names
          assert len(set(names)) == 13, names
          print('\n'.join(sorted(names)))
          PY

          count=0
          while IFS= read -r short_name; do
            count=$((count + 1))
            listed=$(mktemp)
            cargo test -p optid --all-features --color never "$short_name" -- --list \
              2>&1 | tee "$listed"
            full_name=$(python3 - "$short_name" "$listed" <<'PY'
          import sys
          from pathlib import Path
          short = sys.argv[1]
          matches = []
          for line in Path(sys.argv[2]).read_text(errors='replace').splitlines():
              if line.endswith(': test'):
                  name = line[:-6]
                  if name == short or name.endswith('::' + short):
                      matches.append(name)
          if len(matches) != 1:
              raise SystemExit(f'{short}: expected one exact test, found {matches}')
          print(matches[0])
          PY
            )
            cargo test -p optid --all-features --color never "$full_name" -- \
              --exact --nocapture
          done < /tmp/s5d-tests.txt
          test "$count" -eq 13

          cargo test -p optid --all-features
          cargo test --workspace --all-features
          python3 tools/validate-current-work.py
          python3 tools/render-frontpage.py --check
          git diff --check

      - name: Publish immutable implementation source
        id: publish
        run: |
          set -euo pipefail
          rm -rf tools/s5d-staging
          rm tools/agent-s5d-verify.py .github/workflows/agent-s5d-builder.yml
          python3 - <<'PY'
          import os
          import subprocess
          expected = {
              'config/optid/policy.toml',
              'crates/optid/src/args.rs',
              'crates/optid/src/circuit_breaker.rs',
              'crates/optid/src/main.rs',
              'crates/optid/src/policy.rs',
              'crates/optid/src/reconciler/apply.rs',
              'docs/architecture/optid-s5d-circuit-breakers.md',
          }
          files = set(subprocess.check_output(
              ['git', 'diff', '--name-only', os.environ['BASE_COMMIT']],
              text=True,
          ).splitlines())
          assert files == expected, files
          PY
          git diff --check
          git config user.name rush-s5d-builder
          git config user.email rush-s5d-builder@users.noreply.github.com
          git add -A
          git commit -m 'feat(optid): add persistent domain circuit breakers'
          source_head=$(git rev-parse HEAD)
          echo "source_head=$source_head" >> "$GITHUB_OUTPUT"
          git push origin "HEAD:$HEAD_REF"

  verify:
    name: Independently verify shared surfaces and S5D candidate
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    env:
      BASE_COMMIT: ba7c56ba606bc65d33f90de76361964971df9064
      SOURCE_HEAD: ${{ needs.build.outputs.source_head }}
      STAGING_HEAD: ${{ needs.build.outputs.staging_head }}
      HEAD_REF: ${{ github.event.pull_request.head.ref }}
      PROOF_LOG: /tmp/s5d-candidate-verification.log
      ARTIFACT_NAME: s5d-candidate-verification-${{ github.run_id }}

    steps:
      - name: Check out immutable implementation source
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.build.outputs.source_head }}
          fetch-depth: 0

      - name: Recover verifier publisher from staging commit
        run: |
          set -euo pipefail
          git show "$STAGING_HEAD:tools/agent-s5d-verify.py" \
            > /tmp/agent-s5d-verify.py
          python3 -m py_compile /tmp/agent-s5d-verify.py

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libdbus-1-dev pkg-config

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2

      - name: Bind source and derive affected completed packages
        run: |
          set -euo pipefail
          exec > >(tee -a "$PROOF_LOG") 2>&1
          test "$(git rev-parse HEAD)" = "$SOURCE_HEAD"
          git fetch origin main --force
          test "$(git rev-parse origin/main)" = "$BASE_COMMIT"
          git merge-base --is-ancestor "$BASE_COMMIT" "$SOURCE_HEAD"
          python3 - <<'PY'
          import subprocess
          import tomllib
          from pathlib import Path

          base = 'ba7c56ba606bc65d33f90de76361964971df9064'
          source = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()
          changed = set(subprocess.check_output(
              ['git', 'diff', '--name-only', base, source], text=True
          ).splitlines())
          expected_files = {
              'config/optid/policy.toml',
              'crates/optid/src/args.rs',
              'crates/optid/src/circuit_breaker.rs',
              'crates/optid/src/main.rs',
              'crates/optid/src/policy.rs',
              'crates/optid/src/reconciler/apply.rs',
              'docs/architecture/optid-s5d-circuit-breakers.md',
          }
          assert changed == expected_files, changed
          ledger = tomllib.loads(Path('docs/plans/optid-package-status.toml').read_text())
          affected = []
          for package in ledger['package']:
              if package.get('status') != 'completed':
                  continue
              proof = set()
              for field in ('runtime_entrypoints', 'integration_tests', 'completion_evidence'):
                  proof.update(package.get(field, []))
              if proof & changed:
                  affected.append(package['id'])
          expected = ['F1', 'F2', 'F3', 'F4', 'S2D', 'S3D', 'S4D']
          assert affected == expected, affected
          Path('/tmp/s5d-affected-packages.txt').write_text('\n'.join(affected) + '\n')
          print('affected_completed_packages=' + ','.join(affected))
          PY
          python3 tools/validate-current-work.py
          python3 tools/validate-optid-packages.py
          python3 tools/render-frontpage.py --check
          git diff --check

      - name: Run every affected and S5D acceptance test
        run: |
          set -euo pipefail
          exec > >(tee -a "$PROOF_LOG") 2>&1
          cargo fmt --all -- --check
          cargo check --workspace --all-targets --all-features
          cargo clippy --workspace --all-targets --all-features -- -D warnings

          python3 - <<'PY' > /tmp/s5d-verifier-tests.tsv
          import re
          import tomllib
          from pathlib import Path
          ledger = tomllib.loads(Path('docs/plans/optid-package-status.toml').read_text())
          packages = {item['id']: item for item in ledger['package']}
          affected = Path('/tmp/s5d-affected-packages.txt').read_text().split()
          for package_id in affected:
              for test_name in packages[package_id].get('acceptance_tests', {}).values():
                  print(f'{package_id}\t{test_name}')
          names = []
          for path in [Path('crates/optid/src/circuit_breaker.rs'), Path('crates/optid/src/args.rs')]:
              names.extend(re.findall(r'(?m)^\s*fn (s5d_[a-z0-9_]+)\(\)', path.read_text()))
          assert len(names) == 13 and len(set(names)) == 13, names
          for name in sorted(names):
              print(f'S5D\t{name}')
          PY

          while IFS=$'\t' read -r package_id short_name; do
            echo "acceptance_package=$package_id test=$short_name"
            listed=$(mktemp)
            cargo test -p optid --all-features --color never "$short_name" -- --list \
              2>&1 | tee "$listed"
            full_name=$(python3 - "$short_name" "$listed" <<'PY'
          import sys
          from pathlib import Path
          short = sys.argv[1]
          matches = []
          for line in Path(sys.argv[2]).read_text(errors='replace').splitlines():
              if line.endswith(': test'):
                  name = line[:-6]
                  if name == short or name.endswith('::' + short):
                      matches.append(name)
          if len(matches) != 1:
              raise SystemExit(f'{short}: expected one exact mapped test, found {matches}')
          print(matches[0])
          PY
            )
            cargo test -p optid --all-features --color never "$full_name" -- \
              --exact --nocapture
          done < /tmp/s5d-verifier-tests.tsv

          cargo test -p optid --all-features
          cargo test --workspace --all-features
          echo "shared_surface_and_s5d_matrix=pass"

      - name: Run packaged recovery and live capability-supervisor proof
        run: |
          set -euo pipefail
          exec > >(tee -a "$PROOF_LOG") 2>&1

          cmp -s packaging/systemd/optid-apply.service \
            mkosi/mkosi.extra/usr/lib/systemd/system/optid-apply.service
          cmp -s packaging/systemd/optid-recover.service \
            mkosi/mkosi.extra/usr/lib/systemd/system/optid-recover.service
          cargo build -p optid --all-features --bins
          sudo install -D -m 0755 target/debug/optid /usr/libexec/optid
          sudo install -D -m 0755 target/debug/optid-recover /usr/libexec/optid-recover
          printf '.TH OPTID 8\n.SH NAME\noptid - Rush Linux optimization daemon\n' \
            | gzip -c | sudo tee /usr/share/man/man8/optid.8.gz >/dev/null
          sudo install -D -m 0644 packaging/systemd/optid-apply.service \
            /etc/systemd/system/optid-apply.service
          sudo install -D -m 0644 packaging/systemd/optid-recover.service \
            /etc/systemd/system/optid-recover.service
          systemd-analyze verify \
            /etc/systemd/system/optid-recover.service \
            /etc/systemd/system/optid-apply.service

          cargo test -p optid --features experimental-capability-sealing \
            --bin optid-capability-seal-test
          cargo test -p optid --features experimental-capability-sealing \
            --test capability_sealing_cli
          cargo build -p optid --features experimental-capability-sealing \
            --bin optid-capability-seal-test
          sudo install -D -m 0755 target/debug/optid-capability-seal-test \
            /usr/local/libexec/optid-capability-seal-test
          systemd-analyze verify packaging/systemd/optid-capability-seal-test.service

          KERNEL_RELEASE=$(uname -r)
          echo "KERNEL_RELEASE=$KERNEL_RELEASE" >> "$GITHUB_ENV"
          echo "kernel_release=$KERNEL_RELEASE"
          /usr/local/libexec/optid-capability-seal-test --probe
          python3 - <<'PY'
          import os
          import re
          from datetime import datetime, timezone
          from pathlib import Path
          text = Path(os.environ['PROOF_LOG']).read_text(errors='replace')
          matches = re.findall(r'(?i)(?:landlock[_ ]abi)[\s"=:]+([0-9]+)', text)
          if not matches:
              raise SystemExit('could not parse Landlock ABI')
          with open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8') as handle:
              handle.write(f'LANDLOCK_ABI={matches[-1]}\n')
              handle.write('VERIFIED_AT=' + datetime.now(timezone.utc).strftime('%Y-%m-%dT%H:%M:%SZ') + '\n')
          print(f'landlock_abi={matches[-1]}')
          PY

          sudo install -D -m 0644 packaging/systemd/optid-capability-seal-test.service \
            /etc/systemd/system/optid-capability-seal-test.service
          sudo touch /run/optid-capability-seal-test-enabled
          sudo rm -rf /run/optid-capability-seal-test
          sudo systemctl daemon-reload
          sudo systemctl reset-failed optid-capability-seal-test.service || true
          proof_started=$(date --iso-8601=seconds)
          sudo systemctl start optid-capability-seal-test.service
          for _ in $(seq 1 30); do
            active=$(systemctl show optid-capability-seal-test.service -p ActiveState --value)
            result=$(systemctl show optid-capability-seal-test.service -p Result --value)
            [[ "$active" == inactive && "$result" == success ]] && break
            [[ "$active" == failed ]] && break
            sleep 1
          done
          sudo journalctl --sync
          sudo journalctl -u optid-capability-seal-test.service \
            --since "$proof_started" --no-pager -o cat | tee /tmp/s5d-status75.log
          test "$(systemctl show optid-capability-seal-test.service -p Result --value)" = success
          test "$(systemctl show optid-capability-seal-test.service -p ExecMainStatus --value)" = 0
          test "$(grep -cF 'Scheduled restart job, restart counter is at 1.' /tmp/s5d-status75.log)" -eq 1
          test "$(grep -cF 'recovery step completed:' /tmp/s5d-status75.log)" -eq 2
          test "$(grep -cF 'capability-sealing proof passed (8 checks)' /tmp/s5d-status75.log)" -eq 2

          sudo mkdir -p /run/systemd/system/optid-capability-seal-test.service.d
          sudo tee /run/systemd/system/optid-capability-seal-test.service.d/non75.conf >/dev/null <<'EOF'
          [Service]
          ExecStart=
          ExecStart=/bin/sh -c 'exit 1'
          EOF
          sudo systemctl daemon-reload
          sudo systemctl reset-failed optid-capability-seal-test.service || true
          failed_started=$(date --iso-8601=seconds)
          set +e
          sudo systemctl start optid-capability-seal-test.service
          set -e
          sleep 3
          sudo journalctl --sync
          sudo journalctl -u optid-capability-seal-test.service \
            --since "$failed_started" --no-pager -o cat | tee /tmp/s5d-non75.log
          test "$(systemctl show optid-capability-seal-test.service -p ExecMainStatus --value)" = 1
          test "$(systemctl show optid-capability-seal-test.service -p NRestarts --value)" = 0
          ! grep -qF 'Scheduled restart job' /tmp/s5d-non75.log
          cat /tmp/s5d-status75.log /tmp/s5d-non75.log >> "$PROOF_LOG"
          echo "live_recovery_capability_supervisor_proof=pass"

      - name: Upload immutable candidate-verification evidence
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: ${{ env.PROOF_LOG }}
          if-no-files-found: error
          retention-days: 30

      - name: Resolve workflow and artifact provenance
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          job_id=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/jobs" \
            --jq '.jobs[] | select(.name == "Independently verify shared surfaces and S5D candidate") | .id')
          artifact=""
          for _ in $(seq 1 20); do
            artifact=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts" \
              --jq ".artifacts[] | select(.name == \"$ARTIFACT_NAME\")")
            [[ -n "$artifact" ]] && break
            sleep 2
          done
          test -n "$job_id"
          test -n "$artifact"
          test "$(jq -r '.expired' <<<"$artifact")" = false
          test "$(jq -r '.digest' <<<"$artifact")" != null
          echo "WORKFLOW_JOB=$job_id" >> "$GITHUB_ENV"
          echo "ARTIFACT_ID=$(jq -r '.id' <<<"$artifact")" >> "$GITHUB_ENV"
          echo "ARTIFACT_DIGEST=$(jq -r '.digest' <<<"$artifact")" >> "$GITHUB_ENV"
          echo "ARTIFACT_SIZE=$(jq -r '.size_in_bytes' <<<"$artifact")" >> "$GITHUB_ENV"
          echo "ARTIFACT_EXPIRES=$(jq -r '.expires_at' <<<"$artifact")" >> "$GITHUB_ENV"

      - name: Publish refreshed receipts and S5D candidate truth
        env:
          WORKFLOW_RUN: ${{ github.run_id }}
          WORKFLOW_ATTEMPT: ${{ github.run_attempt }}
        run: |
          set -euo pipefail
          python3 /tmp/agent-s5d-verify.py
          python3 tools/render-frontpage.py --write
          python3 tools/validate-current-work.py
          python3 tools/validate-optid-packages.py --base origin/main
          python3 tools/render-frontpage.py --check
          git diff --check
          bash tools/finish-work.sh --dry-run

          python3 - <<'PY'
          import os
          import subprocess
          files = set(subprocess.check_output(
              ['git', 'diff', '--name-only', os.environ['SOURCE_HEAD']], text=True
          ).splitlines())
          required = {
              'docs/plans/optid-package-status.toml',
              'docs/plans/optid-verification/f1.toml',
              'docs/plans/optid-verification/f2.toml',
              'docs/plans/optid-verification/f3.toml',
              'docs/plans/optid-verification/f4.toml',
              'docs/plans/optid-verification/s2d.toml',
              'docs/plans/optid-verification/s3d.toml',
              'docs/plans/optid-verification/s4d.toml',
          }
          allowed = required | {'README.md'}
          assert required <= files <= allowed, files
          PY

          git config user.name rush-s5d-independent-verifier
          git config user.email rush-s5d-independent-verifier@users.noreply.github.com
          git add -A
          git commit -m 'verify(optid): recertify shared surfaces and record S5D candidate'
          git push origin "HEAD:$HEAD_REF"
