name: Scheduled maintenance

on:
  schedule:
    - cron: '30 6 * * 1'
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  dependency-policy:
    name: New dependency advisories
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # AUDIT (FINAL-AUDIT-REPORT.md section 3.3, 2026-07-20):
      # The previous `command: check advisories` syntax was invalid (the
      # action's `command` input expects a single subcommand, not a
      # subcommand + subcommand-argument). Fixed to:
      #   command: check            # the cargo-deny subcommand
      #   command-arguments: advisories  # what to pass after the subcommand
      #   arguments: ""             # override the action's default
      #                             # `--all-features` (which would be passed
      #                             # BEFORE the subcommand and is not a
      #                             # valid top-level flag for `check`)
      #
      # Schema reference:
      # https://github.com/EmbarkStudios/cargo-deny-action/blob/v2/action.yml
      #
      # We pin to @v2 (major) rather than a SHA for now; SHA pinning is
      # tracked as a separate supply-chain hardening task across all
      # workflow actions.
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check
          arguments: ""
          command-arguments: advisories

  external-links:
    name: External documentation links
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --root-dir .
            --no-progress
            --accept 200,206,429
            --max-concurrency 4
            --max-retries 2
            --retry-wait-time 2
            --exclude '(^|/)localhost(:|/|$)'
            --exclude '127\.0\.0\.1'
            './**/*.md'
