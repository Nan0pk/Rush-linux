name: S3D systemd lifecycle proof v2

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize]

permissions:
  contents: write

concurrency:
  group: s3d-systemd-lifecycle-v2-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  prove:
    if: >-
      github.event.pull_request.head.ref == 'work/20260804-s3d-recovery-watchdog' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Install verification dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libdbus-1-dev pkg-config

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Verify corrected source and static unit contract
        run: |
          set -euo pipefail
          cargo fmt --all -- --check
          cargo check --workspace --all-targets --all-features
          cargo clippy --workspace --all-targets --all-features -- -D warnings
          cargo test -p optid --test s3d_systemd
          cargo test --workspace

      - name: Prove restart recovery and fail-closed recovery dependency
        run: |
          set -euo pipefail
          LOG="$RUNNER_TEMP/s3d-systemd-lifecycle.log"
          exec > >(tee -a "$LOG") 2>&1

          sudo install -D -m 0644 packaging/systemd/optid-recover.service \
            /etc/systemd/system/optid-recover.service
          sudo install -D -m 0644 packaging/systemd/optid-apply.service \
            /etc/systemd/system/optid-apply.service

          sudo install -d -m 0755 /usr/local/libexec
          cat > "$RUNNER_TEMP/s3d-proof-recover" <<'SH'
          #!/usr/bin/env bash
          set -euo pipefail
          install -d -m 0755 /var/lib/optid
          count=0
          [[ -f /var/lib/optid/proof-recover-count ]] && count=$(cat /var/lib/optid/proof-recover-count)
          count=$((count + 1))
          printf '%s\n' "$count" > /var/lib/optid/proof-recover-count
          if [[ -e /var/lib/optid/proof-force-recovery-failure ]]; then
            exit 78
          fi
          SH
          sudo install -m 0755 "$RUNNER_TEMP/s3d-proof-recover" \
            /usr/local/libexec/s3d-proof-recover

          cat > "$RUNNER_TEMP/s3d-proof-apply" <<'SH'
          #!/usr/bin/env bash
          set -euo pipefail
          install -d -m 0755 /var/lib/optid
          count=0
          [[ -f /var/lib/optid/proof-apply-count ]] && count=$(cat /var/lib/optid/proof-apply-count)
          count=$((count + 1))
          printf '%s\n' "$count" > /var/lib/optid/proof-apply-count
          if [[ "$count" -eq 1 ]]; then
            exit 1
          fi
          exec sleep 30
          SH
          sudo install -m 0755 "$RUNNER_TEMP/s3d-proof-apply" \
            /usr/local/libexec/s3d-proof-apply

          sudo install -d -m 0755 /etc/systemd/system/optid-recover.service.d
          sudo tee /etc/systemd/system/optid-recover.service.d/proof.conf >/dev/null <<'EOF'
          [Service]
          ExecStart=
          ExecStart=/usr/local/libexec/s3d-proof-recover
          EOF

          sudo install -d -m 0755 /etc/systemd/system/optid-apply.service.d
          sudo tee /etc/systemd/system/optid-apply.service.d/proof.conf >/dev/null <<'EOF'
          [Service]
          Type=simple
          NotifyAccess=
          WatchdogSec=0
          TimeoutStartSec=10s
          ExecStart=
          ExecStart=/usr/local/libexec/s3d-proof-apply
          RestartSec=1s
          EOF

          sudo systemctl daemon-reload
          sudo systemctl stop optid-apply.service optid-recover.service || true
          sudo rm -f /var/lib/optid/proof-apply-count \
            /var/lib/optid/proof-recover-count \
            /var/lib/optid/proof-force-recovery-failure
          sudo systemctl reset-failed optid-apply.service optid-recover.service || true

          # The first apply process fails. Its automatic restart must start a
          # fresh required recovery job before the second apply process.
          sudo systemctl start optid-apply.service || true
          for _ in $(seq 1 30); do
            apply_count=$(sudo cat /var/lib/optid/proof-apply-count 2>/dev/null || echo 0)
            recovery_count=$(sudo cat /var/lib/optid/proof-recover-count 2>/dev/null || echo 0)
            active=$(systemctl show optid-apply.service -p ActiveState --value)
            if [[ "$apply_count" -eq 2 && "$recovery_count" -eq 2 && "$active" == active ]]; then
              break
            fi
            sleep 1
          done
          test "$(sudo cat /var/lib/optid/proof-apply-count)" -eq 2
          test "$(sudo cat /var/lib/optid/proof-recover-count)" -eq 2
          test "$(systemctl show optid-apply.service -p ActiveState --value)" = active
          echo "restart_recovery_order=pass"
          sudo systemctl stop optid-apply.service

          # A failing required recovery job must prevent the apply process from
          # starting and must not enter the apply service's restart policy.
          sudo rm -f /var/lib/optid/proof-apply-count \
            /var/lib/optid/proof-recover-count
          sudo touch /var/lib/optid/proof-force-recovery-failure
          sudo systemctl reset-failed optid-apply.service optid-recover.service || true
          if sudo systemctl start optid-apply.service; then
            echo "apply unexpectedly started after failed recovery" >&2
            exit 1
          fi
          sleep 4
          test "$(sudo cat /var/lib/optid/proof-recover-count)" -eq 1
          test ! -e /var/lib/optid/proof-apply-count
          test "$(systemctl show optid-apply.service -p NRestarts --value)" -eq 0
          echo "failed_recovery_no_restart_loop=pass"

          systemctl show optid-apply.service \
            -p ActiveState -p SubState -p Result -p NRestarts
          systemctl show optid-recover.service \
            -p ActiveState -p SubState -p Result -p ExecMainStatus
          sudo journalctl -u optid-recover.service -u optid-apply.service \
            --no-pager -o short-monotonic

          echo "PROOF_LOG=$LOG" >> "$GITHUB_ENV"

      - name: Remove temporary proof workflow
        run: |
          set -euo pipefail
          git config user.name rush-s3d-systemd-verifier
          git config user.email rush-s3d-systemd-verifier@users.noreply.github.com
          git rm .github/workflows/s3d-systemd-lifecycle-proof-v2.yml
          git commit -m "test(systemd): prove S3D recovery dependency lifecycle"
          git push origin "HEAD:${{ github.event.pull_request.head.ref }}"

      - name: Upload supervised proof log
        uses: actions/upload-artifact@v4
        with:
          name: s3d-systemd-lifecycle-${{ github.run_id }}
          path: ${{ env.PROOF_LOG }}
          if-no-files-found: error
          retention-days: 30
