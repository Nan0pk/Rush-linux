name: Rushbench pair plan patch

on:
  push:
    branches:
      - work/20260906-rushbench-balanced-pair-plan

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply and verify patch
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/rushbench-pair-plan-patch.py
          rm .github/rushbench-pair-plan-patch.py
          rm .github/workflows/rushbench-pair-plan-patch.yml
          cargo fmt --all -- --check
          cargo test -p rushbench
          git diff --check
          unexpected="$(git diff --name-only | grep -Ev '^(crates/rushbench/src/main.rs|crates/rushbench/src/pair_plan.rs|crates/rushbench/tests/pair_plan_cli.rs|\.github/rushbench-pair-plan-patch.py|\.github/workflows/rushbench-pair-plan-patch.yml)$' || true)"
          if [[ -n "$unexpected" ]]; then
            echo "Unexpected changed files:"
            echo "$unexpected"
            exit 1
          fi
          git config user.name "Rush coordinating agent"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "bench: add balanced matched-pair planner"
          git push origin HEAD:work/20260906-rushbench-balanced-pair-plan
