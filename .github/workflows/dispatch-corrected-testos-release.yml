name: Dispatch corrected testOS release

on:
  push:
    branches:
      - ops/dispatch-testos-provenance-20260729
    paths:
      - .github/workflows/dispatch-corrected-testos-release.yml

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    name: Dispatch release-testos.yml
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch corrected provenance-bound image release
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error \
            --request POST \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${REPOSITORY}/actions/workflows/release-testos.yml/dispatches" \
            --data '{"ref":"main","inputs":{"mock":"false","tag":"v0.7.0-beta.4-provenance.1"}}'
          echo "Dispatched release-testos.yml for v0.7.0-beta.4-provenance.1"
