name: F3 outcome hardening builder

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  harden-test-commit:
    if: github.head_ref == 'fix/f3-versioned-runtime-outcomes'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - name: Install Rust system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libdbus-1-dev pkg-config
      - name: Apply verified outcome-hardening and lint patches
        run: |
          echo '2772915750828e98f6c76ba3a16ca1e331438221b99692534df46a8e372114dd  tools/f3-hardening.patch.gz.b64' | sha256sum --check
          base64 --decode tools/f3-hardening.patch.gz.b64 | gzip --decompress > /tmp/f3-hardening.patch
          echo 'c05ba8fc29995d15fac68295a66d6fa28c305596f5085fc6db78ba26d6a17a40  /tmp/f3-hardening.patch' | sha256sum --check
          git apply --check /tmp/f3-hardening.patch
          git apply /tmp/f3-hardening.patch
          cargo fmt --all
          echo 'faaa460ef54527917fb5366eaed60ff6ea358e1915bb366d423f07bf78f25e7c  tools/f3-lint-fixes.patch.gz.b64' | sha256sum --check
          base64 --decode tools/f3-lint-fixes.patch.gz.b64 | gzip --decompress > /tmp/f3-lint-fixes.patch
          echo '7de3a243922039c19b97b73e36b1d3a3a910eda67a91b3f865295ad03f473d4d  /tmp/f3-lint-fixes.patch' | sha256sum --check
          git apply --check /tmp/f3-lint-fixes.patch
          git apply /tmp/f3-lint-fixes.patch
          echo '7058805126ab904a595eaecc72cfd060d71547d90f6f025eca31bda92faf0c1d  tools/f3-import-fix.patch.gz.b64' | sha256sum --check
          base64 --decode tools/f3-import-fix.patch.gz.b64 | gzip --decompress > /tmp/f3-import-fix.patch
          echo 'f10a98decbac888a449d1ccf7c182872948657312784191f9efd76b56d890e1d  /tmp/f3-import-fix.patch' | sha256sum --check
          git apply --check /tmp/f3-import-fix.patch
          git apply /tmp/f3-import-fix.patch
          cargo fmt --all
          git diff --check
      - name: Run exact F3 outcome acceptance tests
        run: |
          cargo test -p optid f3_outcome_matrix::f3_gate_matrix_distinguishes_dry_run_observe_off_and_boot_disarm -- --exact
          cargo test -p optid f3_outcome_matrix::f3_actuator_matrix_reports_missing_unsupported_contract_and_allowlist_denials -- --exact
          cargo test -p optid f3_outcome_matrix::f3_actuator_matrix_reports_success_failure_readback_drift_and_redundancy -- --exact
          cargo test -p optid f3_outcome_matrix::f3_restore_matrix_reports_actual_success_failure_malformed_and_not_applicable -- --exact
          cargo test -p optid f3_outcome_matrix::f3_observation_matrix_distinguishes_malformed_and_permission_denied_reads -- --exact
          cargo test -p optid f3_production_surface::f3_production_daemon_run_writes_one_correlated_versioned_cycle -- --exact
      - name: Run crate suites and lint changed production targets
        run: |
          cargo test -p optid
          cargo test -p optctl
          cargo clippy -p optid -p optctl --all-targets -- -D warnings
      - name: Preserve formatted patch on failure
        if: failure()
        run: git diff --binary > /tmp/f3-hardening-failed.patch
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: f3-hardening-failed-${{ github.sha }}
          path: /tmp/f3-hardening-failed.patch
          retention-days: 1
      - name: Remove staging-only files and commit
        run: |
          rm -f tools/f3-hardening.patch.gz.b64
          rm -f tools/f3-lint-fixes.patch.gz.b64
          rm -f tools/f3-import-fix.patch.gz.b64
          rm -f .github/workflows/f3-source-export.yml
          rm -f .github/workflows/f3-hardening-builder.yml
          git config user.name 'rush-f3-builder'
          git config user.email 'rush-f3-builder@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'test(optid): harden truthful F3 outcome reporting'
          git push origin HEAD:${{ github.head_ref }}
