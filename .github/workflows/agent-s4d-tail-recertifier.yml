name: S4D final F2 and D0 recertification

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize]

permissions:
  contents: write
  actions: read

concurrency:
  group: s4d-tail-recertifier-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  verify:
    name: Recertify F2 and D0 after policy cleanup
    if: >-
      github.event.pull_request.head.ref == 'work/20260804-s4d-sealed-capability-table' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      SOURCE_HEAD: 05d8f741a811fd36393cdfa1628565ab64e4136c
      PROOF_LOG: s4d-final-f2-d0-recertification.log
      ARTIFACT_NAME: s4d-final-f2-d0-recertification-${{ github.run_id }}

    steps:
      - name: Check out verifier branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libdbus-1-dev pkg-config

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2

      - name: Bind source and assert exact stale set
        run: |
          set -euo pipefail
          exec > >(tee -a "$PROOF_LOG") 2>&1
          VERIFIER_HEAD=$(git rev-parse HEAD)
          echo "VERIFIER_HEAD=$VERIFIER_HEAD" >> "$GITHUB_ENV"
          git merge-base --is-ancestor "$SOURCE_HEAD" "$VERIFIER_HEAD"

          expected=$(mktemp)
          actual=$(mktemp)
          printf '%s\n' \
            '.github/workflows/agent-s4d-tail-recertifier.yml' \
            'tools/agent-s4d-tail-recertify.py' | sort > "$expected"
          git diff --name-only "$SOURCE_HEAD".."$VERIFIER_HEAD" | sort > "$actual"
          diff -u "$expected" "$actual"

          python3 tools/validate-current-work.py
          set +e
          python3 tools/validate-optid-packages.py > /tmp/pre-tail-validator.log 2>&1
          status=$?
          set -e
          cat /tmp/pre-tail-validator.log
          test "$status" -ne 0
          python3 - <<'PY'
          import re
          from pathlib import Path
          text = Path('/tmp/pre-tail-validator.log').read_text(encoding='utf-8')
          stale = re.findall(
              r'(?m)^\s*(?:-\s*)?([A-Z][A-Z0-9]*): verification receipt is stale',
              text,
          )
          assert sorted(stale) == ['D0', 'F2'], (stale, text)
          assert text.count('verification receipt is stale') == 2, text
          print('exact_stale_set=' + ','.join(stale))
          PY
          python3 tools/render-frontpage.py --check
          git diff --check
          echo "source_binding_and_prestate=pass"

      - name: Compile, lint, and run mapped acceptance tests
        run: |
          set -euo pipefail
          exec > >(tee -a "$PROOF_LOG") 2>&1
          cargo fmt --all -- --check
          cargo check -p optid --all-targets --all-features
          cargo clippy -p optid --all-targets --all-features -- -D warnings

          python3 - <<'PY' > /tmp/f2-d0-acceptance.tsv
          import tomllib
          from pathlib import Path
          ledger = tomllib.loads(Path('docs/plans/optid-package-status.toml').read_text())
          packages = {item['id']: item for item in ledger['package']}
          for package_id in ('F2', 'D0'):
              for test_name in packages[package_id].get('acceptance_tests', {}).values():
                  print(f'{package_id}\t{test_name}')
          PY

          while IFS=$'\t' read -r package_id test_name; do
            echo "acceptance_package=$package_id test=$test_name"
            listed=$(mktemp)
            cargo test -p optid --all-features --color never "$test_name" -- --list \
              2>&1 | tee "$listed"
            grep -F "$test_name: test" "$listed"
            cargo test -p optid --all-features --color never "$test_name" -- --nocapture
          done < /tmp/f2-d0-acceptance.tsv

          cargo test -p optid
          cargo test --workspace --all-features
          echo "F2_D0_acceptance_and_regression=pass"

      - name: Run live D0 mechanism and supervisor proof
        run: |
          set -euo pipefail
          exec > >(tee -a "$PROOF_LOG") 2>&1
          cargo test -p optid --features experimental-capability-sealing \
            --bin optid-capability-seal-test
          cargo test -p optid --features experimental-capability-sealing \
            --test capability_sealing_cli
          cargo build -p optid --features experimental-capability-sealing \
            --bin optid-capability-seal-test
          sudo install -D -m 0755 target/debug/optid-capability-seal-test \
            /usr/local/libexec/optid-capability-seal-test

          KERNEL_RELEASE=$(uname -r)
          echo "KERNEL_RELEASE=$KERNEL_RELEASE" >> "$GITHUB_ENV"
          echo "kernel_release=$KERNEL_RELEASE"
          /usr/local/libexec/optid-capability-seal-test --probe
          python3 - <<'PY'
          import os
          import re
          from pathlib import Path
          text = Path(os.environ['PROOF_LOG']).read_text(encoding='utf-8')
          matches = re.findall(r'(?i)(?:landlock[_ ]abi)[\s"=:]+([0-9]+)', text)
          if not matches:
              raise SystemExit('could not parse Landlock ABI')
          with open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8') as handle:
              handle.write(f'LANDLOCK_ABI={matches[-1]}\n')
              handle.write('VERIFIED_AT=' + __import__('datetime').datetime.now(__import__('datetime').timezone.utc).strftime('%Y-%m-%dT%H:%M:%SZ') + '\n')
          print(f'landlock_abi={matches[-1]}')
          PY

          sudo install -D -m 0644 packaging/systemd/optid-capability-seal-test.service \
            /etc/systemd/system/optid-capability-seal-test.service
          sudo touch /run/optid-capability-seal-test-enabled
          sudo rm -rf /run/optid-capability-seal-test
          sudo systemctl daemon-reload
          sudo systemctl reset-failed optid-capability-seal-test.service || true
          started=$(date --iso-8601=seconds)
          sudo systemctl start optid-capability-seal-test.service
          for _ in $(seq 1 30); do
            active=$(systemctl show optid-capability-seal-test.service -p ActiveState --value)
            result=$(systemctl show optid-capability-seal-test.service -p Result --value)
            [[ "$active" == inactive && "$result" == success ]] && break
            [[ "$active" == failed ]] && break
            sleep 1
          done
          sudo journalctl --sync
          sudo journalctl -u optid-capability-seal-test.service \
            --since "$started" --no-pager -o cat | tee /tmp/tail-status75.log
          test "$(systemctl show optid-capability-seal-test.service -p Result --value)" = success
          test "$(systemctl show optid-capability-seal-test.service -p ExecMainStatus --value)" = 0
          test "$(grep -cF 'Scheduled restart job, restart counter is at 1.' /tmp/tail-status75.log)" -eq 1
          test "$(grep -cF 'capability-sealing proof passed (8 checks)' /tmp/tail-status75.log)" -eq 2

          sudo mkdir -p /run/systemd/system/optid-capability-seal-test.service.d
          sudo tee /run/systemd/system/optid-capability-seal-test.service.d/non75.conf >/dev/null <<'EOF'
          [Service]
          ExecStart=
          ExecStart=/bin/sh -c 'exit 1'
          EOF
          sudo systemctl daemon-reload
          sudo systemctl reset-failed optid-capability-seal-test.service || true
          failed_started=$(date --iso-8601=seconds)
          set +e
          sudo systemctl start optid-capability-seal-test.service
          set -e
          sleep 3
          sudo journalctl --sync
          sudo journalctl -u optid-capability-seal-test.service \
            --since "$failed_started" --no-pager -o cat | tee /tmp/tail-non75.log
          test "$(systemctl show optid-capability-seal-test.service -p ExecMainStatus --value)" = 1
          test "$(systemctl show optid-capability-seal-test.service -p NRestarts --value)" = 0
          ! grep -qF 'Scheduled restart job' /tmp/tail-non75.log

          cat /tmp/tail-status75.log >> "$PROOF_LOG"
          cat /tmp/tail-non75.log >> "$PROOF_LOG"
          echo "D0_live_supervisor_proof=pass"

      - name: Upload immutable recertification evidence
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: ${{ env.PROOF_LOG }}
          if-no-files-found: error
          retention-days: 30

      - name: Resolve artifact provenance
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          job_id=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/jobs" \
            --jq '.jobs[] | select(.name == "Recertify F2 and D0 after policy cleanup") | .id')
          artifact=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts" \
            --jq ".artifacts[] | select(.name == \"$ARTIFACT_NAME\")")
          test -n "$job_id"
          test -n "$artifact"
          echo "WORKFLOW_JOB=$job_id" >> "$GITHUB_ENV"
          echo "ARTIFACT_ID=$(jq -r '.id' <<<"$artifact")" >> "$GITHUB_ENV"
          echo "ARTIFACT_DIGEST=$(jq -r '.digest' <<<"$artifact")" >> "$GITHUB_ENV"
          echo "ARTIFACT_SIZE=$(jq -r '.size_in_bytes' <<<"$artifact")" >> "$GITHUB_ENV"
          echo "ARTIFACT_EXPIRES=$(jq -r '.expires_at' <<<"$artifact")" >> "$GITHUB_ENV"

      - name: Publish two refreshed receipts
        env:
          WORKFLOW_RUN: ${{ github.run_id }}
          WORKFLOW_ATTEMPT: ${{ github.run_attempt }}
        run: |
          set -euo pipefail
          python3 tools/agent-s4d-tail-recertify.py
          python3 tools/validate-current-work.py
          python3 tools/validate-optid-packages.py
          python3 tools/render-frontpage.py --check
          git diff --check

          rm tools/agent-s4d-tail-recertify.py \
            .github/workflows/agent-s4d-tail-recertifier.yml
          python3 - <<'PY'
          import os
          import subprocess
          files = set(subprocess.check_output(
              ['git', 'diff', '--name-only', os.environ['SOURCE_HEAD']],
              text=True,
          ).splitlines())
          expected = {
              'docs/plans/optid-verification/f2.toml',
              'docs/plans/optid-verification/d0.toml',
          }
          assert files == expected, files
          PY

          git config user.name rush-s4d-tail-verifier
          git config user.email rush-s4d-tail-verifier@users.noreply.github.com
          git add -A
          git commit -m 'verify(optid): refresh F2 and D0 after S4D cleanup'
          git push origin "HEAD:${{ github.event.pull_request.head.ref }}"
