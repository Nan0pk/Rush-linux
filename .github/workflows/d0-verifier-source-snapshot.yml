name: D0 verifier source snapshot

on:
  push:
    branches:
      - verify/20260802-d0-cold-restart

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
      - uses: actions/upload-artifact@v7
        with:
          name: d0-verifier-source-snapshot
          path: |
            docs/plans/optid-package-status.toml
            docs/plans/current-work.md
            README.md
          if-no-files-found: error
