name: Graphify knowledge graph

on:
  push:
    branches: [main]
    paths-ignore:
      - 'graphify-out/**'
  workflow_dispatch:
    inputs:
      mode:
        description: Refresh mode. `code` is AST/local and does not use LLM tokens; `full` may use backend secrets.
        required: true
        type: choice
        default: code
        options:
          - code
          - full
      backend:
        description: Backend for full mode. Leave as auto to let Graphify detect configured secrets.
        required: true
        type: choice
        default: auto
        options:
          - auto
          - gemini
          - claude
          - openai
          - kimi
          - deepseek
          - bedrock
          - ollama
          - claude-cli
      no_viz:
        description: Skip graph.html generation.
        required: true
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: graphify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  refresh:
    name: Refresh graph on dedicated branch
    runs-on: ubuntu-latest
    if: github.actor != 'github-actions[bot]' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Graphify
        run: python -m pip install --upgrade pip graphifyy

      - name: Refresh graph
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          MOONSHOT_API_KEY: ${{ secrets.MOONSHOT_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          AWS_REGION: ${{ secrets.AWS_REGION }}
        shell: bash
        run: |
          mode="code"
          backend="auto"
          no_viz="false"
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            mode="${{ github.event.inputs.mode }}"
            backend="${{ github.event.inputs.backend }}"
            no_viz="${{ github.event.inputs.no_viz }}"
          fi
          args=()
          if [[ "$mode" == "full" && "$backend" != "auto" ]]; then
            args+=(--backend "$backend")
          fi
          if [[ "$no_viz" == "true" ]]; then
            args+=(--no-viz)
          fi
          ./tools/graphify-refresh.sh "$mode" "${args[@]}"

      - name: Push to graphify-data branch
        shell: bash
        run: |
          # Check if there are changes
          if git diff --quiet -- graphify-out; then
            echo "Graphify output already current."
            exit 0
          fi
          
          # Configure git
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          
          # Create or checkout graphify-data branch
          git fetch origin graphify-data:graphify-data 2>/dev/null || git checkout --orphan graphify-data
          git checkout graphify-data
          
          # Copy graphify-out from main working tree
          git checkout main -- graphify-out/
          
          # Add and commit
          git add graphify-out
          git commit -m "chore: refresh graphify knowledge graph [skip ci]
          
          Source commit: ${{ github.sha }}
          Triggered by: ${{ github.actor }}
          Mode: ${{ github.event.inputs.mode || 'code' }}" || echo "No changes to commit"
          
          # Push
          git push origin graphify-data --force

      - name: Update pointer on main
        shell: bash
        run: |
          git checkout main
          mkdir -p graphify-out
          cat > graphify-out/REF << EOF
          # Graphify data lives on dedicated branch to keep main history clean
          branch: graphify-data
          last_update: $(date -u +%Y-%m-%dT%H:%M:%SZ)
          source_commit: ${{ github.sha }}
          
          To fetch:
            git fetch origin graphify-data:graphify-data
            git checkout graphify-data -- graphify-out/
          
          Or browse: https://github.com/${{ github.repository }}/tree/graphify-data/graphify-out
          EOF
          
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add graphify-out/REF
          git commit -m 'chore: update graphify pointer [skip ci]' || echo "No pointer changes"
          git push origin main
