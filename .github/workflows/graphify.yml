name: Graphify knowledge graph

on:
  push:
    branches: [main]
    paths-ignore:
      - 'graphify-out/**'
  workflow_dispatch:
    inputs:
      mode:
        description: Refresh mode. `code` is AST/local and does not use LLM tokens; `full` may use backend secrets.
        required: true
        type: choice
        default: code
        options:
          - code
          - full
      backend:
        description: Backend for full mode. Leave as auto to let Graphify detect configured secrets.
        required: true
        type: choice
        default: auto
        options:
          - auto
          - gemini
          - claude
          - openai
          - kimi
          - deepseek
          - bedrock
          - ollama
          - claude-cli
      no_viz:
        description: Skip graph.html generation.
        required: true
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: graphify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  refresh:
    name: Refresh graph on dedicated branch
    runs-on: ubuntu-latest
    if: github.actor != 'github-actions[bot]' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Graphify
        run: python -m pip install --upgrade pip graphifyy

      - name: Refresh graph
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          MOONSHOT_API_KEY: ${{ secrets.MOONSHOT_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          AWS_REGION: ${{ secrets.AWS_REGION }}
        shell: bash
        run: |
          mode="code"
          backend="auto"
          no_viz="false"
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            mode="${{ github.event.inputs.mode }}"
            backend="${{ github.event.inputs.backend }}"
            no_viz="${{ github.event.inputs.no_viz }}"
          fi
          args=()
          if [[ "$mode" == "full" && "$backend" != "auto" ]]; then
            args+=(--backend "$backend")
          fi
          if [[ "$no_viz" == "true" ]]; then
            args+=(--no-viz)
          fi
          ./tools/graphify-refresh.sh "$mode" "${args[@]}"

      - name: Push to graphify-data branch
        shell: bash
        run: |
          if [ ! -d graphify-out ] || [ -z "$(ls -A graphify-out)" ]; then
            echo "No graphify output generated."; exit 0
          fi
          TMP=$(mktemp -d) && cp -r graphify-out/. "$TMP/"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git checkout --orphan graphify-data-new
          git rm -rf . >/dev/null 2>&1 || true
          git clean -fdx >/dev/null 2>&1
          mkdir graphify-out && cp -r "$TMP/." graphify-out/
          git add graphify-out
          git commit -m "chore: graphify snapshot (source: ${GITHUB_SHA})"
          git push origin +graphify-data-new:graphify-data
