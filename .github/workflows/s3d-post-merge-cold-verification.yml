name: S3D post-merge cold verification

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize]

permissions:
  contents: read

concurrency:
  group: s3d-post-merge-cold-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  verify-systemd:
    name: Cold-prove merged S3D service lifecycle
    if: >-
      github.event.pull_request.head.ref == 'verify/20260804-s3d-recovery-watchdog' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      INTEGRATED_COMMIT: ce6ef8bc0df13c1fcf70529b23471cbb38a28789
      PROOF_LOG: s3d-post-merge-systemd-verification.log

    steps:
      - name: Check out exact merged source
        uses: actions/checkout@v7
        with:
          ref: ce6ef8bc0df13c1fcf70529b23471cbb38a28789
          fetch-depth: 0

      - name: Bind static contract to merged units
        run: |
          set -euo pipefail
          exec > >(tee -a "$PROOF_LOG") 2>&1
          test "$(git rev-parse HEAD)" = "$INTEGRATED_COMMIT"
          cargo test -p optid --test s3d_systemd
          cmp packaging/systemd/optid-apply.service \
            mkosi/mkosi.extra/usr/lib/systemd/system/optid-apply.service
          cmp packaging/systemd/optid-recover.service \
            mkosi/mkosi.extra/usr/lib/systemd/system/optid-recover.service
          echo "merged_unit_binding=pass"

      - name: Cold-prove actual unit dependency and restart semantics
        run: |
          set -euo pipefail
          exec > >(tee -a "$PROOF_LOG") 2>&1

          sudo install -D -m 0644 packaging/systemd/optid-apply.service \
            /etc/systemd/system/optid-apply.service
          sudo install -D -m 0644 packaging/systemd/optid-recover.service \
            /etc/systemd/system/optid-recover.service
          sudo install -d -m 0755 /usr/local/libexec

          cat > "$RUNNER_TEMP/s3d-cold-recover" <<'SH'
          #!/usr/bin/env bash
          set -euo pipefail
          root=/var/lib/optid/s3d-cold-proof
          count=0
          if [[ -f "$root/recover-count" ]]; then
            IFS= read -r count < "$root/recover-count"
          fi
          count=$((count + 1))
          printf '%s\n' "$count" > "$root/recover-count"
          printf 'recover-%s\n' "$count" >> "$root/order.log"
          [[ ! -e "$root/force-recovery-failure" ]] || exit 78
          SH
          sudo install -m 0755 "$RUNNER_TEMP/s3d-cold-recover" \
            /usr/local/libexec/s3d-cold-recover

          cat > "$RUNNER_TEMP/s3d-cold-apply" <<'SH'
          #!/usr/bin/env bash
          set -euo pipefail
          root=/var/lib/optid/s3d-cold-proof
          count=0
          if [[ -f "$root/apply-count" ]]; then
            IFS= read -r count < "$root/apply-count"
          fi
          count=$((count + 1))
          printf '%s\n' "$count" > "$root/apply-count"
          printf 'apply-%s\n' "$count" >> "$root/order.log"
          [[ "$count" -ne 1 ]] || exit 1
          exec /usr/bin/sleep 30
          SH
          sudo install -m 0755 "$RUNNER_TEMP/s3d-cold-apply" \
            /usr/local/libexec/s3d-cold-apply

          sudo install -d -m 0755 \
            /etc/systemd/system/optid-apply.service.d \
            /etc/systemd/system/optid-recover.service.d

          # Preserve the shipped [Unit] graph and restart policy. Replace only
          # the executable, notify/watchdog mode, and hardware mount sandbox
          # that cannot exist on a hosted VM.
          sudo tee /etc/systemd/system/optid-apply.service.d/verification.conf >/dev/null <<'EOF'
          [Service]
          Type=simple
          ExecStart=
          ExecStart=/usr/local/libexec/s3d-cold-apply
          WatchdogSec=0
          TimeoutStartSec=10s
          RestartSec=1s
          ReadWritePaths=
          ReadWritePaths=/var/lib/optid /run/optid
          ProtectKernelTunables=no
          ProcSubset=all
          ProtectProc=default
          SystemCallFilter=
          EOF

          sudo tee /etc/systemd/system/optid-recover.service.d/verification.conf >/dev/null <<'EOF'
          [Service]
          ExecStart=
          ExecStart=/usr/local/libexec/s3d-cold-recover
          ReadWritePaths=
          ReadWritePaths=/var/lib/optid /run/optid
          ProtectKernelTunables=no
          ProcSubset=all
          ProtectProc=default
          SystemCallFilter=
          EOF

          sudo systemctl daemon-reload
          sudo systemctl cat optid-apply.service optid-recover.service
          systemctl show optid-apply.service \
            -p Requires -p After -p Restart -p RestartUSec -p Type \
            -p ReadWritePaths -p ExecStart
          systemctl show optid-recover.service \
            -p Before -p PartOf -p Restart -p Type \
            -p ReadWritePaths -p ExecStart

          test "$(systemctl show optid-apply.service -p Restart --value)" = on-failure
          test "$(systemctl show optid-recover.service -p Restart --value)" = no
          systemctl show optid-apply.service -p Requires --value \
            | tr ' ' '\n' | grep -Fx optid-recover.service
          systemctl show optid-recover.service -p PartOf --value \
            | tr ' ' '\n' | grep -Fx optid-apply.service

          sudo systemctl stop optid-apply.service optid-recover.service || true
          sudo rm -rf /var/lib/optid/s3d-cold-proof
          sudo install -d -m 0755 /var/lib/optid/s3d-cold-proof
          sudo systemctl reset-failed optid-apply.service optid-recover.service || true

          restart_started=$(date --iso-8601=seconds)
          set +e
          sudo systemctl start optid-apply.service
          initial_status=$?
          set -e
          echo "initial_start_status=$initial_status"

          for _ in $(seq 1 20); do
            apply_count=$(cat /var/lib/optid/s3d-cold-proof/apply-count 2>/dev/null || echo 0)
            recover_count=$(cat /var/lib/optid/s3d-cold-proof/recover-count 2>/dev/null || echo 0)
            active=$(systemctl show optid-apply.service -p ActiveState --value)
            if [[ "$apply_count" -eq 2 && "$recover_count" -eq 2 && "$active" == active ]]; then
              break
            fi
            sleep 1
          done

          if [[ ! -f /var/lib/optid/s3d-cold-proof/apply-count ]] ||
             [[ ! -f /var/lib/optid/s3d-cold-proof/recover-count ]]; then
            sudo systemctl status optid-apply.service optid-recover.service --no-pager || true
            sudo journalctl -u optid-recover.service -u optid-apply.service \
              --since "$restart_started" --no-pager -o short-monotonic || true
            exit 1
          fi

          test "$(cat /var/lib/optid/s3d-cold-proof/apply-count)" -eq 2
          test "$(cat /var/lib/optid/s3d-cold-proof/recover-count)" -eq 2
          test "$(systemctl show optid-apply.service -p ActiveState --value)" = active
          diff -u <(printf 'recover-1\napply-1\nrecover-2\napply-2\n') \
            /var/lib/optid/s3d-cold-proof/order.log
          sudo journalctl --sync
          sudo journalctl -u optid-recover.service -u optid-apply.service \
            --since "$restart_started" --no-pager -o short-monotonic \
            | tee /tmp/s3d-cold-restart.log
          test "$(grep -cF 'Scheduled restart job, restart counter is at 1.' \
            /tmp/s3d-cold-restart.log)" -eq 1
          echo "cold_restart_recovery_order=pass"

          sudo systemctl stop optid-apply.service
          sudo rm -rf /var/lib/optid/s3d-cold-proof
          sudo install -d -m 0755 /var/lib/optid/s3d-cold-proof
          sudo touch /var/lib/optid/s3d-cold-proof/force-recovery-failure
          sudo systemctl reset-failed optid-apply.service optid-recover.service || true
          failure_started=$(date --iso-8601=seconds)

          set +e
          sudo systemctl start optid-apply.service
          failure_status=$?
          set -e
          sleep 4
          sudo journalctl --sync

          test "$failure_status" -ne 0
          test "$(cat /var/lib/optid/s3d-cold-proof/recover-count)" -eq 1
          test ! -e /var/lib/optid/s3d-cold-proof/apply-count
          test "$(systemctl show optid-apply.service -p NRestarts --value)" -eq 0
          test "$(systemctl show optid-apply.service -p ActiveState --value)" = inactive
          sudo journalctl -u optid-recover.service -u optid-apply.service \
            --since "$failure_started" --no-pager -o short-monotonic \
            | tee /tmp/s3d-cold-failure.log
          ! grep -qF 'Scheduled restart job' /tmp/s3d-cold-failure.log

          systemctl show optid-apply.service \
            -p ActiveState -p SubState -p Result -p NRestarts
          systemctl show optid-recover.service \
            -p ActiveState -p SubState -p Result -p ExecMainStatus
          echo "failed_recovery_blocks_daemon=pass"
          echo "failed_recovery_restart_loop=absent"

      - name: Upload focused cold-verification log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: s3d-post-merge-systemd-verification-${{ github.run_id }}
          path: s3d-post-merge-systemd-verification.log
          if-no-files-found: error
          retention-days: 30
