name: F3 exact source export

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  export:
    if: github.head_ref == 'fix/f3-versioned-runtime-outcomes'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: actions/upload-artifact@v4
        with:
          name: f3-head-source-${{ github.sha }}
          path: .
          include-hidden-files: true
          retention-days: 1
