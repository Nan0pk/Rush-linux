name: F3 implementation builder

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  apply-format-check:
    if: github.head_ref == 'fix/f3-versioned-runtime-outcomes'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - name: Install Rust system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libdbus-1-dev pkg-config
      - name: Reconstruct and verify reviewed implementation patch
        run: |
          cat tools/f3-patch.part-* > /tmp/f3.patch.gz.b64
          echo '8b55d01f72c48696f842aed4850d4d07183776d807eebe165085fd0fbd609e71  /tmp/f3.patch.gz.b64' | sha256sum --check
          base64 --decode /tmp/f3.patch.gz.b64 | gzip --decompress > /tmp/f3.patch
          echo 'ea93f92ba1644993429301f0ceb2a656b970c4135268b7c2c19da04ddcea15be  /tmp/f3.patch' | sha256sum --check
          git apply --check /tmp/f3.patch
          git apply /tmp/f3.patch
      - name: Format Rust sources
        run: cargo fmt --all
      - name: Preserve formatted working tree
        run: git diff --binary > /tmp/f3-formatted-working.patch
      - uses: actions/upload-artifact@v4
        with:
          name: f3-formatted-working-tree-${{ github.sha }}
          path: /tmp/f3-formatted-working.patch
          retention-days: 1
      - name: Check optid production and test targets
        run: cargo check -p optid --all-targets
      - name: Check optctl production and test targets
        run: cargo check -p optctl --all-targets
      - name: Run focused schema tests
        run: cargo test -p optid envelope::tests
      - name: Remove staging-only builder files
        run: |
          rm -f tools/f3-implementation.patch.gz.b64
          rm -f tools/f3-patch.part-*
          rm -f .github/workflows/f3-builder-bootstrap.yml
      - name: Commit checked implementation
        run: |
          git config user.name 'rush-f3-builder'
          git config user.email 'rush-f3-builder@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'fix(optid): activate versioned runtime outcomes'
          git push origin HEAD:${{ github.head_ref }}
