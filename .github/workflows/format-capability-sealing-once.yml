name: Format capability sealing candidate once

on:
  push:
    branches:
      - fix/capability-sealing-cold-restart-proof
    paths:
      - .github/workflows/format-capability-sealing-once.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/capability-sealing-cold-restart-proof
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@stable

      - name: Apply canonical formatting and generated documentation
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --all
          python3 tools/render-frontpage.py --write
          rm .github/workflows/format-capability-sealing-once.yml

      - name: Commit mechanical repairs
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "rush-format-bot"
          git config user.email "rush-format-bot@users.noreply.github.com"
          git add README.md crates/optid/src/bin/optid-capability-seal-test.rs crates/optid/tests/capability_sealing_cli.rs .github/workflows/format-capability-sealing-once.yml
          git commit -m "style(optid): format capability sealing proof"
          git push origin HEAD:fix/capability-sealing-cold-restart-proof
