name: Change checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: change-checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Relevant tests and safety rules
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Classify the change
        id: change
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PUSH_BASE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            BASE="$PR_BASE"
          elif [[ -n "$PUSH_BASE" && ! "$PUSH_BASE" =~ ^0+$ ]]; then
            BASE="$PUSH_BASE"
          else
            BASE="HEAD^"
          fi
          git diff --name-only "$BASE"...HEAD > /tmp/rush-changed-files
          echo "base=$BASE" >> "$GITHUB_OUTPUT"
          if grep -Eq '^(Cargo\.(toml|lock)|crates/|rust-toolchain)' /tmp/rush-changed-files; then echo 'rust=true' >> "$GITHUB_OUTPUT"; else echo 'rust=false' >> "$GITHUB_OUTPUT"; fi
          if grep -Eq '^(tools/.*\.py|tools/test-|testos/|schemas/|release/evidence/livedev-)' /tmp/rush-changed-files; then echo 'python=true' >> "$GITHUB_OUTPUT"; else echo 'python=false' >> "$GITHUB_OUTPUT"; fi
          if grep -Eq '\.ps1$' /tmp/rush-changed-files; then echo 'powershell=true' >> "$GITHUB_OUTPUT"; else echo 'powershell=false' >> "$GITHUB_OUTPUT"; fi
          if grep -Eq '^Cargo\.(toml|lock)$' /tmp/rush-changed-files; then echo 'deps=true' >> "$GITHUB_OUTPUT"; else echo 'deps=false' >> "$GITHUB_OUTPUT"; fi
          echo 'Changed files:'
          cat /tmp/rush-changed-files

      - name: Install Rust system dependencies
        if: steps.change.outputs.rust == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y libdbus-1-dev pkg-config

      - name: Set up Rust
        if: steps.change.outputs.rust == 'true'
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache Rust
        if: steps.change.outputs.rust == 'true'
        uses: Swatinem/rust-cache@v2

      - name: Set up Python
        if: steps.change.outputs.python == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python test dependency
        if: steps.change.outputs.python == 'true'
        run: python -m pip install pytest

      - name: Run relevant checks
        run: bash tools/checks.sh --ci --changed-base "${{ steps.change.outputs.base }}"

      - name: Check dependency policy
        if: steps.change.outputs.deps == 'true'
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check
