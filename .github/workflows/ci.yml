name: PR Gate

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: pr-gate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  classify:
    name: Select relevant lanes
    runs-on: ubuntu-latest
    outputs:
      base: ${{ steps.change.outputs.base }}
      rust: ${{ steps.change.outputs.rust }}
      python: ${{ steps.change.outputs.python }}
      shell: ${{ steps.change.outputs.shell }}
      windows: ${{ steps.change.outputs.windows }}
      workflow: ${{ steps.change.outputs.workflow }}
      image: ${{ steps.change.outputs.image }}
      dependencies: ${{ steps.change.outputs.dependencies }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Classify changed paths
        id: change
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PUSH_BASE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            BASE="$PR_BASE"
          elif [[ -n "$PUSH_BASE" && ! "$PUSH_BASE" =~ ^0+$ ]]; then
            BASE="$PUSH_BASE"
          else
            BASE="HEAD^"
          fi
          echo "base=$BASE" >> "$GITHUB_OUTPUT"
          git diff --name-only "$BASE"...HEAD | tee /tmp/rush-changed-files

          classify() {
            local name="$1" pattern="$2"
            if grep -Eq "$pattern" /tmp/rush-changed-files; then
              echo "$name=true" >> "$GITHUB_OUTPUT"
            else
              echo "$name=false" >> "$GITHUB_OUTPUT"
            fi
          }

          # A change to this workflow exercises every lane once. Otherwise the
          # code that selects a supposedly "required" lane could merge without
          # ever running that lane.
          classify rust '^\.github/workflows/ci\.yml$|^(Cargo\.(toml|lock)|crates/|rust-toolchain)'
          classify python '^\.github/workflows/ci\.yml$|(^|/).*\.py$|^pyproject\.toml$|^schemas/'
          classify shell '^\.github/workflows/ci\.yml$|\.sh$|^tools/|^testos/'
          classify windows '^\.github/workflows/ci\.yml$|\.ps1$|^tools/(livedev-|rush[_-]livedev|rush-submit|rush_pr)|^testos/'
          classify workflow '^\.github/workflows/.*\.ya?ml$'
          classify image '^\.github/workflows/ci\.yml$|^(mkosi/|testos/build-testos\.sh|tools/build-mkosi-image\.sh|packaging/|distro/|config/)'
          classify dependencies '^\.github/workflows/ci\.yml$|^Cargo\.(toml|lock)$'

  linux:
    name: Linux and repository checks
    needs: classify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python checks
        if: needs.classify.outputs.python == 'true'
        run: python -m pip install pytest ruff

      - name: Install shellcheck
        if: needs.classify.outputs.shell == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck

      - name: Set up Go for actionlint
        if: needs.classify.outputs.workflow == 'true'
        uses: actions/setup-go@v5
        with:
          go-version: stable

      - name: Install actionlint
        if: needs.classify.outputs.workflow == 'true'
        run: |
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.7
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Install Rust system dependencies
        if: needs.classify.outputs.rust == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y libdbus-1-dev pkg-config

      - name: Set up Rust
        if: needs.classify.outputs.rust == 'true'
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache Rust
        if: needs.classify.outputs.rust == 'true'
        uses: Swatinem/rust-cache@v2

      - name: Run the canonical change-aware checks
        env:
          # On pull_request events, honor the `docs-not-needed` PR label.
          # On push events (post-merge to main), there is no PR label
          # context, so the docs-impact gate would re-fail on workflow-
          # only dependabot bumps that already passed with the label on
          # the PR. Treat push-to-main as docs-not-needed because the
          # PR already passed the gate; the push run is a re-check, not
          # a new gate.
          RUSH_DOCS_NOT_NEEDED: ${{ github.event_name == 'push' || contains(github.event.pull_request.labels.*.name, 'docs-not-needed') }}
        run: bash tools/checks.sh --ci --changed-base "${{ needs.classify.outputs.base }}"

      - name: Check Rust dependency policy
        if: needs.classify.outputs.dependencies == 'true'
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check

  windows:
    name: Native Windows
    needs: classify
    if: needs.classify.outputs.windows == 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependency
        run: python -m pip install pytest
      - name: Parse changed PowerShell
        shell: pwsh
        env:
          BASE: ${{ needs.classify.outputs.base }}
        run: |
          $files = git diff --name-only "$env:BASE...HEAD" |
            Where-Object { $_ -match '\.ps1$' }
          foreach ($file in $files) {
            $tokens = $null
            $errors = $null
            $path = (Resolve-Path -LiteralPath $file).Path
            [void][System.Management.Automation.Language.Parser]::ParseFile(
              $path, [ref]$tokens, [ref]$errors
            )
            if ($errors.Count) {
              $errors | ForEach-Object { Write-Error $_ }
              exit 1
            }
          }
      - name: Run native LiveDev parity tests
        run: python -m pytest tools/test-windows-livedev-parity.py -q

  image:
    name: Product image
    needs: classify
    if: needs.classify.outputs.image == 'true'
    runs-on: ubuntu-latest
    container:
      image: archlinux:latest
      options: --privileged
    steps:
      - name: Install image-build dependencies
        run: |
          pacman -Syu --noconfirm
          pacman -S --noconfirm --needed \
            archlinux-keyring base-devel rust mkosi git dbus pkgconf \
            systemd systemd-ukify python python-pytest python-pefile \
            dosfstools mtools zstd util-linux
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Trust the container-mounted checkout
        # The provenance tests intentionally replace HOME, so this trust entry
        # must outlive per-user Git config inside the root-owned container.
        run: git config --system --add safe.directory "$GITHUB_WORKSPACE"
      - name: Initialize Arch package trust
        run: |
          pacman-key --init
          pacman-key --populate archlinux
      - name: Validate image and boot contracts
        run: |
          bash -n tools/build-mkosi-image.sh
          bash -n testos/build-testos.sh
          python -m pytest -q \
            tools/test-livedev-image.py \
            tools/test-testos-boot-behavioral.py \
            tools/test-testos-production-provenance.py
      - name: Build the affected product image
        env:
          BASE: ${{ needs.classify.outputs.base }}
        run: |
          set -euo pipefail
          git diff --name-only "$BASE"...HEAD > /tmp/rush-image-paths
          if grep -Eq '^(testos/|mkosi/mkosi\.profiles/testos/)' /tmp/rush-image-paths; then
            bash testos/build-testos.sh
          else
            bash tools/build-mkosi-image.sh --edition livedev
          fi
          if ! find build -maxdepth 1 -type f -name '*.raw' -size +64M -print -quit | grep -q .; then
            echo "No real product image was produced." >&2
            exit 1
          fi

  gate:
    name: PR Gate
    needs: [classify, linux, windows, image]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require every selected lane
        env:
          CLASSIFY: ${{ needs.classify.result }}
          LINUX: ${{ needs.linux.result }}
          WINDOWS: ${{ needs.windows.result }}
          IMAGE: ${{ needs.image.result }}
        run: |
          set -euo pipefail
          [[ "$CLASSIFY" == "success" ]]
          [[ "$LINUX" == "success" ]]
          [[ "$WINDOWS" == "success" || "$WINDOWS" == "skipped" ]]
          [[ "$IMAGE" == "success" || "$IMAGE" == "skipped" ]]
          echo "All selected PR lanes passed."

  # Temporary zero-work aliases for the status names protected on main before
  # this consolidated gate existed. They depend on the real aggregator and can
  # be deleted after branch protection requires only "PR Gate / PR Gate".
  legacy-rust:
    name: Rust
    needs: gate
    if: always()
    runs-on: ubuntu-latest
    steps:
      - run: test "${{ needs.gate.result }}" = success

  legacy-docs:
    name: Documentation sync
    needs: gate
    if: always()
    runs-on: ubuntu-latest
    steps:
      - run: test "${{ needs.gate.result }}" = success

  legacy-policy:
    name: Repository policy
    needs: gate
    if: always()
    runs-on: ubuntu-latest
    steps:
      - run: test "${{ needs.gate.result }}" = success

  legacy-evidence:
    name: Evidence integrity (Dragnet)
    needs: gate
    if: always()
    runs-on: ubuntu-latest
    steps:
      - run: test "${{ needs.gate.result }}" = success
