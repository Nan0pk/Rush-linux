name: PR Gate

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: pr-gate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  classify:
    name: Select relevant lanes
    runs-on: ubuntu-latest
    outputs:
      base: ${{ steps.change.outputs.base }}
      rust: ${{ steps.change.outputs.rust }}
      python: ${{ steps.change.outputs.python }}
      shell: ${{ steps.change.outputs.shell }}
      powershell: ${{ steps.change.outputs.powershell }}
      windows: ${{ steps.change.outputs.windows }}
      workflow: ${{ steps.change.outputs.workflow }}
      image: ${{ steps.change.outputs.image }}
      dependencies: ${{ steps.change.outputs.dependencies }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Classify changed paths
        id: change
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PUSH_BASE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            BASE="$PR_BASE"
          elif [[ -n "$PUSH_BASE" && ! "$PUSH_BASE" =~ ^0+$ ]]; then
            BASE="$PUSH_BASE"
          else
            BASE="HEAD^"
          fi
          echo "base=$BASE" >> "$GITHUB_OUTPUT"
          git diff --name-only "$BASE"...HEAD | tee /tmp/rush-changed-files

          classify() {
            local name="$1" pattern="$2"
            if grep -Eq "$pattern" /tmp/rush-changed-files; then
              echo "$name=true" >> "$GITHUB_OUTPUT"
            else
              echo "$name=false" >> "$GITHUB_OUTPUT"
            fi
          }

          # A change to this workflow exercises every lane once. Otherwise the
          # code that selects a supposedly "required" lane could merge without
          # ever running that lane.
          classify rust '^\.github/workflows/ci\.yml$|^(Cargo\.(toml|lock)|crates/|rust-toolchain)'
          classify python '^\.github/workflows/ci\.yml$|(^|/).*\.py$|^pyproject\.toml$|^schemas/'
          classify shell '^\.github/workflows/ci\.yml$|\.sh$|^tools/|^testos/'
          classify powershell '^\.github/workflows/ci\.yml$|\.ps1$'
          classify windows '^\.github/workflows/ci\.yml$|\.ps1$|^tools/(livedev-|rush[_-]livedev|rush-submit|rush_pr)|^testos/'
          classify workflow '^\.github/workflows/.*\.ya?ml$'
          classify image '^\.github/workflows/ci\.yml$|^(mkosi/|testos/build-testos\.sh|tools/(build-mkosi-image\.sh|build-all-editions\.sh|build-edition-image\.sh|build-edition-set\.py|build-edition-sysext\.py|_edition_sysext_impl\.py|compose-edition-image\.py|deploy-edition-sysext\.py)|packaging/|distro/|config/)'
          classify dependencies '^\.github/workflows/ci\.yml$|^Cargo\.(toml|lock)$'

  linux:
    name: Linux and repository checks
    needs: classify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install Python checks
        if: needs.classify.outputs.python == 'true'
        run: python -m pip install pytest ruff

      - name: Install shellcheck
        if: needs.classify.outputs.shell == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck

      - name: Set up Go for actionlint
        if: needs.classify.outputs.workflow == 'true'
        uses: actions/setup-go@v7
        with:
          go-version: stable

      - name: Install actionlint
        if: needs.classify.outputs.workflow == 'true'
        run: |
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.7
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Install Rust system dependencies
        if: needs.classify.outputs.rust == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y libdbus-1-dev pkg-config

      - name: Set up Rust
        if: needs.classify.outputs.rust == 'true'
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache Rust
        if: needs.classify.outputs.rust == 'true'
        uses: Swatinem/rust-cache@v2

      - name: "Repository integrity — checks.sh --section integrity"
        id: integrity
        if: always()
        run: bash tools/checks.sh --ci --section integrity --changed-base "${{ needs.classify.outputs.base }}"

      - name: "Documentation truth — checks.sh --section docs"
        id: docs
        if: always()
        env:
          RUSH_DOCS_NOT_NEEDED: ${{ github.event_name == 'push' || contains(github.event.pull_request.labels.*.name, 'docs-not-needed') }}
        run: bash tools/checks.sh --ci --section docs --changed-base "${{ needs.classify.outputs.base }}"

      - name: "optid package contract — checks.sh --section optid"
        id: optid
        if: always()
        run: bash tools/checks.sh --ci --section optid --changed-base "${{ needs.classify.outputs.base }}"

      - name: "Evidence integrity — checks.sh --section evidence"
        id: evidence
        if: always()
        run: bash tools/checks.sh --ci --section evidence --changed-base "${{ needs.classify.outputs.base }}"

      - name: "Repository policy — checks.sh --section policy"
        id: policy
        if: always()
        run: bash tools/checks.sh --ci --section policy --changed-base "${{ needs.classify.outputs.base }}"

      - name: "Workflow syntax — checks.sh --section workflow"
        id: workflow
        if: always() && needs.classify.outputs.workflow == 'true'
        run: bash tools/checks.sh --ci --section workflow --changed-base "${{ needs.classify.outputs.base }}"

      - name: "Shell entry points — checks.sh --section shell"
        id: shell
        if: always() && needs.classify.outputs.shell == 'true'
        run: bash tools/checks.sh --ci --section shell --changed-base "${{ needs.classify.outputs.base }}"

      - name: "PowerShell parsing — checks.sh --section powershell"
        id: powershell
        if: always() && needs.classify.outputs.powershell == 'true'
        run: bash tools/checks.sh --ci --section powershell --changed-base "${{ needs.classify.outputs.base }}"

      - name: "Python and tooling — checks.sh --section python"
        id: python
        if: always() && needs.classify.outputs.python == 'true'
        run: bash tools/checks.sh --ci --section python --changed-base "${{ needs.classify.outputs.base }}"

      - name: "Rust workspace — checks.sh --section rust"
        id: rust
        if: always() && needs.classify.outputs.rust == 'true'
        run: bash tools/checks.sh --ci --section rust --changed-base "${{ needs.classify.outputs.base }}"

      - name: CI outcome index — failed named steps above are root causes
        if: always()
        env:
          BASE: ${{ needs.classify.outputs.base }}
          INTEGRITY: ${{ steps.integrity.outcome }}
          DOCS: ${{ steps.docs.outcome }}
          OPTID: ${{ steps.optid.outcome }}
          EVIDENCE: ${{ steps.evidence.outcome }}
          POLICY: ${{ steps.policy.outcome }}
          WORKFLOW: ${{ steps.workflow.outcome }}
          SHELL: ${{ steps.shell.outcome }}
          POWERSHELL: ${{ steps.powershell.outcome }}
          PYTHON: ${{ steps.python.outcome }}
          RUST: ${{ steps.rust.outcome }}
        run: |
          set -u
          report() {
            local label="$1" outcome="$2" section="$3"
            printf '%-24s %s\n' "$label" "$outcome"
            if [[ "$outcome" == "failure" ]]; then
              echo "::error title=Rush CI section failed::$label; reproduce: bash tools/checks.sh --ci --section $section --changed-base $BASE"
            fi
          }
          {
            echo "## Rush CI outcome index"
            echo
            echo 'The failed named step is the root cause; PR Gate and legacy aliases are aggregators.'
            echo
            echo '```text'
            report "Repository integrity" "$INTEGRITY" integrity
            report "Documentation truth" "$DOCS" docs
            report "optid package contract" "$OPTID" optid
            report "Evidence integrity" "$EVIDENCE" evidence
            report "Repository policy" "$POLICY" policy
            report "Workflow syntax" "$WORKFLOW" workflow
            report "Shell entry points" "$SHELL" shell
            report "PowerShell parsing" "$POWERSHELL" powershell
            report "Python and tooling" "$PYTHON" python
            report "Rust workspace" "$RUST" rust
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"

  dependencies:
    name: Rust dependency policy
    needs: classify
    if: needs.classify.outputs.dependencies == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Cargo dependency policy — cargo deny check
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check

  windows:
    name: Native Windows
    needs: classify
    if: needs.classify.outputs.windows == 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install test dependency
        run: python -m pip install pytest
      - name: Parse changed PowerShell
        shell: pwsh
        env:
          BASE: ${{ needs.classify.outputs.base }}
        run: |
          $files = git diff --name-only "$env:BASE...HEAD" |
            Where-Object { $_ -match '\.ps1$' }
          foreach ($file in $files) {
            $tokens = $null
            $errors = $null
            $path = (Resolve-Path -LiteralPath $file).Path
            [void][System.Management.Automation.Language.Parser]::ParseFile(
              $path, [ref]$tokens, [ref]$errors
            )
            if ($errors.Count) {
              $errors | ForEach-Object { Write-Error $_ }
              exit 1
            }
          }
      - name: Run native LiveDev parity tests
        run: python -m pytest tools/test-windows-livedev-parity.py -q

  image:
    name: Product image
    needs: classify
    if: needs.classify.outputs.image == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Select product-image proof
        id: image_scope
        env:
          BASE: ${{ needs.classify.outputs.base }}
        run: |
          set -euo pipefail
          git diff --name-only "$BASE"...HEAD | tee /tmp/rush-image-paths
          echo "edition=false" >> "$GITHUB_OUTPUT"
          echo "testos=false" >> "$GITHUB_OUTPUT"
          if grep -Eq '^(tools/(build-all-editions\.sh|build-edition-image\.sh|build-edition-set\.py|build-edition-sysext\.py|_edition_sysext_impl\.py|compose-edition-image\.py|deploy-edition-sysext\.py)|mkosi/mkosi\.profiles/(desktop|laptop|realtime-audio|server)/|distro/editions/(desktop|laptop|realtime-audio|server)\.toml)' /tmp/rush-image-paths; then
            echo "edition=true" >> "$GITHUB_OUTPUT"
          fi
          if grep -Eq '^(testos/|mkosi/mkosi\.profiles/testos/)' /tmp/rush-image-paths; then
            echo "testos=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Build reusable Arch image environment
        run: |
          set -euo pipefail
          cat > /tmp/rush-image-ci.Dockerfile <<'EOF'
          FROM archlinux:latest
          RUN pacman -Syu --noconfirm && pacman -S --noconfirm --needed \
              archlinux-keyring base-devel rust mkosi git dbus pkgconf \
              systemd systemd-ukify python python-pytest python-pefile \
              dosfstools erofs-utils mtools zstd util-linux \
              && pacman-key --init \
              && pacman-key --populate archlinux
          EOF
          docker build -t rush-image-ci -f /tmp/rush-image-ci.Dockerfile /tmp

      - name: Validate image contracts in Arch
        run: |
          set -euo pipefail
          docker run --rm --privileged \
            -v "$GITHUB_WORKSPACE:/workspace" -w /workspace rush-image-ci \
            bash -lc '
              set -euo pipefail
              git config --system --add safe.directory /workspace
              bash -n tools/build-mkosi-image.sh
              bash -n tools/build-edition-image.sh
              bash -n tools/build-all-editions.sh
              bash -n tools/validate-uefi-boot.sh
              bash -n testos/build-testos.sh
              python -m pytest -q \
                tools/test-livedev-image.py \
                tools/test-testos-boot-behavioral.py \
                tools/test-testos-production-provenance.py
            '

      - name: Build testOS in Arch
        if: steps.image_scope.outputs.testos == 'true'
        run: |
          set -euo pipefail
          docker run --rm --privileged \
            -v "$GITHUB_WORKSPACE:/workspace" -w /workspace rush-image-ci \
            bash -lc 'set -euo pipefail; git config --system --add safe.directory /workspace; bash testos/build-testos.sh'

      - name: Build bootable common base in Arch
        if: steps.image_scope.outputs.edition == 'true'
        run: |
          set -euo pipefail
          docker run --rm --privileged \
            -v "$GITHUB_WORKSPACE:/workspace" -w /workspace rush-image-ci \
            bash -lc 'set -euo pipefail; git config --system --add safe.directory /workspace; bash tools/build-mkosi-image.sh --edition server'
          test -s build/rush-linux.raw

      - name: Build directory common base in Arch
        if: steps.image_scope.outputs.edition == 'true'
        run: |
          set -euo pipefail
          docker run --rm --privileged \
            -v "$GITHUB_WORKSPACE:/workspace" -w /workspace rush-image-ci \
            bash -lc '
              set -euo pipefail
              git config --system --add safe.directory /workspace
              cd mkosi
              mkosi build --force \
                --format=directory \
                --bootable=no \
                --output-directory=../build \
                --output=rush-linux-base-tree
            '
          test -d build/rush-linux-base-tree

      - name: Build desktop sysext in Arch
        if: steps.image_scope.outputs.edition == 'true'
        run: |
          set -euo pipefail
          docker run --rm --privileged \
            -v "$GITHUB_WORKSPACE:/workspace" -w /workspace rush-image-ci \
            bash -lc '
              set -euo pipefail
              git config --system --add safe.directory /workspace
              python tools/build-edition-sysext.py build \
                --edition desktop \
                --workspace build/edition-desktop \
                --base-tree build/rush-linux-base-tree \
                --mkosi mkosi \
                --force \
                --unsigned-development
            '
          test -s build/edition-desktop/output/rush-linux-desktop.raw
          test -s build/edition-desktop/output/rush-linux-desktop.build.json

      - name: Build fallback LiveDev image in Arch
        if: steps.image_scope.outputs.edition != 'true' && steps.image_scope.outputs.testos != 'true'
        run: |
          set -euo pipefail
          docker run --rm --privileged \
            -v "$GITHUB_WORKSPACE:/workspace" -w /workspace rush-image-ci \
            bash -lc 'set -euo pipefail; git config --system --add safe.directory /workspace; bash tools/build-mkosi-image.sh --edition livedev'

      - name: Install host image and boot dependencies
        if: steps.image_scope.outputs.edition == 'true'
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y qemu-system-x86 ovmf dosfstools
          if ! command -v systemd-dissect >/dev/null 2>&1; then
            sudo apt-get install -y systemd-container
          fi
          sudo modprobe loop
          test -c /dev/loop-control
          losetup -f >/dev/null
          command -v systemd-dissect
          command -v qemu-system-x86_64

      - name: Compose desktop edition and boot-prove on host
        if: steps.image_scope.outputs.edition == 'true'
        run: |
          set -euo pipefail
          BASE_IMAGE="$GITHUB_WORKSPACE/build/rush-linux.raw"
          FINAL_IMAGE="$GITHUB_WORKSPACE/build/rush-linux-desktop.raw"
          PLAN="$GITHUB_WORKSPACE/build/edition-desktop/edition-plan.json"
          RECEIPT="$GITHUB_WORKSPACE/build/edition-desktop/output/rush-linux-desktop.build.json"
          EXTENSION="$GITHUB_WORKSPACE/build/edition-desktop/output/rush-linux-desktop.raw"

          test -s "$BASE_IMAGE"
          test -s "$PLAN"
          test -s "$RECEIPT"
          test -s "$EXTENSION"

          if ! COPY_ERROR="$(cp --reflink=auto --sparse=always "$BASE_IMAGE" "$FINAL_IMAGE" 2>&1)"; then
            COPY_ERROR="$(printf "%s" "$COPY_ERROR" | tr "\n" " " | tail -c 1200)"
            echo "::error title=Desktop compose copy failed::$COPY_ERROR"
            exit 70
          fi

          MOUNT_DIR="$(mktemp -d)"
          MOUNTED=false
          cleanup() {
            if [[ "$MOUNTED" == true ]]; then
              sudo systemd-dissect --umount "$MOUNT_DIR" || true
            fi
            rmdir "$MOUNT_DIR" 2>/dev/null || true
          }
          trap cleanup EXIT

          if ! MOUNT_ERROR="$(sudo env SYSTEMD_LOG_LEVEL=debug systemd-dissect --mount "$FINAL_IMAGE" "$MOUNT_DIR" 2>&1)"; then
            MOUNT_ERROR="$(printf "%s" "$MOUNT_ERROR" | tr "\n" " " | tail -c 2400)"
            echo "::error title=Desktop compose mount failed::$MOUNT_ERROR"
            exit 71
          fi
          MOUNTED=true

          ARTIFACT_BYTES="$(stat -c %s "$EXTENSION")"
          AVAILABLE_BYTES="$(df -B1 --output=avail "$MOUNT_DIR" | tail -n 1 | tr -d "[:space:]")"
          echo "::notice title=Desktop compose capacity::artifact_bytes=$ARTIFACT_BYTES available_bytes=$AVAILABLE_BYTES"
          if (( AVAILABLE_BYTES < ARTIFACT_BYTES + 67108864 )); then
            echo "::error title=Desktop compose capacity failed::artifact_bytes=$ARTIFACT_BYTES available_bytes=$AVAILABLE_BYTES reserve_bytes=67108864"
            exit 72
          fi

          if ! DEPLOY_ERROR="$(sudo env PYTHONDONTWRITEBYTECODE=1 python3 tools/deploy-edition-sysext.py install \
            --plan "$PLAN" \
            --receipt "$RECEIPT" \
            --artifact "$EXTENSION" \
            --root "$MOUNT_DIR" \
            --allow-unsigned-development 2>&1)"; then
            DEPLOY_ERROR="$(printf "%s" "$DEPLOY_ERROR" | tr "\n" " " | tail -c 1200)"
            echo "::error title=Desktop sysext deploy failed::$DEPLOY_ERROR"
            exit 73
          fi

          sudo test -s "$MOUNT_DIR/var/lib/extensions/rush-linux-desktop.raw"
          sudo test -s "$MOUNT_DIR/var/lib/rush-linux/editions/rush-linux-desktop.json"
          sudo test -L "$MOUNT_DIR/etc/systemd/system/sysinit.target.wants/systemd-sysext.service"
          sudo systemd-dissect --umount "$MOUNT_DIR"
          MOUNTED=false
          rmdir "$MOUNT_DIR"
          trap - EXIT

          test -s "$FINAL_IMAGE"
          RUSH_BOOT_TIMEOUT=180 bash tools/validate-uefi-boot.sh "$FINAL_IMAGE"

      - name: Confirm a real product image exists
        run: |
          if ! find build -maxdepth 1 -type f -name '*.raw' -size +64M -print -quit | grep -q .; then
            echo "No real product image was produced." >&2
            exit 1
          fi

  gate:
    name: PR Gate
    needs: [classify, linux, dependencies, windows, image]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Report failed CI lanes explicitly
        env:
          CLASSIFY: ${{ needs.classify.result }}
          LINUX: ${{ needs.linux.result }}
          DEPENDENCIES: ${{ needs.dependencies.result }}
          WINDOWS: ${{ needs.windows.result }}
          IMAGE: ${{ needs.image.result }}
        run: |
          set -u
          failed=0
          require() {
            local lane="$1" result="$2"
            if [[ "$result" != "success" ]]; then
              echo "::error title=Required CI lane failed::$lane: $result"
              failed=1
            fi
          }
          optional() {
            local lane="$1" result="$2"
            if [[ "$result" != "success" && "$result" != "skipped" ]]; then
              echo "::error title=Selected CI lane failed::$lane: $result"
              failed=1
            fi
          }
          require "Select relevant lanes" "$CLASSIFY"
          require "Linux and repository checks" "$LINUX"
          optional "Rust dependency policy" "$DEPENDENCIES"
          optional "Native Windows" "$WINDOWS"
          optional "Product image" "$IMAGE"
          if (( failed != 0 )); then
            echo "Inspect the failed named lane and step above; this PR Gate is only the aggregator."
            exit 1
          fi
          echo "All selected PR lanes passed."

  legacy-rust:
    name: Rust
    needs: gate
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Compatibility alias only — inspect PR Gate and its failed named lane
        run: test "${{ needs.gate.result }}" = success

  legacy-docs:
    name: Documentation sync
    needs: gate
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Compatibility alias only — inspect PR Gate and its failed named lane
        run: test "${{ needs.gate.result }}" = success

  legacy-policy:
    name: Repository policy
    needs: gate
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Compatibility alias only — inspect PR Gate and its failed named lane
        run: test "${{ needs.gate.result }}" = success

  legacy-evidence:
    name: Evidence integrity (Dragnet)
    needs: gate
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Compatibility alias only — inspect PR Gate and its failed named lane
        run: test "${{ needs.gate.result }}" = success
