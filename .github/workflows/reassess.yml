name: Strategic Reassessment

# Recurring, low-token "zoom-out / drift check" ritual.
#   TIMED:        every Monday 06:00 UTC.
#   CHANGE-BASED: every push to main, but only fires once >= N commits have
#                 landed since the last reassessment (counter file below).
#   MANUAL:       workflow_dispatch.
# When it fires it opens (or comments on) a "Strategic Reassessment" issue from
# .github/ISSUE_TEMPLATE/reassessment.md, pre-filled with API-collected metrics.
# Judgment (COMPASS.md update + dated snapshot) is left to a human/agent.

on:
  schedule:
    - cron: "0 6 * * 1" # Mondays 06:00 UTC
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: write # update the merge counter
  issues: write # open/comment the reassessment issue

env:
  REASSESS_EVERY_N_MERGES: "10"
  LABEL: "strategic-reassessment"
  COUNTER_FILE: ".github/reassess-counter.txt"

jobs:
  reassess:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # need history for rev-list

      - name: Decide whether to fire
        id: decide
        run: |
          set -euo pipefail
          last="$(cat "$COUNTER_FILE" 2>/dev/null || echo "")"
          if [ -n "$last" ] && git cat-file -e "${last}^{commit}" 2>/dev/null; then
            n="$(git rev-list --count "${last}..HEAD" || echo 0)"
          else
            n=0
          fi
          fire=false
          case "${{ github.event_name }}" in
            schedule|workflow_dispatch) fire=true ;;
            push) [ "$n" -ge "${REASSESS_EVERY_N_MERGES}" ] && fire=true ;;
          esac
          echo "commits_since=$n" >> "$GITHUB_OUTPUT"
          echo "fire=$fire" >> "$GITHUB_OUTPUT"
          echo "Event=${{ github.event_name }} commits_since=$n fire=$fire"

      - name: Collect metrics
        if: steps.decide.outputs.fire == 'true'
        id: metrics
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          repo="${{ github.repository }}"
          stars="$(gh api "repos/$repo" --jq .stargazers_count)"
          forks="$(gh api "repos/$repo" --jq .forks_count)"
          issues="$(gh api "repos/$repo" --jq .open_issues_count)"
          # Traffic endpoints need push access; degrade gracefully if denied.
          views="$(gh api "repos/$repo/traffic/views" --jq .count 2>/dev/null || echo n/a)"
          uviews="$(gh api "repos/$repo/traffic/views" --jq .uniques 2>/dev/null || echo n/a)"
          clones="$(gh api "repos/$repo/traffic/clones" --jq .count 2>/dev/null || echo n/a)"
          {
            echo "stars=$stars"; echo "forks=$forks"; echo "issues=$issues"
            echo "views=$views"; echo "uviews=$uviews"; echo "clones=$clones"
          } >> "$GITHUB_OUTPUT"

      - name: Open or update reassessment issue
        if: steps.decide.outputs.fire == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          date_utc="$(date -u +%Y-%m-%d)"
          title="Strategic Reassessment — ${date_utc}"
          gh label create "$LABEL" --color 5319e7 \
            --description "Periodic compass / drift check" 2>/dev/null || true

          body="$(cat <<EOF
          Automated strategic reassessment (trigger: \`${{ github.event_name }}\`, commits since last: ${{ steps.decide.outputs.commits_since }}).

          ## Metrics (auto-collected)
          - Stars: ${{ steps.metrics.outputs.stars }} · Forks: ${{ steps.metrics.outputs.forks }} · Open issues: ${{ steps.metrics.outputs.issues }}
          - Traffic — views: ${{ steps.metrics.outputs.views }} (unique ${{ steps.metrics.outputs.uviews }}) · clones: ${{ steps.metrics.outputs.clones }}
          - Commits to \`main\` since last reassessment: ${{ steps.decide.outputs.commits_since }}

          ## Checklist (answer the judgment parts)
          - [ ] WHY still true? (SPEC-northstar objective unchanged; anti-pivot contract holds)
          - [ ] New research / findings / what's been MISSED
          - [ ] Product outlook — human-user view & AI-agent/contributor view
          - [ ] Reach / visibility — README/landing quality, discoverability, rendered evidence
          - [ ] Evidence gates (SPEC §6) — LATENCY / ENERGY status
          - [ ] Verdict: on-track / drifting / pivot
          - [ ] Course-corrections (1–3)

          ## Output of this cycle
          1. Update \`docs/strategy/COMPASS.md\`.
          2. Add a dated snapshot \`docs/strategy/reassessments/${date_utc}.md\`.
          3. Post the verdict + course-corrections as a comment here.

          _See \`docs/strategy/COMPASS.md\` for the living view._
          EOF
          )"

          existing="$(gh issue list --label "$LABEL" --state open \
            --json number --jq '.[0].number' 2>/dev/null || echo "")"
          if [ -n "$existing" ]; then
            echo "Updating existing reassessment issue #$existing"
            gh issue comment "$existing" --body "$body"
          else
            echo "Creating new reassessment issue"
            gh issue create --title "$title" --label "$LABEL" --body "$body"
          fi

      - name: Reset merge counter
        if: steps.decide.outputs.fire == 'true'
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rev-parse HEAD > "$COUNTER_FILE"
          git add "$COUNTER_FILE"
          # [skip ci] prevents this bookkeeping push from re-triggering the workflow.
          git commit -m "chore(reassess): reset merge counter after reassessment [skip ci]" || exit 0
          git push || echo "counter push skipped (branch protection?) — non-fatal"
