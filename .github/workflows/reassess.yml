name: Strategic Reassessment

# Recurring, low-token "zoom-out / drift check" ritual.
#   TIMED:        every Monday 06:00 UTC.
#   CHANGE-BASED: every push to main, but only fires once >= N commits have
#                 landed since the last reassessment (counter file below).
#   MANUAL:       workflow_dispatch.
# When it fires, it auto-generates a dated snapshot skeleton in
# docs/strategy/reassessments/ pre-filled with API-collected metrics,
# complying with ADR-0016 (no GitHub issues for strategic tasks).
# Judgment (COMPASS.md update) is left to a human/agent via subsequent PR.
#
# FIX (audit 2026-07-20): the previous version used `cat <<EOF > "$doc_path"`
# with the heredoc body at indent=0. The enclosing `run: |` block scalar
# (indent=8) requires content at indent>=10, so YAML exited the block scalar
# at the first de-indented line and tried to parse the markdown body as YAML,
# failing at line 106 col 92 ("mapping values are not allowed here").
# 528/528 runs failed. This rewrite uses a Python script (read from a
# heredoc that IS properly indented) and reads all dynamic values from
# environment variables, so no ${{ }} expressions appear inside the Python
# string. The ${{ }} expressions live only in the `env:` block where YAML
# expects them.

on:
  schedule:
    - cron: "0 6 * * 1" # Mondays 06:00 UTC
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: write # update the merge counter and create reassessment markdown

env:
  REASSESS_EVERY_N_MERGES: "10"
  COUNTER_FILE: ".github/reassess-counter.txt"

jobs:
  reassess:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # need history for rev-list

      - name: Decide whether to fire
        id: decide
        run: |
          set -euo pipefail
          last="$(cat "$COUNTER_FILE" 2>/dev/null || echo "")"
          if [ -n "$last" ] && git cat-file -e "${last}^{commit}" 2>/dev/null; then
            n="$(git rev-list --count "${last}..HEAD" || echo 0)"
          else
            n=0
          fi
          fire=false
          case "${{ github.event_name }}" in
            schedule|workflow_dispatch) fire=true ;;
            push)
              # SECURITY (audit finding #9): the previous line used
              #   [ "$n" -ge "$REASSESS_EVERY_N_MERGES" ] && fire=true
              # under `set -e`. When n < threshold, the [ test returns 1,
              # the && list returns 1, and `set -e` exits the step before
              # writing the fire output — causing the whole job to fail.
              # Use an if/else instead so both branches are explicit.
              if [ "$n" -ge "$REASSESS_EVERY_N_MERGES" ]; then
                fire=true
              else
                fire=false
              fi
              ;;
          esac
          date_utc="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          echo "commits_since=$n" >> "$GITHUB_OUTPUT"
          echo "fire=$fire" >> "$GITHUB_OUTPUT"
          echo "date_utc=$date_utc" >> "$GITHUB_OUTPUT"
          echo "Event=${{ github.event_name }} commits_since=$n fire=$fire"

      - name: Collect metrics
        if: steps.decide.outputs.fire == 'true'
        id: metrics
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          repo="${{ github.repository }}"
          stars="$(gh api "repos/$repo" --jq .stargazers_count)"
          forks="$(gh api "repos/$repo" --jq .forks_count)"
          issues="$(gh api "repos/$repo" --jq .open_issues_count)"
          open_prs="$(gh api "repos/$repo/pulls?state=open" --jq length 2>/dev/null || echo 0)"
          # Traffic endpoints need push access; degrade gracefully if denied.
          views="$(gh api "repos/$repo/traffic/views" --jq .count 2>/dev/null || echo n/a)"
          uviews="$(gh api "repos/$repo/traffic/views" --jq .uniques 2>/dev/null || echo n/a)"
          clones="$(gh api "repos/$repo/traffic/clones" --jq .count 2>/dev/null || echo n/a)"

          # Internal project velocity & specification metrics
          #
          # BUG FIX (audit env-remediation 2026-07-21):
          # The previous `|| echo 0` pattern is harmful under
          # `set -o pipefail` when the upstream tool always emits a
          # count. `grep -c` and `wc -l` BOTH write "0" to stdout even
          # when there are zero matches, and `grep` exits 1 in that
          # case. With pipefail, the pipeline exits 1, so `|| echo 0`
          # runs and emits a SECOND "0". The captured variable then
          # contains "0\n0", and `echo "adrs=$adrs" >> "$GITHUB_OUTPUT"`
          # writes a second bare line `0` (no `=`), which the Actions
          # output parser rejects — causing this step to fail every
          # time `validated_research` has zero matches (which is the
          # current state of docs/research/).
          #
          # Fix: use `|| true` to suppress the pipefail exit code; the
          # count itself is already on stdout from `wc -l` / `grep -c`.
          adrs="$(ls docs/decisions/ 2>/dev/null | grep -c "\.md$" || true)"
          wip_research="$(grep -Rl 'Status: WIP' docs/research/ 2>/dev/null | wc -l || true)"
          validated_research="$(grep -Rl 'Status: Validated' docs/research/ 2>/dev/null | wc -l || true)"

          {
            echo "stars=$stars"; echo "forks=$forks"; echo "issues=$issues"; echo "open_prs=$open_prs"
            echo "views=$views"; echo "uviews=$uviews"; echo "clones=$clones"
            echo "adrs=$adrs"; echo "wip_research=$wip_research"; echo "validated_research=$validated_research"
          } >> "$GITHUB_OUTPUT"

      - name: Generate reassessment document
        if: steps.decide.outputs.fire == 'true'
        id: generate
        env:
          DATE_UTC: ${{ steps.decide.outputs.date_utc }}
          EVENT_NAME: ${{ github.event_name }}
          COMMITS_SINCE: ${{ steps.decide.outputs.commits_since }}
          STARS: ${{ steps.metrics.outputs.stars }}
          FORKS: ${{ steps.metrics.outputs.forks }}
          ISSUES: ${{ steps.metrics.outputs.issues }}
          OPEN_PRS: ${{ steps.metrics.outputs.open_prs }}
          VIEWS: ${{ steps.metrics.outputs.views }}
          UVIEWS: ${{ steps.metrics.outputs.uviews }}
          CLONES: ${{ steps.metrics.outputs.clones }}
          ADRS: ${{ steps.metrics.outputs.adrs }}
          WIP_RESEARCH: ${{ steps.metrics.outputs.wip_research }}
          VALIDATED_RESEARCH: ${{ steps.metrics.outputs.validated_research }}
        run: |
          set -euo pipefail
          doc_path="docs/strategy/reassessments/${DATE_UTC%%T*}-reassessment.md"
          mkdir -p "$(dirname "$doc_path")"
          # Write the Python generator script to a temp file so we avoid
          # heredoc-in-YAML indentation pitfalls. The script reads everything
          # from environment variables.
          gen_script="$(mktemp)"
          cat > "$gen_script" <<'PYGEN'
          import os
          import pathlib

          date_utc = os.environ["DATE_UTC"]
          event_name = os.environ["EVENT_NAME"]
          commits_since = os.environ["COMMITS_SINCE"]
          stars = os.environ.get("STARS", "n/a")
          forks = os.environ.get("FORKS", "n/a")
          issues = os.environ.get("ISSUES", "n/a")
          open_prs = os.environ.get("OPEN_PRS", "n/a")
          views = os.environ.get("VIEWS", "n/a")
          uviews = os.environ.get("UVIEWS", "n/a")
          clones = os.environ.get("CLONES", "n/a")
          adrs = os.environ.get("ADRS", "n/a")
          wip_research = os.environ.get("WIP_RESEARCH", "n/a")
          validated_research = os.environ.get("VALIDATED_RESEARCH", "n/a")
          doc_path = os.environ["DOC_PATH"]

          lines = [
              "# Strategic Reassessment - " + date_utc,
              "",
              "Automated strategic reassessment (trigger: `" + event_name + "`, commits since last: " + commits_since + ").",
              "",
              "## Quantitative Metrics (Auto-collected)",
              "### Community & Traffic",
              "- **Stars:** " + stars + " - **Forks:** " + forks,
              "- **Traffic:** " + views + " views (unique " + uviews + ") - " + clones + " clones",
              "",
              "### Project Velocity & Health",
              "- **Commits to `main` since last check:** " + commits_since,
              "- **Tracker:** " + issues + " Open Issues - " + open_prs + " Open PRs",
              "- **Architecture (ADRs):** " + adrs + " active decisions",
              "- **Research Pipeline:** " + wip_research + " WIP slots - " + validated_research + " Validated slots",
              "",
              "---",
              "",
              "## Qualitative Assessment (Judgment)",
              "",
              "### 1. North Star & Anti-Pivot Contract",
              "- [ ] **Objective:** Are we still exclusively minimizing avoidable platform energy subject to a per-workload-class responsiveness floor?",
              "- [ ] **Guardrails:** Are we honoring `docs/non-goals.md`? (e.g., No competing daemons, no black-box ML, deterministic policies only)",
              "",
              "### 2. Implementation & Hardware Gates",
              "- [ ] **Hardware Allowlist Coverage:** Are our reference laptops (T14, XPS 13, Framework, Legion) fully mapped in `docs/research/0006` and unblocked?",
              "- [ ] **Telemetry Budget:** Is the observability layer (optid telemetry) strictly staying under the <0.1% CPU polling budget?",
              "- [ ] **Depth-Enablers (SPEC 4.3):** Are NVMe/dGPU/Display power states functioning without breaching latency floors?",
              "",
              "### 3. Pipeline & Blockers",
              "- [ ] **Research:** What is the most critical `WIP` research slot blocking runtime implementation right now?",
              "- [ ] **Security/Ops:** Is the reproducible-build (ADR-0012) and UKI-signing discipline being maintained?",
              "",
              "### 4. Verdict & Course Corrections",
              "- [ ] **Verdict:** [ On-track | Drifting | Pivot Required ]",
              "- [ ] **Course-corrections** (1-3 highly specific, actionable items):",
              "  1.",
              "  2.",
              "  3.",
              "",
              "## Output of this cycle",
              "1. Update `docs/strategy/COMPASS.md` with any macro-shifts.",
              "2. Commit this file with judgments filled out.",
              "",
              "_See `docs/strategy/COMPASS.md` for the living view._",
              "",
          ]
          pathlib.Path(doc_path).write_text("\n".join(lines))
          PYGEN
          # Strip the leading 10-space indent that the heredoc body has
          # (because YAML block scalar required it for the heredoc body
          # but Python does not want it).
          sed -i 's/^          //' "$gen_script"
          DOC_PATH="$doc_path" python3 "$gen_script"
          rm -f "$gen_script"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$doc_path"
          echo "doc_path=$doc_path" >> "$GITHUB_OUTPUT"

      - name: Reset merge counter & commit
        if: steps.decide.outputs.fire == 'true'
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rev-parse HEAD > "$COUNTER_FILE"
          git add "$COUNTER_FILE"
          # SECURITY (audit finding #9): the previous commit message used
          # \$(date -u +%Y-%m-%d) inside a double-quoted heredoc/EOF context,
          # which caused the backslash to be emitted literally instead of
          # invoking date. Use a shell variable assigned before the commit
          # so the date is expanded correctly.
          DATE_STR="$(date -u +%Y-%m-%d)"
          # [skip ci] prevents this bookkeeping push from re-triggering the workflow.
          git commit -m "docs(strategy): auto-generate reassessment for ${DATE_STR} [skip ci]" || exit 0
          git push || echo "counter push skipped (branch protection?) - non-fatal"
