fn stale_cpu_idle(previous: Option<&RuntimeObservabilitySnapshot>) -> Vec<CpuIdleObservation> {
    previous
        .map(|previous| {
            previous
                .cpu_idle
                .iter()
                .cloned()
                .map(|mut entry| {
                    entry.status = ObservationStatus::Stale;
                    entry.time_delta_us = CounterDelta::default();
                    entry.usage_delta = CounterDelta::default();
                    entry
                })
                .collect()
        })
        .unwrap_or_default()
}

