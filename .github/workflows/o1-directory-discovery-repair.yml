name: O1 directory discovery repair

on:
  push:
    branches:
      - work/20260906-o1-directory-discovery-truth

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply and verify bounded repair
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/o1-repair.py
          rm .github/o1-repair.py
          rm .github/workflows/o1-directory-discovery-repair.yml
          cargo fmt --all
          cargo test -p optid --bin optid-observe
          cargo test -p optid --test o1_runtime_status
          python3 tools/validate-optid-packages.py
          python3 tools/validate-current-work.py
          python3 tools/check-workflow-safety.py

          unexpected="$(git diff --name-only | grep -Ev '^(crates/optid/src/runtime_observability.rs|crates/optid/tests/o1_runtime_status.rs|docs/plans/optid-package-status.toml|\.github/o1-repair.py|\.github/workflows/o1-directory-discovery-repair.yml)$' || true)"
          if [[ -n "$unexpected" ]]; then
            echo "Unexpected changed files:"
            echo "$unexpected"
            exit 1
          fi

          git config user.name "Rush coordinating agent"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "fix(optid): surface runtime discovery failures"
          git push origin HEAD:work/20260906-o1-directory-discovery-truth
