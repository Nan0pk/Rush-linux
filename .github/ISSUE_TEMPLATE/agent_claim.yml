name: Agent work claim
description: Coordinate temporary ownership of a bounded Rush work surface between concurrent workers.
title: "[agent-claim] "
body:
  - type: markdown
    attributes:
      value: |
        This issue coordinates workers only. It does not change Rush's current-work selector, package ledger, package completion, release truth, or review requirements. Read `docs/agent-coordination.md`, `AGENTS.md`, and `docs/agent-protocol.md` before using it.

  - type: input
    id: work
    attributes:
      label: Canonical work
      description: Package, plan item, or other owner-authorized work this claim belongs to.
      placeholder: thermal sensing and budget-model package (T1)
    validations:
      required: true

  - type: input
    id: worker
    attributes:
      label: Worker/session
      description: Identify the worker and session so another agent can distinguish it.
      placeholder: claude-code:laptop-7
    validations:
      required: true

  - type: dropdown
    id: role
    attributes:
      label: Role
      options:
        - builder
        - reviewer
        - coordinator
        - verifier
    validations:
      required: true

  - type: textarea
    id: scope
    attributes:
      label: Bounded scope
      description: State the exact subsystem/files you expect to touch and what you are not claiming.
      placeholder: "Working on runtime-status fail-closed handling; not touching D1 delay selection or other live-use gates."
    validations:
      required: true

  - type: input
    id: branch
    attributes:
      label: Branch or pull request
      description: Fill this when known; update the issue when it changes.
      placeholder: work/20260912-example or #472

  - type: dropdown
    id: state
    attributes:
      label: Coordination state
      options:
        - working
        - review-ready
        - reviewing
        - fix-required
        - merge-ready
        - blocked
        - handed-off
        - finished
    validations:
      required: true

  - type: input
    id: lease
    attributes:
      label: Lease expiry (UTC)
      description: When you expect this claim to stop being actively refreshed. Expiry alone never authorizes overwriting work.
      placeholder: 2026-09-13T01:30:00Z
    validations:
      required: true

  - type: checkboxes
    id: acknowledgements
    attributes:
      label: Coordination checks
      options:
        - label: I checked current-work/package state, open claims, pull requests, recent branches/commits, and overlapping review activity before claiming this work.
          required: true
        - label: I understand that a stale claim is not proof that work is abandoned; takeover requires checking the branch/PR/activity first.
          required: true
        - label: This issue is coordination metadata only and cannot prove a package complete or alter release evidence.
          required: true
