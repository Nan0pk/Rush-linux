[advisories]
yanked = "deny"
unmaintained = "workspace"
unsound = "all"
ignore = [
    {
        id = "RUSTSEC-2026-0370",
        reason = "Defer only this deprecation advisory until a separately reviewed zbus 6/API and MSRV alignment migration: the current zbus 5 line still depends on zvariant 5, while zbus 6 requires Rust 1.89. Reassess by 2027-04-26.",
    },
]

[licenses]
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MIT",
    "BSD-3-Clause",
    "BSD-2-Clause",
    "Unicode-3.0",
]
confidence-threshold = 0.8

[bans]
multiple-versions = "warn"
wildcards = "deny"
highlight = "all"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
